name: Publicar Hearthblade (Ação)

# Este repositório só PUBLICA o jogo. O código-fonte fica em peterpedrons-maker/neon-wars.
# O endereço fica fora de /neon-wars/, então o Chrome permite instalar o app mesmo que o
# "Neon Wars" ou o jogo tático já estejam instalados no celular.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: peterpedrons-maker/neon-wars
          ref: main
          path: src
      - name: Montar o site
        run: |
          mkdir -p dist/lendas-de-taverna
          cp -r src/hearthblade/. dist/
          cp -r src/lendas-de-taverna/assets src/lendas-de-taverna/mmo dist/lendas-de-taverna/
          cp src/lendas-de-taverna/index.html src/lendas-de-taverna/manifest.json dist/lendas-de-taverna/ 2>/dev/null || true
          # no repositório de origem o invólucro está um nível acima do jogo; aqui o jogo fica dentro do site
          sed -i 's#\.\./lendas-de-taverna/mmo/#./lendas-de-taverna/mmo/#g' dist/index.html
          touch dist/.nojekyll
          echo "origem: $(git -C src rev-parse HEAD)" > dist/versao.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
