<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recrutar — mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Rubik:wght@400;500;600&display=swap">
<style>
:root{--mesa:#14100d;--madeira:#2a1f17;--borda:#5a4330;--papel:#efe2c4;--papel-2:#e0cfa8;--tinta:#2b1e15;--ouro:#e9b949;--ouro-2:#a97e22;--nevoa:#a8a39a;--f-display:"Pixelify Sans",ui-monospace,monospace;--f-body:"Rubik",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0b0806;color:var(--papel);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(#2a1a10,#120b08);position:relative;overflow:hidden}
.px{image-rendering:pixelated}
.head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(#35261b,#241a12);border-bottom:2px solid var(--borda)}
.back{height:38px;padding:0 12px 0 8px;border-radius:10px;border:2px solid var(--borda);background:#0006;color:var(--papel);font:700 13px var(--f-display);display:flex;align-items:center;gap:4px}
.head h2{margin:0;font:700 17px var(--f-display);flex:1;line-height:1.1}.head h2 small{display:block;font:500 11px var(--f-body);color:var(--nevoa);letter-spacing:.5px;margin-top:2px}
.roll{height:38px;padding:0 12px;border-radius:10px;border:2px solid var(--ouro-2);background:#0006;color:var(--ouro);font:700 13px var(--f-display)}
.tabs{display:flex;background:#1a120d;border-bottom:2px solid var(--borda)}
.tab{flex:1;text-align:center;padding:9px 4px 8px;font:700 13px var(--f-display);color:var(--nevoa);position:relative}
.tab.on{color:var(--ouro)}.tab.on:after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;background:var(--ouro);border-radius:3px 3px 0 0}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 8px;background:#150e0a;border-bottom:2px solid var(--borda);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.cd{flex:0 0 78px;border-radius:12px;border:2px solid #4a392a;background:#241a12;padding:6px 4px 5px;text-align:center;position:relative;cursor:pointer;transition:.15s}
.cd .pt{height:54px;border-radius:8px;background:radial-gradient(circle at 50% 30%,#4a2f7a,#1b1230);display:grid;place-items:center;margin-bottom:4px}
.cd .pt img{width:40px;height:40px}
.cd b{display:block;font:700 12px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd small{display:block;font-size:10px;color:var(--nevoa);margin-top:1px}
.cd.on{border-color:var(--ouro);background:#3a2a1c;box-shadow:0 0 14px #e9b94955;transform:translateY(-2px)}
.cd .ck{position:absolute;right:-5px;top:-6px;width:20px;height:20px;border-radius:50%;background:#6cc35e;color:#10230c;font:700 12px/20px var(--f-display);text-align:center;display:none;border:2px solid #14100d}
.cd.hired .ck{display:block}.cd.hired{opacity:.8}
.cd .sib{position:absolute;left:4px;top:4px;font:700 8px var(--f-display);background:#a97e22;color:#2b1e15;border-radius:4px;padding:0 4px}
.body{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.card{border-radius:14px;border:2px solid var(--borda);background:linear-gradient(#2d2118,#211810);padding:11px 12px}
.card h4{margin:0 0 8px;font:700 12px var(--f-display);letter-spacing:1.5px;color:var(--ouro);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.card h4 em{font:500 11px var(--f-body);letter-spacing:0;color:var(--nevoa);text-transform:none;font-style:normal}
.top{display:flex;gap:12px}
.big{flex:0 0 96px;height:120px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#55358f,#1b1230);border:2px solid var(--ouro-2);display:grid;place-items:center;box-shadow:0 0 18px #7d52d466}
.big img{width:72px;height:72px}
.nm{font:700 22px var(--f-display);line-height:1}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.tg{font:600 10px var(--f-display);padding:2px 8px;border-radius:99px;border:1px solid #5a4330;background:#0006;color:var(--papel-2)}
.tg.g{color:#ffd37a;border-color:#a97e22;background:#a97e2233}
.note{font-size:12px;line-height:1.4;color:#f0dfb9;margin:3px 0}.note b{color:var(--ouro)}.note.af b{color:#9fe0a0}
.bar{height:10px;border-radius:5px;background:#0008;border:1px solid #000;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(#e26a5a,#b8402f)}
.bl{display:flex;justify-content:space-between;font-size:11px;color:var(--papel-2);margin:7px 0 3px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st{background:#0005;border-radius:9px;padding:6px 8px}.st em{display:flex;align-items:center;gap:4px;font-style:normal;font-size:10px;color:var(--nevoa)}.st em img{width:14px;height:14px}.st b{font:700 17px var(--f-display)}
.at{display:grid;grid-template-columns:96px 28px 1fr;align-items:center;gap:6px;font-size:12px;margin:3px 0}.at .m{height:7px;border-radius:4px;background:#0008;overflow:hidden}.at .m i{display:block;height:100%;background:linear-gradient(#7fb2f2,#3e72b8)}.at.hi .m i{background:linear-gradient(#a6e08a,#5ba03e)}.at b{font:700 14px var(--f-display);text-align:right}
.sl{display:flex;gap:6px}.s{flex:1;height:50px;border-radius:10px;border:2px solid #6b5640;background:#0006;display:grid;place-items:center;color:#6b5640;font-size:18px}.s.on{border-color:var(--ouro);background:#e9b94922;color:var(--papel)}
.s small{font-size:9px;color:#cdb68a;display:block;text-align:center}
.eq{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px}.eq div{background:#0005;border-radius:8px;padding:6px 8px;color:var(--papel-2)}.eq b{color:var(--papel)}
.foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#120b08 30%);display:flex;gap:8px}
.cta{flex:1;height:54px;border-radius:12px;border:2px solid #7a5d1d;background:linear-gradient(#f0c150,#b88626);color:#2b1e15;font:700 17px var(--f-display);box-shadow:0 3px 0 #5b4310}
.cta.off{background:linear-gradient(#6a8f5f,#3f6137);border-color:#2a4425;color:#e8ffe0;box-shadow:0 3px 0 #1c2f19}
.nv{flex:0 0 54px;height:54px;border-radius:12px;border:2px solid var(--borda);background:#0006;color:var(--papel);font:700 22px var(--f-display)}
.sw{position:absolute;left:0;right:0;top:204px;text-align:center;font:600 10px var(--f-display);letter-spacing:2px;color:#8a7560;pointer-events:none;opacity:.0}
.hint{font-size:11px;color:var(--nevoa);text-align:center;padding:0 12px 2px}
.mock{position:absolute;top:6px;right:8px;font:600 9px var(--f-display);color:#8a7560;letter-spacing:1px;z-index:5}
</style></head><body><div class="app">

  <div class="st"><em><img class="px" src="${I.t_mov}">Mover</em><b>${h.mov}</b></div><div class="st"><em><img class="px" src="${I.t_alc}">Alcance</em><b>${h.alc}</b></div><div class="st"><em><img class="px" src="${I.t_crit}">Crítico</em><b>${h.cr}</b></div>
  <div class="st"><em><img class="px" src="${I.t_ini}">Iniciativa</em><b>${h.ini}</b></div><div class="st"><em><img class="px" src="${I.t_dano}">Dano</em><b>${h.dmg}</b></div><div class="st"><em><img class="px" src="${I.t_vida}">Vida</em><b>${h.hp}</b></div></div></div>
 <div class="card"><h4>Atributos <em>▲ afinidade</em></h4>${N.map((a,i)=>`<div class="at ${h.hi.includes(i)?'hi':''}"><span>${a}${h.hi.includes(i)?' <small style="color:#9fe0a0">▲</small>':''}</span><b>${h.at[i]}</b><div class="m"><i style="width:${Math.min(100,h.at[i]/30*100)}%"></i></div></div>`).join('')}</div>
 <div class="card"><h4>Habilidades <em>${h.pa} passivas aprendidas</em></h4><div class="sl">${h.sk.map(s=>s?`<div class="s on"><div>✦<small>${s}</small></div></div>`:`<div class="s">+</div>`).join('')}</div></div>
 <div class="card"><h4>Equipamento</h4><div class="eq"><div><b>Arma:</b> ${h.ar}</div><div><b>Armadura:</b> ${h.am}</div></div></div>`;
 document.getElementById('body').scrollTop=0;
 const c=document.getElementById('cta');c.textContent=hired.has(sel)?'✓ Contratado (tocar para desfazer)':'Contratar';c.className='cta'+(hired.has(sel)?' off':'');
 document.querySelector('.cd.on').scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
document.getElementById('cta').onclick=()=>{hired.has(sel)?hired.delete(sel):hired.add(sel);draw()};
document.getElementById('pv').onclick=()=>{sel=(sel+H.length-1)%H.length;draw()};
document.getElementById('nx').onclick=()=>{sel=(sel+1)%H.length;draw()};
let x0=null;const b=document.getElementById('body');b.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});b.addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70){sel=(sel+(d<0?1:H.length-1))%H.length;draw()}x0=null});
draw();
</script></body></html>
