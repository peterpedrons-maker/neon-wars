<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Árvore de Habilidades — Mago</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Rubik:wght@400;500;600&display=swap">
<style>
:root{--mesa:#14100d;--madeira:#2a1f17;--madeira-2:#3b2c20;--borda:#5a4330;--papel:#efe2c4;--papel-2:#e0cfa8;--tinta:#2b1e15;--tinta-2:#6a5643;--ouro:#e9b949;--ouro-2:#a97e22;--sangue:#d4503f;--mana:#79a8ec;--vida:#6cc35e;--nevoa:#a8a39a;
--c-tronco:#e9b949;--c-piro:#f0782f;--c-geo:#5fc4d8;--c-ponte:#b58cf0;
--f-display:"Pixelify Sans",ui-monospace,monospace;--f-body:"Rubik",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0806;color:var(--papel);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--mesa);overflow:hidden;box-shadow:0 0 60px #000}
img.px,.px{image-rendering:pixelated}
/* topo */
.top{padding:10px 12px 8px;background:linear-gradient(#2a1f17,#1d1510);border-bottom:2px solid var(--borda);position:relative;z-index:5}
.who{display:flex;align-items:center;gap:10px}
.portrait{width:46px;height:46px;border:2px solid var(--ouro-2);border-radius:8px;background:radial-gradient(circle at 50% 30%,#4a2f7a,#1b1230);display:grid;place-items:center;box-shadow:0 0 12px #7d52d466}
.portrait img{width:34px;height:34px}
.who h1{margin:0;font:700 18px var(--f-display);letter-spacing:.5px}
.who small{display:block;color:var(--nevoa);font-size:11px;margin-top:1px}
.pts{margin-left:auto;text-align:center;background:#000a;border:2px solid var(--ouro-2);border-radius:10px;padding:4px 12px}
.pts b{display:block;font:700 22px/1 var(--f-display);color:var(--ouro)}
.pts span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--papel-2)}
.classes{display:flex;gap:6px;margin-top:9px}
.classes .c{flex:1;height:34px;border-radius:7px;border:2px solid var(--borda);background:#00000055;display:grid;place-items:center;opacity:.55}
.classes .c img{width:22px;height:22px}
.classes .c.on{opacity:1;border-color:var(--ouro);background:#e9b94922;box-shadow:inset 0 0 8px #e9b94955}
.chips{display:flex;gap:6px;margin-top:8px}
.chip{flex:1;font:600 12px var(--f-display);padding:6px 4px;border-radius:7px;border:2px solid var(--borda);background:#0007;color:var(--papel);text-align:center;cursor:pointer;display:flex;gap:5px;align-items:center;justify-content:center}
.chip img{width:16px;height:16px}
.chip.t{border-color:#e9b94988}.chip.p{border-color:#f0782f88}.chip.g{border-color:#5fc4d888}
.chip.on{background:#ffffff18}
/* resumo */
.sum{display:flex;gap:6px;overflow:auto;padding:7px 10px;background:#0d0a08;border-bottom:1px solid #3b2c20;scrollbar-width:none}
.sum::-webkit-scrollbar{display:none}
.sum div{flex:0 0 auto;font-size:11px;padding:3px 8px;border-radius:99px;background:#2a1f17;border:1px solid #5a4330;color:var(--papel-2);white-space:nowrap;display:flex;gap:5px;align-items:center}
.sum div img{width:14px;height:14px}.sum b{color:var(--ouro);font-weight:600}
/* árvore */
.scroller{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#5a4330 transparent}
.world{position:relative;width:360px;height:1190px;margin:0 auto;
 background:
  radial-gradient(160px 280px at 70px 560px,#f0782f26,transparent 70%),
  radial-gradient(160px 280px at 292px 560px,#5fc4d826,transparent 70%),
  radial-gradient(140px 200px at 180px 970px,#e9b94924,transparent 70%),
  radial-gradient(90px 160px at 180px 450px,#b58cf022,transparent 70%)}
.world:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff22 1px,transparent 1.2px),radial-gradient(#ffffff14 1px,transparent 1.2px);background-size:46px 46px,29px 29px;background-position:0 0,13px 17px;opacity:.5}
svg.links{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;left:0;right:0;text-align:center;font:700 11px var(--f-display);letter-spacing:4px;text-transform:uppercase;opacity:.5}
.lab.p{color:var(--c-piro);left:0;width:150px}.lab.g{color:var(--c-geo);left:auto;right:0;width:150px}.lab.t{color:var(--c-tronco)}.lab.b{color:var(--c-ponte)}
.tier{position:absolute;left:0;right:0;border-top:1px dashed #5a433066;font:10px var(--f-display);color:#8a7560;text-align:right;padding:1px 6px;letter-spacing:1px}
/* nós */
.node{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;cursor:pointer;--c:var(--c-tronco);touch-action:manipulation;z-index:2}
.node.p{--c:var(--c-piro)}.node.g{--c:var(--c-geo)}.node.b{--c:var(--c-ponte)}
.node .ic{position:relative;z-index:1;display:block;background-repeat:no-repeat;image-rendering:pixelated;background-size:contain;background-position:center}
.node .nm{position:absolute;top:100%;margin-top:3px;width:92px;text-align:center;font:600 10px/1.1 var(--f-display);color:var(--papel);text-shadow:0 1px 0 #000,0 0 4px #000;pointer-events:none;left:50%;transform:translateX(-50%)}
.node.s .nm{display:none}
.ic.mk{background-color:var(--tint,#cdbb98);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.node.on .ic.mk{--tint:color-mix(in srgb,var(--c) 35%,#fff)}
.node.lock .ic.mk{--tint:#8a7560}
.sh-ic .ic.mk{--tint:color-mix(in srgb,var(--c) 35%,#fff)}
/* pequeno: círculo */
.node.s{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3b2c20,#17100b);border:2px solid #6b5640;box-shadow:inset 0 0 6px #000}
.node.s .ic{width:20px;height:20px}
/* médio: losango (passiva) */
.node.m{width:46px;height:46px}
.node.m:before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border-radius:7px;background:radial-gradient(circle at 40% 30%,#3b2c20,#17100b);border:2px solid #6b5640;box-shadow:inset 0 0 8px #000}
.node.m .ic{width:26px;height:26px}
/* grande: medalhão (ativa) */
.node.l{width:64px;height:64px}
.node.l:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,#6b5640,#3b2c20,#6b5640,#3b2c20,#6b5640);border:2px solid #7a6247;box-shadow:0 3px 8px #000}
.node.l:after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#35261b,#120c08);box-shadow:inset 0 0 10px #000,0 0 0 2px #00000099}
.node.l .ic{width:36px;height:36px}
.cd{position:absolute;right:-4px;bottom:-2px;z-index:3;font:700 10px var(--f-display);background:#0c0805;border:1.5px solid #6b5640;border-radius:99px;padding:0 5px;color:var(--papel-2);display:flex;gap:2px;align-items:center}
.cd i{font-style:normal;font-size:9px}
.cost{position:absolute;left:-3px;top:-3px;z-index:3;font:700 10px var(--f-display);width:17px;height:17px;border-radius:50%;background:#0c0805;border:1.5px solid #6b5640;color:var(--papel-2);display:grid;place-items:center}
/* estados */
.node.lock{filter:saturate(.45) brightness(.78)}
.node.lock.s,.node.lock.m:before,.node.lock.l:before{border-color:color-mix(in srgb,var(--c) 35%,#6b5640)}
.node .ic:not(.mk){filter:brightness(1.4) contrast(1.1)}
.node.lock .nm{opacity:.55}
.node.can{animation:pulse 1.8s ease-in-out infinite}
.node.can.s,.node.can.l:before{border-color:var(--c)}
.node.can.m:before{border-color:var(--c)}
.node.can.l:before{box-shadow:0 0 10px var(--c),0 3px 8px #000}
@keyframes pulse{50%{filter:drop-shadow(0 0 7px var(--c)) brightness(1.15)}}
.node.on.s{border-color:var(--c);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 45%,#2a1f17),#1a110b);box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 6px #0008}
.node.on.m:before{border-color:var(--c);background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--c) 50%,#2a1f17),#1a110b);box-shadow:0 0 12px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 8px #0008}
.node.on.l:before{background:conic-gradient(from 30deg,var(--c),#fff8,var(--c),#0006,var(--c));border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 75%,transparent),0 3px 8px #000}
.node.on.l:after{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 35%,#35261b),#120c08)}
.node.sel:after{}
.node.sel .sel-ring{display:block}
.sel-ring{display:none;position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--papel);animation:spin 6s linear infinite;z-index:0}
.node.m .sel-ring{inset:-5px}
@keyframes spin{to{transform:rotate(360deg)}}
.node.sel{z-index:4}
/* folha */
.sheet{position:relative;z-index:6;background:linear-gradient(#2a1f17,#1d1510);border-top:2px solid var(--ouro-2);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 24px #000b}
.sh-top{display:flex;gap:10px;align-items:flex-start}
.sh-ic{flex:0 0 58px;height:58px;border-radius:12px;border:2px solid var(--c,var(--ouro));background:radial-gradient(circle at 50% 30%,#35261b,#120c08);display:grid;place-items:center;box-shadow:0 0 14px color-mix(in srgb,var(--c,var(--ouro)) 45%,transparent)}
.sh-ic .ic{width:40px;height:40px;background-repeat:no-repeat;image-rendering:pixelated}
.sh-t h2{margin:0;font:700 17px var(--f-display)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tg{font:600 10px var(--f-display);padding:2px 7px;border-radius:99px;border:1px solid;letter-spacing:.3px;display:flex;gap:4px;align-items:center}
.tg img{width:12px;height:12px}
.tg.a{color:#ffd37a;border-color:#a97e22;background:#a97e2233}
.tg.pa{color:#a9d6ff;border-color:#4b78a8;background:#4b78a833}
.tg.alt{color:#9be07a;border-color:#4d8a38;background:#4d8a3833}
.tg.st{color:#ff9d8a;border-color:#a8483a;background:#a8483a33}
.tg.cdt{color:var(--papel-2);border-color:#5a4330;background:#0006}
.tg.pt{color:#e8c8ff;border-color:#8a5cc0;background:#8a5cc033}
.desc{font-size:12.5px;line-height:1.4;color:var(--papel);margin:8px 0 6px;min-height:34px}
.desc b{color:var(--ouro);font-weight:600}
.row{display:flex;gap:8px}
.btn{flex:1;font:700 14px var(--f-display);padding:10px 8px;border-radius:9px;border:2px solid #7a5d1d;background:linear-gradient(#e9b949,#b88626);color:#2b1e15;cursor:pointer;box-shadow:0 3px 0 #5b4310;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5b4310}
.btn.sec{flex:0 0 auto;background:#00000066;color:var(--papel);border-color:var(--borda);box-shadow:0 3px 0 #000;padding:10px 12px;font-size:12px}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.hint{font-size:10.5px;color:var(--nevoa);margin-top:6px;text-align:center}
.toast{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:#000c;border:1px solid var(--ouro-2);padding:6px 12px;border-radius:99px;font:600 12px var(--f-display);color:var(--ouro);opacity:0;transition:.3s;z-index:9;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.mock{position:absolute;top:6px;right:8px;font:600 9px var(--f-display);color:#8a7560;letter-spacing:1px;z-index:7;pointer-events:none}
</style></head><body>

    e.innerHTML=`<span class="sel-ring"></span><span class="ic${I[n.ic].u?' mk':''}" style="${icStyle(n.ic)}"></span>`+
      (n.z!=='s'?`<span class="nm">${n.n}</span>`:'')+
      (n.z==='l'?`<span class="cd"><i>⏱</i>${n.cd}</span>`:'')+
      (st==='can'?`<span class="cost">${n.c}</span>`:'');
    e.onclick=()=>{sel=n.id;build();sheet()};
    w.appendChild(e);
  });
  links();summary();$('#pts').textContent=pts;
}
function links(){
  const s=$('#links');let h='';
  N.forEach(n=>n.pais.forEach(p=>{
    const a=by[p],b=n;
    const on=learned.has(a.id)&&learned.has(b.id), open=learned.has(a.id)&&!learned.has(b.id);
    const c=COL[b.r];
    const my=(a.y+b.y)/2;
    const d=`M${a.x} ${a.y} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`;
    if(on)h+=`<path d="${d}" stroke="${c}" stroke-width="7" fill="none" opacity=".18"/><path d="${d}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    else h+=`<path d="${d}" stroke="${open?c:'#5a4330'}" stroke-width="2.5" fill="none" stroke-dasharray="${open?'2 6':'3 5'}" stroke-linecap="round" opacity="${open?.9:.55}"/>`;
  }));
  s.innerHTML=h;
}
function summary(){
  const L=[...learned].map(i=>by[i]);
  const act=L.filter(n=>n.t==='A').length,pas=L.filter(n=>n.t==='P'&&n.id!=='raiz').length,st=L.filter(n=>n.t==='S').length;
  const spent=L.reduce((a,n)=>a+n.c,0);
  $('#sum').innerHTML=`<div><img class="px" src="${IMG['ui-icons/fire-gem.png']}">Ativas <b>${act}</b></div><div><img class="px" src="${IMG['ui-icons/sparkles.png']}">Passivas <b>${pas}</b></div><div><img class="px" src="${IMG['ui-icons/livro.png']||IMG['ui-icons/spell-book.png']}">Atributos <b>${st}</b></div><div><img class="px" src="${IMG['ui-icons/coins.png']}">Gastos <b>${spent}</b></div>`;
}
const kids=id=>N.filter(n=>n.pais.includes(id)&&learned.has(n.id));
function canRefund(n){
  if(n.id==='raiz')return false;
  const t=new Set(learned);t.delete(n.id);
  // tudo que sobrar precisa continuar conectado à raiz
  const ok=new Set(['raiz']);let ch=true;
  while(ch){ch=false;N.forEach(m=>{if(t.has(m.id)&&!ok.has(m.id)&&m.pais.some(p=>ok.has(p))){ok.add(m.id);ch=true}})}
  return [...t].every(i=>ok.has(i));
}
function sheet(){
  const n=by[sel],st=state(n);
  const typeTag=n.t==='A'?'<span class="tg a">ATIVA</span>':n.t==='P'?'<span class="tg pa">PASSIVA</span>':'<span class="tg pa">ATRIBUTO</span>';
  const tags=(n.tg||[]).map(([k,t])=>`<span class="tg ${k}">${k==='alt'?'▲ ':''}${t}</span>`).join('');
  const sz={s:'Pequeno',m:'Médio',l:'Grande'}[n.z];
  const cdt=n.t==='A'?`<span class="tg cdt">⏱ recarga ${n.cd}</span>`:'';
  const miss=!learned.has(n.id)&&!avail(n)&&!n.fake?`<div class="hint">Precisa de: ${n.pais.map(p=>by[p].n).join(' ou ')}</div>`:'';
  const prevIc=`<span class="ic${I[n.ic].u?' mk':''}" id="shic" style="${icStyle(n.ic)}"></span>`;
  let btn;
  if(n.fake)btn=`<div class="btn" style="filter:grayscale(1) brightness(.6)">Em breve</div>`;
  else if(st==='on')btn=n.id==='raiz'?`<div class="btn" style="filter:grayscale(.6) brightness(.8)">Aprendido</div>`:`<div class="btn sec" style="flex:1;font-size:13px" id="ref" ${canRefund(n)?'':'data-no=1'}>${canRefund(n)?'Desaprender (grátis)':'Outros nós dependem deste'}</div>`;
  else if(st==='can')btn=`<div class="btn" id="learn" ${pts<n.c?'disabled':''}>${pts<n.c?'Faltam '+(n.c-pts)+' pt':'Aprender · '+n.c+' pt'+(n.c>1?'s':'')}</div>`;
  else btn=`<div class="btn" style="filter:grayscale(1) brightness(.5)">Bloqueado</div>`;
  $('#sheet').style.setProperty('--c',COL[n.r]);
  $('#sheet').innerHTML=`<div class="sh-top"><div class="sh-ic" style="--c:${COL[n.r]}">${prevIc}</div><div class="sh-t"><h2>${n.n}</h2><div class="tags">${typeTag}<span class="tg cdt">${sz} · custo ${n.c}</span>${cdt}${tags}</div></div></div>
   <div class="desc">${n.d}</div>${miss}
   <div class="row">${btn}<div class="btn sec" id="auto">Automático</div><div class="btn sec" id="zero">Zerar</div></div>
   <div class="hint">Respec é grátis. “Automático” segue o perfil do Mago.</div>`;
  const L=$('#learn');if(L)L.onclick=()=>{if(pts<n.c)return;pts-=n.c;learned.add(n.id);toast('Aprendeu '+n.n);build();sheet()};
  const R=$('#ref');if(R&&!R.dataset.no)R.onclick=()=>{learned.delete(n.id);pts+=n.c;toast('Pontos devolvidos: '+n.c);build();sheet()};
  $('#zero').onclick=()=>{let tot=0;[...learned].forEach(i=>{if(i!=='raiz'){tot+=by[i].c;learned.delete(i)}});pts+=tot;toast('Árvore zerada');build();sheet()};
  $('#auto').onclick=()=>{const ord=['mente','int1','fogo','int2','chama','comb','brasa','choque','res1','escudo','piro','sabio','muro','meteoro'];ord.forEach(i=>{const m=by[i];if(!learned.has(i)&&avail(m)&&pts>=m.c){pts-=m.c;learned.add(i)}});toast('Distribuído pelo perfil');build();sheet()};
  animate(n);
}
let tm;
function animate(n){clearInterval(tm);const d=I[n.ic];if(!d.sp)return;const e=$('#shic');let f=0;tm=setInterval(()=>{f=(f+1)%d.f;e.style.backgroundPosition=(d.f>1?f*100/(d.f-1):0)+'% 0'},110)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const y=+c.dataset.go;$('#scr').scrollTo({top:y-$('#scr').clientHeight/2+60,behavior:'smooth'});document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on')});
build();sheet();
const scr=$('#scr');scr.scrollTop=scr.scrollHeight;
if(location.hash==='#alto')setTimeout(()=>scr.scrollTop=360,50);
if(location.hash==='#meio')setTimeout(()=>scr.scrollTop=520,50);
</script></body></html>
