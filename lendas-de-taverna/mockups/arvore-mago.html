<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Árvore de Habilidades — Mago</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Rubik:wght@400;500;600&display=swap">
<style>
:root{--mesa:#14100d;--madeira:#2a1f17;--borda:#5a4330;--papel:#efe2c4;--papel-2:#e0cfa8;--tinta:#2b1e15;--ouro:#e9b949;--ouro-2:#a97e22;--nevoa:#a8a39a;
--c-tronco:#e9b949;--c-piro:#f0782f;--c-geo:#5fc4d8;--c-ponte:#b58cf0;
--f-display:"Pixelify Sans",ui-monospace,monospace;--f-body:"Rubik",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:#0b0806;color:var(--papel);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--mesa);overflow:hidden;box-shadow:0 0 60px #000}
.px{image-rendering:pixelated}
/* ---------- cabeçalho ---------- */
.top{position:relative;z-index:8;background:linear-gradient(#2d2118,#1d1510);border-bottom:2px solid var(--borda)}
.r1{display:flex;align-items:center;gap:11px;padding:10px 12px 8px}
.portrait{position:relative;flex:0 0 48px;height:48px;border-radius:12px;border:2px solid var(--ouro-2);background:radial-gradient(circle at 50% 30%,#55358f,#1b1230);display:grid;place-items:center;box-shadow:0 0 14px #7d52d466}
.portrait img{width:34px;height:34px}
.portrait i{position:absolute;right:-6px;bottom:-6px;font:700 11px var(--f-display);font-style:normal;background:#0c0805;border:2px solid var(--ouro-2);color:var(--ouro);border-radius:99px;padding:0 6px;line-height:16px}
.who{min-width:0;flex:1}
.who h1{margin:0;font:700 18px/1.1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--nevoa);font-size:11.5px;margin-top:3px}
.ptsbox{display:flex;align-items:center;gap:7px;background:#000a;border:2px solid var(--ouro-2);border-radius:99px;padding:5px 13px 5px 8px;box-shadow:inset 0 0 10px #e9b94922}
.ptsbox img{width:22px;height:22px;filter:drop-shadow(0 0 4px #e9b949)}
.ptsbox b{font:700 22px/1 var(--f-display);color:var(--ouro);min-width:14px;text-align:center}
.ptsbox span{font:600 9px/1.1 var(--f-display);letter-spacing:1px;color:var(--papel-2);text-transform:uppercase}
.ptsbox.bump{animation:bump .45s ease}
.ptsbox.shake{animation:shake .4s ease;border-color:#d4503f}
@keyframes bump{40%{transform:scale(1.18);box-shadow:0 0 18px #e9b949}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.menu{flex:0 0 38px;height:38px;border-radius:11px;border:2px solid var(--borda);background:#0006;font-size:18px;line-height:1;cursor:pointer}
.pop{position:absolute;right:12px;top:62px;z-index:20;background:#1d1510;border:2px solid var(--ouro-2);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;box-shadow:0 10px 30px #000}
.pop.on{display:flex}
.pop button{font:600 13px var(--f-display);background:#0006;border:1px solid var(--borda);border-radius:8px;padding:10px 14px;text-align:left;cursor:pointer;white-space:nowrap}
.tabs{display:flex;padding:0 8px}
.tab{flex:1;position:relative;padding:8px 2px 9px;text-align:center;background:none;border:0;cursor:pointer;color:var(--nevoa);--c:var(--c-tronco)}
.tab.p{--c:var(--c-piro)}.tab.g{--c:var(--c-geo)}
.tab b{display:block;font:700 13px var(--f-display);letter-spacing:.5px}
.tab small{display:block;font-size:10px;margin-top:1px;opacity:.8}
.tab:after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--c);transform:scaleX(0);transition:transform .25s}
.tab.on{color:var(--papel)}.tab.on b{color:var(--c)}.tab.on:after{transform:scaleX(1);box-shadow:0 0 8px var(--c)}
/* ---------- árvore ---------- */
.scroller{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.world{position:relative;width:360px;height:1190px;margin:0 auto;
 background:
  radial-gradient(170px 290px at 70px 560px,#f0782f26,transparent 70%),
  radial-gradient(170px 290px at 292px 560px,#5fc4d826,transparent 70%),
  radial-gradient(150px 220px at 180px 980px,#e9b94924,transparent 70%),
  radial-gradient(90px 160px at 180px 450px,#b58cf022,transparent 70%)}
.world:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff22 1px,transparent 1.2px),radial-gradient(#ffffff14 1px,transparent 1.2px);background-size:46px 46px,29px 29px;background-position:0 0,13px 17px;opacity:.5}
svg.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.lab{position:absolute;text-align:center;font:700 11px var(--f-display);letter-spacing:4px;opacity:.5;width:150px}
.lab.p{color:var(--c-piro);left:0}.lab.g{color:var(--c-geo);right:0}.lab.t{color:var(--c-tronco);left:105px}
.tier{position:absolute;left:0;right:0;border-top:1px dashed #5a433066;font:10px var(--f-display);color:#8a7560;text-align:right;padding:1px 6px;letter-spacing:1px}
.node{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;cursor:pointer;--c:var(--c-tronco);touch-action:manipulation;z-index:2}
.node.p{--c:var(--c-piro)}.node.g{--c:var(--c-geo)}.node.b{--c:var(--c-ponte)}
.node .ic{position:relative;z-index:1;display:block;background-repeat:no-repeat;image-rendering:pixelated;background-size:contain;background-position:center}
.node .ic:not(.mk){filter:brightness(1.4) contrast(1.1)}
.ic.mk{background-color:var(--tint,#cdbb98);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.node.on .ic.mk{--tint:color-mix(in srgb,var(--c) 35%,#fff)}
.node.lock .ic.mk{--tint:#8a7560}
.node .nm{position:absolute;top:100%;margin-top:3px;width:92px;text-align:center;font:600 10px/1.1 var(--f-display);color:var(--papel);text-shadow:0 1px 0 #000,0 0 4px #000;pointer-events:none;left:50%;transform:translateX(-50%)}
.node.sel .nm{color:#fff;text-shadow:0 0 8px var(--c),0 1px 0 #000}
.node.s{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3b2c20,#17100b);border:2px solid #6b5640;box-shadow:inset 0 0 6px #000}
.node.s .ic{width:20px;height:20px}
.node.m{width:46px;height:46px}
.node.m:before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border-radius:7px;background:radial-gradient(circle at 40% 30%,#3b2c20,#17100b);border:2px solid #6b5640;box-shadow:inset 0 0 8px #000}
.node.m .ic{width:26px;height:26px}
.node.l{width:64px;height:64px}
.node.l:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,#6b5640,#3b2c20,#6b5640,#3b2c20,#6b5640);border:2px solid #7a6247;box-shadow:0 3px 8px #000}
.node.l:after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#35261b,#120c08);box-shadow:inset 0 0 10px #000,0 0 0 2px #00000099}
.node.l .ic{width:36px;height:36px}
.cd{position:absolute;right:-4px;bottom:-2px;z-index:3;font:700 10px var(--f-display);background:#0c0805;border:1.5px solid #6b5640;border-radius:99px;padding:0 5px;color:var(--papel-2)}
.eqn{position:absolute;left:-3px;bottom:-3px;z-index:3;font:700 10px var(--f-display);width:18px;height:18px;border-radius:5px;background:var(--ouro);color:var(--tinta);display:grid;place-items:center;border:1.5px solid #5b4310;box-shadow:0 0 6px #e9b94988}
.node.lock{filter:saturate(.45) brightness(.78)}
.node.lock.s,.node.lock.m:before,.node.lock.l:before{border-color:color-mix(in srgb,var(--c) 35%,#6b5640)}
.node.can.s,.node.can.m:before,.node.can.l:before{border-color:var(--c)}
.node.can{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 6px var(--c)) brightness(1.12)}}
.node.on.s{border-color:var(--c);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 45%,#2a1f17),#1a110b);box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 6px #0008}
.node.on.m:before{border-color:var(--c);background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--c) 50%,#2a1f17),#1a110b);box-shadow:0 0 12px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 8px #0008}
.node.on.l:before{background:conic-gradient(from 30deg,var(--c),#fff8,var(--c),#0006,var(--c));border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 75%,transparent),0 3px 8px #000}
.node.on.l:after{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 35%,#35261b),#120c08)}
/* botão + */
.plus{position:absolute;right:-9px;top:-9px;z-index:5;width:24px;height:24px;border-radius:50%;border:2px solid #5b4310;background:linear-gradient(#ffd66e,#d99a22);color:#2b1e15;font:700 18px/18px var(--f-display);padding:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 10px #e9b949aa;animation:plusp 1.4s ease-in-out infinite}
.plus:before{content:"";position:absolute;inset:-9px}
.plus.dis{background:#4a3d31;border-color:#2b1e15;color:#9b8670;box-shadow:none;animation:none}
.node.s .plus{right:-10px;top:-10px;width:22px;height:22px}
@keyframes plusp{50%{transform:scale(1.14)}}
/* seleção */
.sel-ring,.sel-glow{display:none;position:absolute;border-radius:50%;pointer-events:none}
.node.sel .sel-ring,.node.sel .sel-glow{display:block}
.sel-ring{inset:-8px;z-index:0;background:conic-gradient(from 0deg,transparent 0 35%,var(--c) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:spin 2.2s linear infinite;filter:drop-shadow(0 0 4px var(--c))}
.sel-glow{inset:-16px;z-index:0;background:radial-gradient(circle,color-mix(in srgb,var(--c) 38%,transparent) 0,transparent 68%);animation:glow 1.8s ease-in-out infinite}
.node.l .sel-ring{inset:-10px}.node.s .sel-ring{inset:-7px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{opacity:.45;transform:scale(1.12)}}
.node.sel{z-index:4}
.node.tap{animation:tapb .28s ease}
@keyframes tapb{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(.86)}75%{transform:translate(-50%,-50%) scale(1.07)}100%{transform:translate(-50%,-50%) scale(1)}}
.node.wait{filter:brightness(.9)}
.node.pop{animation:popn .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes popn{0%{transform:translate(-50%,-50%) scale(.8);filter:brightness(2.6) saturate(1.4)}45%{transform:translate(-50%,-50%) scale(1.32);filter:brightness(2)}100%{transform:translate(-50%,-50%) scale(1);filter:none}}
.node.src{animation:srcp .55s ease}
@keyframes srcp{40%{transform:translate(-50%,-50%) scale(1.14);filter:brightness(1.6) drop-shadow(0 0 10px var(--c))}}
/* efeitos */
.fx{position:absolute;pointer-events:none;z-index:6;transform:translate(-50%,-50%)}
.rip{width:20px;height:20px;border-radius:50%;border:2px solid var(--c);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
.flash{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c) 35%,transparent 70%);animation:flash .6s ease-out forwards}
@keyframes flash{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
.ring2{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 14px var(--c),inset 0 0 10px var(--c);animation:ring2 .75s ease-out forwards}
@keyframes ring2{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(3.6);opacity:0}}
.ray{width:3px;height:46px;background:linear-gradient(transparent,#fff,transparent);transform-origin:50% 50%;animation:ray .7s ease-out forwards}
@keyframes ray{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scaleY(.3)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-44px) scaleY(1.4)}}
.spk{width:6px;height:6px;background:#fff;box-shadow:0 0 8px var(--c),0 0 3px #fff;border-radius:1px;animation:spk .8s ease-out forwards}
@keyframes spk{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(220deg) scale(.4)}}
path.fillp{stroke-dasharray:1;stroke-dashoffset:1;animation:fillp .62s cubic-bezier(.4,0,.3,1) .08s forwards}
@keyframes fillp{to{stroke-dashoffset:0}}
.unl{position:absolute;left:12px;right:12px;top:-90px;z-index:15;display:flex;gap:11px;align-items:center;background:linear-gradient(#35261b,#1d1510);border:2px solid var(--c,var(--ouro));border-radius:14px;padding:9px 12px;box-shadow:0 8px 28px #000,0 0 22px color-mix(in srgb,var(--c,var(--ouro)) 45%,transparent);transition:top .4s cubic-bezier(.2,1.3,.4,1);pointer-events:none}
.unl.on{top:122px}
.unl .ui{flex:0 0 44px;height:44px;border-radius:10px;border:2px solid var(--c);background:radial-gradient(circle at 50% 30%,#35261b,#120c08);display:grid;place-items:center}
.unl .ui .ic{width:30px;height:30px;display:block;background-repeat:no-repeat;image-rendering:pixelated;background-size:contain;background-position:center}
.unl small{display:block;font:600 10px var(--f-display);letter-spacing:1.5px;color:var(--c);text-transform:uppercase}
.unl b{display:block;font:700 16px var(--f-display);margin:1px 0}
.unl em{font-style:normal;font-size:11px;color:var(--nevoa)}
/* ---------- barra de equipadas ---------- */
.slots{position:relative;z-index:7;display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(#1d1510,#17100c);border-top:2px solid var(--borda)}
.slots>label{flex:0 0 58px;font:700 10px/1.2 var(--f-display);letter-spacing:1px;color:var(--papel-2);text-transform:uppercase}
.slots>label small{display:block;font:500 10px var(--f-body);letter-spacing:0;color:var(--nevoa);text-transform:none;margin-top:2px}
.slot{position:relative;flex:1;aspect-ratio:1;max-width:60px;border-radius:50%;border:2px solid #6b5640;background:radial-gradient(circle at 50% 30%,#2a1f17,#0f0a07);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:inset 0 0 10px #000;--c:var(--ouro)}
.slot .n{position:absolute;left:-2px;top:-3px;font:700 10px var(--f-display);width:17px;height:17px;border-radius:5px;background:#0c0805;border:1.5px solid #6b5640;color:var(--papel-2);display:grid;place-items:center;z-index:2}
.slot .plus2{font:700 22px/1 var(--f-display);color:#5a4330}
.slot .ic{width:60%;height:60%;display:block;background-repeat:no-repeat;image-rendering:pixelated;background-size:contain;background-position:center}
.slot .ic:not(.mk){filter:brightness(1.4)}
.slot .ic.mk{background-color:#fff0cf;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.slot.fill{border-color:var(--c);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 30%,#2a1f17),#120c08);box-shadow:0 0 12px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 8px #0008}
.slot.fill .n{background:var(--c);color:var(--tinta);border-color:#0006}
.slot .cdp{position:absolute;right:-4px;bottom:-3px;font:700 9px var(--f-display);background:#0c0805;border:1.5px solid #6b5640;border-radius:99px;padding:0 4px;color:var(--papel-2)}
.slot.lk{opacity:.55;cursor:default}
.slot.lk img{width:45%;filter:invert(.8)}
.slot.lk i{position:absolute;bottom:-9px;font:700 9px var(--f-display);font-style:normal;color:var(--nevoa);background:#0c0805;border-radius:99px;padding:0 5px;border:1px solid #5a4330}
.slot.want{border-color:var(--ouro);animation:want 1s ease-in-out infinite}
.slot.want .plus2{color:var(--ouro)}
@keyframes want{50%{box-shadow:0 0 16px var(--ouro),inset 0 0 10px #e9b94955;transform:scale(1.07)}}
.slot.got{animation:got .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes got{0%{transform:scale(.6)}50%{transform:scale(1.2);filter:brightness(2)}100%{transform:scale(1)}}
.fly{position:fixed;z-index:50;pointer-events:none;transition:transform .5s cubic-bezier(.5,0,.2,1),opacity .5s;background-repeat:no-repeat;image-rendering:pixelated;background-size:contain;background-position:center;filter:drop-shadow(0 0 8px #e9b949)}
/* ---------- folha de detalhe ---------- */
.sheet{position:relative;z-index:6;background:linear-gradient(#2a1f17,#1d1510);border-top:2px solid var(--ouro-2);padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -10px 24px #000b}
.sh-top{display:flex;gap:11px;align-items:center}
.sh-ic{flex:0 0 56px;height:56px;border-radius:14px;border:2px solid var(--c);background:radial-gradient(circle at 50% 30%,#35261b,#120c08);display:grid;place-items:center;box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.sh-ic .ic{width:38px;height:38px;display:block;background-repeat:no-repeat;image-rendering:pixelated;background-size:contain;background-position:center}
.sh-ic .ic.mk{background-color:color-mix(in srgb,var(--c) 35%,#fff);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.sh-t{flex:1;min-width:0}
.sh-t h2{margin:0;font:700 18px/1.1 var(--f-display)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tg{font:600 10px var(--f-display);padding:2px 8px;border-radius:99px;border:1px solid;letter-spacing:.3px}
.tg.a{color:#ffd37a;border-color:#a97e22;background:#a97e2233}
.tg.pa{color:#a9d6ff;border-color:#4b78a8;background:#4b78a833}
.tg.alt{color:#9be07a;border-color:#4d8a38;background:#4d8a3833}
.tg.st{color:#ff9d8a;border-color:#a8483a;background:#a8483a33}
.tg.cdt{color:var(--papel-2);border-color:#5a4330;background:#0006}
.tg.pt{color:#e8c8ff;border-color:#8a5cc0;background:#8a5cc033}
.tg.req{color:#ffb4a8;border-color:#a8483a;background:#a8483a22}
.cost{flex:0 0 auto;text-align:center;font:700 20px/1 var(--f-display);color:var(--ouro)}
.cost small{display:block;font:600 8px var(--f-display);letter-spacing:1px;color:var(--nevoa);margin-top:3px}
.desc{font-size:13px;line-height:1.45;color:var(--papel);margin:9px 0 10px}
.desc b{color:var(--ouro);font-weight:600}
.row{display:flex;gap:8px}
.btn{flex:1;font:700 15px var(--f-display);padding:12px 8px;border-radius:11px;border:2px solid #7a5d1d;background:linear-gradient(#f0c150,#b88626);color:#2b1e15;cursor:pointer;box-shadow:0 3px 0 #5b4310;text-align:center;position:relative;overflow:hidden}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5b4310}
.btn.sec{background:#00000066;color:var(--papel);border-color:var(--borda);box-shadow:0 3px 0 #000}
.btn.off{filter:grayscale(1) brightness(.55);cursor:not-allowed;box-shadow:none}
.btn.blue{background:linear-gradient(#7fb2f2,#3e72b8);border-color:#254a7d;box-shadow:0 3px 0 #1b3557;color:#0e1d33}
</style></head><body>
<div class="app" id="app">

    e.style.left=n.x+'px';e.style.top=n.y+'px';e.dataset.id=n.id;
    const q=slotOf(n.id);
    e.innerHTML=`<span class="sel-glow"></span><span class="sel-ring"></span>${icSpan(n.ic)}`+
      (n.z!=='s'?`<span class="nm">${n.n}</span>`:'')+
      (n.z==='l'?`<span class="cd">⏱${n.cd}</span>`:'')+
      (q>=0?`<span class="eqn">${q+1}</span>`:'')+
      (st==='can'?`<button class="plus${pts<n.c?' dis':''}" aria-label="Aprender">+</button>`:'');
    e.onclick=ev=>{
      if(pending)return;
      if(ev.target.closest('.plus')){tryLearn(n);return}
      tapFx(e,n);sel=n.id;build();sheet();
    };
    w.appendChild(e);
  });
  links();counts();$('#pts').textContent=pts;slotsUI();
}
function pathD(a,b){const my=(a.y+b.y)/2;return `M${a.x} ${a.y} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`}
function links(){
  let h='';
  N.forEach(n=>n.pais.forEach(p=>{
    const a=by[p],b=n,c=COL[b.r];
    const on=learned.has(a.id)&&learned.has(b.id)&&pending!==b.id,open=learned.has(a.id)&&!on;
    const d=pathD(a,b);
    if(on)h+=`<path d="${d}" stroke="${c}" stroke-width="8" fill="none" opacity=".2"/><path d="${d}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    else h+=`<path d="${d}" stroke="${open?c:'#5a4330'}" stroke-width="2.5" fill="none" stroke-dasharray="${open?'2 6':'3 5'}" stroke-linecap="round" opacity="${open?.85:.5}"/>`;
  }));
  $('#links').innerHTML=h;
}
function counts(){
  const f=r=>{const L=N.filter(n=>n.r===r&&n.id!=='raiz'&&!n.fake);return learned.size&&`${L.filter(n=>learned.has(n.id)).length}/${L.length}`};
  $('#cp').textContent=f('p')+' nós';$('#ct').textContent=f('t')+' nós';$('#cg').textContent=f('g')+' nós';
}
/* ---------- barra de equipadas ---------- */
function slotsUI(){
  let h='<label>Equipadas<small>toque para ler</small></label>';
  for(let i=0;i<4;i++){
    const id=slots[i];
    if(i>=OPEN){h+=`<button class="slot lk" data-i="${i}"><img class="px" src="${IMG['ui-icons/padlock.png']}" alt=""><i>Nv ${LVL_LOCK}</i></button>`;continue}
    if(id){const n=by[id];h+=`<button class="slot fill" data-i="${i}" style="--c:${COL[n.r]}"><span class="n">${i+1}</span>${icSpan(n.ic)}<span class="cdp">⏱${n.cd}</span></button>`}
    else h+=`<button class="slot${equipMode||canEquipSel()?' want':''}" data-i="${i}"><span class="n">${i+1}</span><span class="plus2">+</span></button>`;
  }
  $('#slots').innerHTML=h;
  document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>slotTap(+b.dataset.i,b));
}
const canEquipSel=()=>{const n=by[sel];return n&&n.t==='A'&&learned.has(n.id)&&slotOf(n.id)<0};
function slotTap(i,el){
  if(i>=OPEN){toast('Espaço libera no nível '+LVL_LOCK);return}
  const id=slots[i],n=by[sel];
  if(canEquipSel()&&(equipMode||!id)){equip(n.id,i);return}
  if(id){sel=id;build();sheet();scrollTo_(by[id]);return}
  toast('Escolha uma ativa já aprendida para equipar');
}
function equip(id,i){
  const old=slotOf(id);if(old>=0)slots[old]=null;
  slots[i]=id;equipMode=false;
  const from=$('#shic'),n=by[id];
  build();sheet();
  const to=document.querySelector(`.slot[data-i="${i}"]`);
  if(from&&to)fly(from,to,id);
  setTimeout(()=>{const t=document.querySelector(`.slot[data-i="${i}"]`);t&&t.classList.add('got')},430);
  toast(n.n+' equipada no espaço '+(i+1),'ok');buzz(12);
}
function unequip(id){const i=slotOf(id);if(i<0)return;slots[i]=null;build();sheet();toast('Espaço '+(i+1)+' liberado')}
function fly(from,to,id){
  const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),d=I[by[id].ic];
  const e=document.createElement('div');e.className='fly';
  const sz=a.width;e.style.cssText+=`left:${a.left}px;top:${a.top}px;width:${sz}px;height:${a.height}px;`+(d.u?`background:#fff0cf;-webkit-mask:url(${IMG['ui-icons/'+d.u+'.png']}) center/contain no-repeat;`:icStyle(by[id].ic));
  document.body.appendChild(e);
  requestAnimationFrame(()=>{
    const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2),s=(b.width*.6)/sz;
    e.style.transform=`translate(${dx}px,${dy}px) scale(${s})`;
  });
  setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),300)},450);
}
/* ---------- efeitos ---------- */
function fx(cls,x,y,c,extra=''){
  const e=document.createElement('div');e.className='fx '+cls;e.style.cssText=`left:${x}px;top:${y}px;--c:${c};${extra}`;
  $('#world').appendChild(e);setTimeout(()=>e.remove(),1000);return e;
}
function tapFx(el,n){
  el.classList.add('tap');fx('rip',n.x,n.y,COL[n.r]);buzz(6);
}
function burst(n){
  const c=COL[n.r];
  fx('flash',n.x,n.y,c);fx('ring2',n.x,n.y,c);
  for(let i=0;i<8;i++)fx('ray',n.x,n.y,c,`--a:${i*45+22}deg`);
  for(let i=0;i<14;i++){const a=Math.random()*6.28,r=34+Math.random()*34;fx('spk',n.x,n.y,c,`--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;animation-delay:${Math.random()*.1}s`)}
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function bump(){const b=$('#ptsbox');b.classList.remove('bump','shake');void b.offsetWidth;b.classList.add('bump')}
function shake(){const b=$('#ptsbox');b.classList.remove('bump','shake');void b.offsetWidth;b.classList.add('shake')}
/* ---------- aprender ---------- */
function tryLearn(n){
  if(!avail(n))return;
  if(pts<n.c){shake();toast(`Faltam ${n.c-pts} ponto${n.c-pts>1?'s':''} para ${n.n}`,'no');buzz(30);return}
  learn(n);
}
function learn(n){
  const parents=n.pais.filter(p=>learned.has(p)).map(p=>by[p]);
  const src=parents.sort((a,b)=>Math.hypot(a.x-n.x,a.y-n.y)-Math.hypot(b.x-n.x,b.y-n.y))[0];
  pts-=n.c;learned.add(n.id);pending=n.id;sel=n.id;
  build();sheet();bump();
  const c=COL[n.r],d=pathD(src,n);
  const svg=$('#links');
  svg.insertAdjacentHTML('beforeend',`<path d="${d}" stroke="${c}" stroke-width="9" fill="none" opacity=".35" pathLength="1" class="fillp" stroke-linecap="round"/><path d="${d}" stroke="#fff" stroke-width="3.5" fill="none" pathLength="1" class="fillp" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${c})"/><circle r="6" fill="#fff" style="filter:drop-shadow(0 0 8px ${c}) drop-shadow(0 0 4px ${c})"><animateMotion dur=".62s" begin="indefinite" fill="freeze" path="${d}" keyTimes="0;1" keySplines=".4 0 .3 1" calcMode="spline"/></circle>`);
  const m=svg.querySelector('circle:last-of-type animateMotion');
  setTimeout(()=>m&&m.beginElement&&m.beginElement(),80);
  const se=document.querySelector(`.node[data-id="${src.id}"]`);
  if(se){se.classList.add('src');fx('rip',src.x,src.y,c)}
  buzz(10);
  setTimeout(()=>{
    pending=null;build();sheet();burst(n);buzz([14,30,22]);
    const ne=document.querySelector(`.node[data-id="${n.id}"]`);ne&&ne.classList.add('pop');
    popup(n,src);
  },720);
}
function popup(n,src){
  const u=$('#unl');u.style.setProperty('--c',COL[n.r]);
  u.innerHTML=`<div class="ui">${icSpan(n.ic)}</div><div><small>${n.t==='A'?'Habilidade desbloqueada':n.t==='P'?'Passiva desbloqueada':'Atributo desbloqueado'}</small><b>${n.n}</b><em>ligada a ${src.n}${n.t==='A'?' · já pode equipar':''}</em></div>`;
  u.classList.add('on');clearTimeout(popup.t);popup.t=setTimeout(()=>u.classList.remove('on'),2400);
}
/* ---------- desaprender / automático ---------- */
const kids=id=>N.filter(n=>n.pais.includes(id)&&learned.has(n.id));
function canRefund(n){
  if(n.id==='raiz')return false;
  const t=new Set(learned);t.delete(n.id);
  const ok=new Set(['raiz']);let ch=true;
  while(ch){ch=false;N.forEach(m=>{if(t.has(m.id)&&!ok.has(m.id)&&m.pais.some(p=>ok.has(p))){ok.add(m.id);ch=true}})}
  return [...t].every(i=>ok.has(i));
}
function refund(n){
  const q=slotOf(n.id);if(q>=0)slots[q]=null;
  learned.delete(n.id);pts+=n.c;build();sheet();bump();toast('Voltaram '+n.c+' ponto'+(n.c>1?'s':''));
}
/* ---------- detalhe ---------- */
function sheet(){
  const n=by[sel],st=state(n),col=COL[n.r];
  const typeTag=n.t==='A'?'<span class="tg a">ATIVA</span>':n.t==='P'?'<span class="tg pa">PASSIVA</span>':'<span class="tg pa">ATRIBUTO</span>';
  const tags=(n.tg||[]).map(([k,t])=>`<span class="tg ${k}">${k==='alt'?'▲ ':''}${t}</span>`).join('');
  const cdt=n.t==='A'?`<span class="tg cdt">⏱ recarga ${n.cd}</span>`:'';
  const req=(st==='lock'&&!n.fake)?`<span class="tg req">🔒 precisa de ${n.pais.map(p=>by[p].n).join(' ou ')}</span>`:'';
  let btn='';
  const q=slotOf(n.id);
  if(n.fake)btn=`<div class="btn off">Em breve</div>`;
  else if(st==='on'||st==='wait'){
    if(st==='wait')btn=`<div class="btn off">Desbloqueando…</div>`;
    else{
      if(n.t==='A')btn=q>=0?`<div class="btn sec" id="uneq">Remover do espaço ${q+1}</div>`:`<div class="btn blue" id="eq">⚔ Equipar</div>`;
      else btn=`<div class="btn off" style="filter:none;opacity:.85;color:#9fe08a;border-color:#4d8a38;background:#4d8a3822;box-shadow:none">✔ Passiva sempre ativa</div>`;
      if(n.id!=='raiz'&&canRefund(n))btn+=`<div class="btn sec" id="ref" style="flex:0 0 auto;padding:12px 14px;font-size:13px">Devolver</div>`;
    }
  }
  else if(st==='can')btn=`<div class="btn${pts<n.c?' off':''}" id="learn">${pts<n.c?'Faltam '+(n.c-pts)+' pt':'＋ Aprender'}</div>`;
  else btn=`<div class="btn off">Bloqueada</div>`;
  const sh=$('#sheet');sh.style.setProperty('--c',col);
  sh.innerHTML=`<div class="sh-top"><div class="sh-ic">${icSpan(n.ic,'id="shic"')}</div><div class="sh-t"><h2>${n.n}</h2><div class="tags">${typeTag}${cdt}${tags}${req}</div></div><div class="cost">${n.c||'—'}<small>${n.c===1?'PONTO':'PONTOS'}</small></div></div>
   <div class="desc">${n.d}</div><div class="row">${btn}</div>`;
  const g=id=>document.getElementById(id);
  g('learn')&&(g('learn').onclick=()=>tryLearn(n));
  g('ref')&&(g('ref').onclick=()=>refund(n));
  g('uneq')&&(g('uneq').onclick=()=>unequip(n.id));
  g('eq')&&(g('eq').onclick=()=>{
    const i=slots.findIndex((s,k)=>k<OPEN&&!s);
    if(i>=0)equip(n.id,i);else{equipMode=true;slotsUI();toast('Toque no espaço que quer trocar','ok')}
  });
  animate(n);
}
let tm;
function animate(n){clearInterval(tm);const d=I[n.ic];if(!d.sp)return;const e=$('#shic');let f=0;tm=setInterval(()=>{f=(f+1)%d.f;e.style.backgroundPosition=(d.f>1?f*100/(d.f-1):0)+'% 0'},110)}
let tt;function toast(t,k){const u=$('#unl');if(u.classList.contains('on'))return;u.style.setProperty('--c',k==='no'?'#d4503f':'#e9b949');u.innerHTML=`<div><b style="font-size:14px;margin:0">${t}</b></div>`;u.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>u.classList.remove('on'),1600)}
function scrollTo_(n){const s=$('#scr');s.scrollTo({top:n.y-s.clientHeight/2,behavior:'smooth'})}
/* ---------- menu / abas ---------- */
$('#menu').onclick=e=>{e.stopPropagation();$('#pop').classList.toggle('on')};
document.addEventListener('click',()=>$('#pop').classList.remove('on'));
$('#zero').onclick=()=>{let tot=0;[...learned].forEach(i=>{if(i!=='raiz'){tot+=by[i].c;learned.delete(i)}});slots.fill(null);pts+=tot;sel='raiz';build();sheet();bump();toast('Árvore zerada: '+tot+' pontos de volta')};
$('#auto').onclick=()=>{const ord=['mente','int1','fogo','int2','chama','comb','brasa','choque','res1','escudo','piro','sabio','muro','meteoro'];let k=0;ord.forEach(i=>{const m=by[i];if(!learned.has(i)&&avail(m)&&pts>=m.c){pts-=m.c;learned.add(i);k++}});
  [...learned].filter(i=>by[i].t==='A').forEach(i=>{if(slotOf(i)<0){const s=slots.findIndex((x,j)=>j<OPEN&&!x);if(s>=0)slots[s]=i}});
  build();sheet();bump();toast('Distribuído pelo perfil do Mago ('+k+' nós)','ok')};
document.querySelectorAll('.tab').forEach(c=>c.onclick=()=>{const y=+c.dataset.go,s=$('#scr');s.scrollTo({top:y-s.clientHeight/2+40,behavior:'smooth'});document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));c.classList.add('on')});
build();sheet();
const scr=$('#scr');scr.scrollTop=Math.max(0,820-scr.clientHeight/2);
if(location.hash==='#alto')setTimeout(()=>scr.scrollTop=420,50);
</script></body></html>
