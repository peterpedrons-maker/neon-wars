<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140e09">
<title>Hearthblade — Lendas de Brumavale</title>
<style>
@font-face{font-family:'Rubik';src:url(assets/fonts/Rubik.ttf) format('truetype');font-weight:300 900;font-display:swap}
@font-face{font-family:'Cinzel';src:url(assets/fonts/Cinzel.ttf) format('truetype');font-weight:400 900;font-display:swap}
@font-face{font-family:'CinzelDeco';src:url(assets/fonts/CinzelDecorative-Bold.ttf) format('truetype');font-weight:700;font-display:swap}
:root{--ft:'Cinzel',Georgia,serif;--fd:'CinzelDeco','Cinzel',Georgia,serif;--f:'Rubik',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
--papel:#e9e2d0;--papel2:#a39b86;--ouro:#ffd65a;--ouroC:#f3d98e;--ouroE:#d9b45f;--lin:rgba(217,180,95,.45);--gl:rgba(12,11,17,.94);--bg:#18110b;--verde:#6cc35e;--azul:#5490e0;--verm:#d6403a;--borda:#8a6a3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--papel);font-family:var(--f);font-size:13px;overflow:hidden;touch-action:manipulation}
#stage{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);background:var(--bg);overflow:hidden}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:none}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.txt-o{text-shadow:0 1px 0 #140e09,1px 0 0 #140e09,-1px 0 0 #140e09,0 -1px 0 #140e09}
button{font-family:var(--f);cursor:pointer;color:var(--papel);transition:transform .08s,filter .1s}
button:active:not(:disabled){transform:scale(.97);filter:brightness(1.15)}
/* ---------- vidro escuro com moldura fina dourada ---------- */
.panel,#hero,#prog,#bar,#gold,#toast,#win .box,#pan .box,.gl{background:var(--gl);border:1px solid var(--lin);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 6px 20px rgba(0,0,0,.55);position:relative}
#win .box::before,#pan .box::before,.gl::before,#win .box::after,#pan .box::after,.gl::after{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--ouroE);pointer-events:none}
#win .box::before,#pan .box::before,.gl::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
#win .box::after,#pan .box::after,.gl::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:46px;padding:0 10px;border:1px solid var(--ouroC);background:linear-gradient(#f0cf7c,#b98a2f);color:#2a1a06;font:700 13px var(--ft);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 0 #ffe8a8;box-shadow:0 0 14px rgba(217,180,95,.3)}
.btn.sec{background:linear-gradient(#2a2433,#17131d);border-color:var(--lin);color:var(--papel);text-shadow:none;box-shadow:none}
.btn:disabled{background:linear-gradient(#26222e,#15121a);border-color:rgba(217,180,95,.25);color:#6c6678;text-shadow:none;box-shadow:none}
/* título */
#title{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#2d4a1e,#0e150a 70%);padding:24px;gap:14px;text-align:center}
#title img{width:78%;max-width:300px;image-rendering:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
#title .sub{font:600 11px var(--ft);letter-spacing:.28em;text-transform:uppercase;color:var(--papel2)}
#title .col{width:80%;max-width:300px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
#title a{color:var(--papel2);font-size:11px;text-decoration:underline}
/* ---------- criação em 3 etapas ---------- */
#create{background:radial-gradient(ellipse at 50% 28%,#2b2a3a,#0b0b12 72%);padding:0 12px 14px}
#csteps{display:flex;justify-content:center;align-items:flex-start;padding-top:12px;flex:none}
#csteps .s{display:flex;flex-direction:column;align-items:center;gap:7px;width:84px;font:600 9px var(--ft);letter-spacing:.14em;color:var(--papel2);text-transform:uppercase}
#csteps .s i{width:24px;height:24px;border:1px solid var(--lin);display:grid;place-items:center;font:700 12px var(--ft);font-style:normal;transform:rotate(45deg);background:#14111a}
#csteps .s i span{transform:rotate(-45deg)}
#csteps .s.on{color:var(--ouroC)}#csteps .s.on i{background:linear-gradient(#f0cf7c,#b98a2f);color:#2a1a06;border-color:var(--ouroC);box-shadow:0 0 12px rgba(217,180,95,.5)}
#csteps .s.ok i{background:#2a2433;color:var(--ouroE)}
#csteps .ln{width:34px;height:1px;background:var(--lin);margin-top:12px}
#cstage{position:relative;flex:1;min-height:120px}
#cprev{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#cname-tag{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:700 11px var(--ft);letter-spacing:.28em;text-transform:uppercase;color:var(--ouroE);text-shadow:0 1px 3px #000}
.cstep{display:none;flex-direction:column;gap:10px;flex:none}.cstep.on{display:flex}
#cls{display:flex;gap:6px;justify-content:center}
#cls button{width:50px;height:50px;padding:2px;background:#14111a;border:1px solid var(--lin);position:relative}
#cls button canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#cls button.on{border-color:var(--ouroC);box-shadow:0 0 12px rgba(217,180,95,.5);background:#241d12}
#cinfo{padding:12px 14px;display:grid;grid-template-columns:1fr auto;column-gap:10px}
#cinfo h3{margin:0;font:700 20px var(--ft);letter-spacing:.06em;color:var(--ouroC)}
#cinfo .papel{font:700 10.5px var(--ft);letter-spacing:.14em;text-transform:uppercase;color:#8fd88a;align-self:center}
#cinfo p{grid-column:1/3;margin:3px 0 8px;font-size:12px;color:var(--papel2)}
#cbars{grid-column:1/3}
.sbar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--papel2);margin:3px 0}
.sbar span{width:52px}.sbar i{flex:1;height:6px;background:#0a090e;border:1px solid #3a3446;position:relative;display:block}
.sbar i b{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .35s}
#csk{grid-column:1/3;margin-top:8px}#csk .h{font:600 10px var(--ft);letter-spacing:.14em;color:var(--papel2);margin-bottom:6px;text-transform:uppercase}
#csk .r{display:flex;gap:6px}#csk img{width:36px;height:36px;image-rendering:pixelated;background:#0d0b11;border:1px solid var(--lin);padding:2px}
.ctabs{display:flex;border-bottom:1px solid var(--lin)}
.ctabs button{flex:1;height:34px;border:0;background:transparent;color:var(--papel2);font:700 11px var(--ft);letter-spacing:.14em;text-transform:uppercase}
.ctabs button.on{color:var(--ouroC);background:linear-gradient(#2a2433,#17131d);box-shadow:inset 0 -2px 0 var(--ouroE)}
#look{padding:6px 12px 10px;min-height:248px}
#look .lr{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid rgba(255,255,255,.06)}
#look .lr>span{width:62px;flex:none;font:600 10px var(--ft);letter-spacing:.14em;text-transform:uppercase;color:var(--papel2)}
#look .sw{display:grid;grid-template-columns:repeat(7,26px);gap:6px;flex:1;padding:6px 0}
#look .sw button{width:26px;height:26px;border:1px solid #000;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
#look .sw button.on{outline:2px solid var(--ouroC);outline-offset:1px}
#look .sel{flex:1;display:flex;align-items:center;justify-content:space-between;height:32px;border:1px solid var(--lin);background:#0e0c13;padding:0 4px}
#look .sel b{font:600 12.5px var(--f);color:var(--papel)}
#look .sel a{width:24px;height:24px;display:grid;place-items:center;color:var(--ouroC);font-size:11px;background:#1c1822;cursor:pointer}
#look .sel a:active{background:#2c2636}
#look .tools{display:flex;gap:8px;margin-top:12px}
#look .tools button{flex:1;height:34px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10.5px var(--ft);letter-spacing:.12em;text-transform:uppercase}
#cs3 .gl{padding:14px}
#cs3 label{display:block;text-align:center;font:600 10px var(--ft);letter-spacing:.2em;color:var(--papel2);margin-bottom:8px}
#cname{width:100%;height:46px;border:1px solid var(--lin);background:#0e0c13;color:var(--ouroC);font:700 19px var(--ft);text-align:center;letter-spacing:.1em;outline:0;border-radius:0}
#cname:focus{border-color:var(--ouroC)}#cname::placeholder{color:#6c6678;font-weight:500}
#cs3 .tools{display:flex;margin-top:10px}#cs3 .tools button{flex:1;height:32px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10px var(--ft);letter-spacing:.12em;text-transform:uppercase}
.st{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;font-size:12px}
.st div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:3px 0}.st b{color:var(--ouroC);font-weight:600}
#cnav{display:flex;gap:10px;flex:none;margin-top:12px}#cnav .btn{flex:1}
/* ---------- HUD ---------- */
#hud{pointer-events:none}#hud *{pointer-events:none}#hud button{pointer-events:auto}
#hero{position:absolute;left:6px;top:calc(6px + env(safe-area-inset-top));width:172px;padding:6px 8px 7px 54px;min-height:50px}
#hero canvas{position:absolute;left:6px;top:6px;width:40px;height:40px;image-rendering:pixelated;background:#0d0b11;border:1px solid var(--lin)}
#hero .nm{font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;line-height:1.2}
#hero .nm span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:80px}#hero .nm span:last-child{color:var(--ouroC)}
.bar{height:8px;background:#0a090e;margin-top:3px;position:relative;border:1px solid #3a3446}
.bar b{display:block;position:absolute;left:0;top:0;bottom:0}
#hpw{position:relative}#hpw #hp{height:13px;margin-top:4px}
#hp b{background:linear-gradient(#ff7a6a,#d6302a 55%,#a01c18)}#xp b{background:linear-gradient(#8fc2ff,#3a7be0)}
#hpt{position:absolute;left:0;right:0;top:4px;height:13px;line-height:13px;text-align:center;font:600 9px var(--f);color:#fff;text-shadow:0 1px 1px #000,0 0 2px #000}
#hero #xp{height:4px;margin-top:3px}
#gold{position:absolute;left:6px;top:calc(66px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;height:26px;padding:0 12px 0 8px;font:700 13px var(--f);color:var(--ouroC)}
#gold::before{content:'';width:16px;height:16px;background:url(assets/ui2/i_coin.png) center/contain no-repeat;image-rendering:pixelated}
#zone{display:none}
#prog{position:absolute;right:6px;top:calc(6px + env(safe-area-inset-top));width:100px;padding:5px 8px 6px;text-align:center;font:600 10.5px var(--f)}
#prog .bar{height:5px;margin-top:4px}#prog .bar b{background:#e8a63a}
#boss{position:absolute;left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);width:62%;padding:4px 8px 6px;border-color:#b0442e;background:rgba(36,12,10,.94);display:none}
#boss .t{font:700 11px var(--ft);letter-spacing:.1em;text-align:center;color:#ffd6a0}
#boss .bar b{background:linear-gradient(#f26a5a,#b02a24)}
#buffs{position:absolute;left:6px;top:calc(98px + env(safe-area-inset-top));display:flex;gap:3px}
#buffs div{display:flex;align-items:center;gap:2px;background:var(--gl);border:1px solid var(--lin);padding:1px 4px 1px 2px;font-size:9px}
#buffs img{width:14px;height:14px;image-rendering:pixelated}
#chat{position:absolute;left:6px;bottom:calc(76px + env(safe-area-inset-bottom));width:66%;font-size:10.5px;line-height:1.35;background:linear-gradient(90deg,rgba(8,8,12,.55),rgba(8,8,12,0));padding:2px 6px;display:none}
#chat div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{position:absolute;left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom));height:62px;display:flex;align-items:center;gap:5px;padding:0 6px}
#bar .sk{position:relative;width:42px;height:42px;background:#0d0b11;border:1px solid var(--lin);padding:2px;flex:none}
#bar .sk img{width:100%;height:100%;image-rendering:pixelated;display:block}
#bar .sk .cd{position:absolute;left:0;right:0;top:0;background:rgba(0,0,0,.62)}
#bar .sk.lock img{filter:grayscale(1) brightness(.45)}
#bar .sk .lv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#d8c8a0;text-shadow:0 1px 0 #000}
#bar .sk.ready{border-color:var(--ouroC);box-shadow:0 0 8px rgba(243,217,142,.4)}
.tb{height:42px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10.5px var(--ft);letter-spacing:.08em;padding:0 8px;flex:none}
#bAuto.on{background:linear-gradient(#3fa04c,#256b30);border-color:#96e08a;color:#ecffe6}
#sp{margin-left:auto}
#bar .tb.ic{padding:0;width:42px;position:relative}
#bar .tb.ic img{width:28px;height:28px;image-rendering:pixelated;display:block;margin:auto}
#bar .tb.ic .n{position:absolute;right:2px;bottom:0;font-size:9.5px;color:#fff;text-shadow:0 1px 0 #000}
#bar .tb.ic .bd{position:absolute;right:-4px;top:-5px;background:#d6403a;color:#fff;font-size:9px;border-radius:8px;min-width:15px;padding:0 3px;display:none;text-align:center}
#toast{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);padding:9px 18px;font:600 13.5px var(--f);color:var(--ouroC);display:none;text-align:center;white-space:nowrap}
#tapfx{position:absolute;pointer-events:none;width:30px;height:30px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(.3);opacity:0}
#banner{position:absolute;left:0;right:0;top:calc(30% + env(safe-area-inset-top));text-align:center;pointer-events:none;opacity:0;padding:22px 8px 20px;background:linear-gradient(90deg,transparent,rgba(8,5,3,.62) 22%,rgba(8,5,3,.62) 78%,transparent)}
#banner b{display:block;font:700 21px var(--fd);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:#ffd65a;text-shadow:0 2px 0 #2a160a,0 0 14px rgba(255,190,70,.5)}
#banner u{display:block;height:2px;width:0;margin:9px auto 7px;background:linear-gradient(90deg,transparent,#ffd65a,transparent);text-decoration:none}
#banner span{display:block;font:600 12px var(--ft);letter-spacing:.32em;text-transform:uppercase;color:#eadcb4;text-shadow:0 1px 3px #000}
#banner i{display:none}
#banner.show{animation:bnr 3.6s ease-in-out forwards}
#banner.show b{animation:bnb 3.6s ease-out forwards}
#banner.show u{animation:bnu 3.6s ease-out forwards}
@keyframes bnr{0%{opacity:0}18%{opacity:1}76%{opacity:1}100%{opacity:0}}
@keyframes bnb{0%{letter-spacing:.34em;transform:scale(1.1)}30%{letter-spacing:.1em;transform:scale(1)}100%{letter-spacing:.14em;transform:scale(1.02)}}
@keyframes bnu{0%,10%{width:0}40%{width:78%}100%{width:90%}}
#res{align-items:center;justify-content:center;background:rgba(6,5,10,.8);gap:12px;padding:24px;text-align:center}
#res h2{margin:0;font:700 26px var(--ft);letter-spacing:.14em;color:var(--ouroC);text-shadow:0 2px 0 #2a160a}
#res .l{font-size:12.5px;color:var(--papel)}#res .box{padding:12px 16px;width:100%;max-width:320px}
#res .col{width:100%;max-width:300px;display:flex;flex-direction:column;gap:8px}
#ko{align-items:center;justify-content:center;background:rgba(40,0,0,.45);font:700 18px var(--ft);color:#ffd6d0;text-align:center;display:none;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:50}#fade.on{opacity:1;pointer-events:auto}
/* ---------- janelas (MMO) ---------- */
#win,#pan{align-items:center;justify-content:center;background:rgba(5,4,8,.72);padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
#win .box,#pan .box{width:100%;max-height:100%;display:flex;flex-direction:column;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.tt{flex:none;display:flex;align-items:center;justify-content:space-between;height:38px;padding:0 6px 0 14px;background:linear-gradient(#2a2433,#16131c);border-bottom:1px solid var(--lin);font:700 13px var(--ft);letter-spacing:.2em;text-transform:uppercase;color:var(--ouroC)}
.xb{position:relative;width:26px;height:26px;border:1px solid var(--lin);background:#1c1822;padding:0;font-size:0}
.xb::before,.xb::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:2px;margin:-1px 0 0 -6px;background:var(--ouroC);transform:rotate(45deg)}
.xb::after{transform:rotate(-45deg)}
.tabs{display:flex;border-bottom:1px solid var(--lin);flex:none}
.tabs button{flex:1;height:36px;border:0;background:transparent;color:var(--papel2);font:700 10.5px var(--ft);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.tabs button.on{color:var(--ouroC);background:linear-gradient(#2a2433,#17131d);box-shadow:inset 0 -2px 0 var(--ouroE)}
.wb{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0;-webkit-overflow-scrolling:touch;padding:12px}
#win .sub{font-size:12px;color:var(--papel2);text-align:center;margin:0}
.wgold{display:flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--ft);letter-spacing:.06em;color:var(--ouroC)}
.wgold img,.wr .pr img,.stline .pr img{width:16px;height:16px;image-rendering:pixelated;filter:sepia(1) saturate(7) hue-rotate(-8deg) brightness(1.25)}
.wr{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:56px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);font-size:12px}
.wr.sel{border-color:var(--lin);background:rgba(217,180,95,.1)}.wr.lock{opacity:.5;filter:grayscale(.6)}
.wr .ic{width:40px;height:40px;flex:none;image-rendering:pixelated;background:#0d0b11;border:1px solid #4a4458;padding:3px}
.wr .tx{flex:1;min-width:0}.wr .tx b{display:block;font-size:13px;font-weight:600;line-height:1.2}.wr .tx span{color:var(--papel2);font-size:11px;line-height:1.35;display:block}
.wr .pr{color:var(--ouroC);font-weight:700;font-size:12.5px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.gb,.db{height:36px;min-width:72px;padding:0 12px;border:1px solid;font:700 11px var(--f);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;flex:none;display:flex;align-items:center;justify-content:center}
.gb{background:linear-gradient(#f0cf7c,#b98a2f);border-color:var(--ouroC);color:#2a1a06;text-shadow:0 1px 0 #ffe8a8}
.db{background:linear-gradient(#2a2433,#17131d);border-color:var(--lin);color:var(--papel)}
.gb:disabled,.db:disabled{opacity:.4;filter:grayscale(.7)}
.gb.big{width:100%;height:48px;font-size:13px}
.wdiv{height:1px;background:linear-gradient(90deg,transparent,var(--lin) 20%,var(--lin) 80%,transparent);flex:none;margin:2px 0}
.stline{display:flex;justify-content:space-between;font-size:12px;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.fslots{display:flex;gap:6px;justify-content:center}
.fslots .fs{width:17%;max-width:56px;aspect-ratio:1;border:1px solid #4a4458;background:#0d0b11;padding:3px;position:relative}
.fslots .fs.sel{box-shadow:0 0 0 2px var(--ouroC)}.fslots .fs img{width:100%;height:100%;image-rendering:pixelated;display:block}
.fslots .fs i{position:absolute;right:2px;bottom:0;font:700 9.5px var(--f);font-style:normal;color:#fff;text-shadow:0 1px 0 #000}
.fbig{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.fbig .fi{width:76px;height:76px;border:2px solid;background:#0d0b11;padding:6px;position:relative}.fbig .fi img{width:100%;height:100%;image-rendering:pixelated}
.fbig b{font-size:15px}.fbig span{font-size:11px;color:var(--papel2)}
.fbar{height:8px;background:#0a090e;border:1px solid #3a3446;position:relative}.fbar b{display:block;height:100%;background:linear-gradient(#8ee07e,#4aa33e)}
.up{color:#7de06d}.dn{color:#ff7a6a}
.acts{display:flex;gap:8px}.acts button{flex:1;height:38px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10.5px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--papel)}
.acts button.g{background:linear-gradient(#f0cf7c,#b98a2f);border-color:var(--ouroC);color:#2a1a06}.acts button:disabled{opacity:.4}
/* herói */
.pd{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pcol{display:flex;flex-direction:column;gap:8px}

.slot,.cell{position:relative;border:1px solid #3a3446;background:#0d0b11;aspect-ratio:1;cursor:pointer}

.slot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5a5468;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.cell.e{cursor:default;opacity:.55}
.slot.sel,.cell.sel{box-shadow:0 0 0 2px var(--ouroC)}
.il{position:absolute;right:2px;bottom:0;font:700 10px var(--f);color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000}

.sec-h{display:flex;justify-content:space-between;font:600 10px var(--ft);letter-spacing:.16em;text-transform:uppercase;color:var(--papel2);margin:4px 2px 0}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:12px}
.stg div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:3px 0}.stg b{color:var(--ouroC);font-weight:600}

.skc img{width:44px;height:44px;image-rendering:pixelated;background:#0d0b11;border:1px solid var(--lin);padding:3px;flex:none}
.skc .t{flex:1;font-size:11.5px;line-height:1.4;color:var(--papel2)}.skc .t b{font:700 13px var(--ft);color:var(--ouroC);letter-spacing:.03em}
.pl{width:40px;height:40px;border:1px solid var(--ouroC);background:linear-gradient(#f0cf7c,#b98a2f);color:#2a1a06;font:700 20px var(--f);flex:none}
.pl:disabled{background:#26222e;border-color:#3a3446;color:#5a5468}
.pips{display:flex;gap:3px;margin-top:4px}.pips i{width:14px;height:5px;background:#26222e;border:1px solid #4a4458}.pips i.on{background:var(--ouroE);border-color:var(--ouroC)}
.avl{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(217,180,95,.08);border:1px solid var(--lin);font-size:12px}.avl b{font:700 16px var(--ft);color:var(--ouroC)}
.atr{display:flex;align-items:center;gap:10px;padding:9px 10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09)}
.atr .an{flex:1}.atr .an b{display:block;font:700 13px var(--ft);letter-spacing:.05em;color:var(--papel)}.atr .an span{font-size:11px;color:var(--papel2)}
.atr .av{font:700 18px var(--ft);color:var(--ouroC);min-width:34px;text-align:center}
/* dica flutuante do item (estilo WoW) */
#tip{position:absolute;display:none;width:208px;z-index:30;background:rgba(10,9,14,.97);border:1px solid;padding:9px 10px 8px;font-size:11.5px;box-shadow:0 8px 24px rgba(0,0,0,.7);animation:pop .12s ease-out}
#tip.on{display:block}

#tip .th b{display:block;font:700 13px var(--ft);line-height:1.15}#tip .th span{font-size:10.5px;color:var(--papel2)}

/* =========================================================================

   ========================================================================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];

function dir4(dx,dy){return Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?2:0);}
const SAVE_KEY='hb_mmo_save_v1';

/* ------------------------------ dados ----------------------------------- */
const CLASSES={

    skills:[['meteoros','Meteoros',7,2.0,{t:'meteor',d:'Chuva de meteoros na área do alvo.'}],['tremor','Tremor',10,1.2,{t:'aoe',r:84,stun:1,d:'Abala e atordoa quem está perto.'}],['grito_estridente','Grito Estridente',12,1.4,{t:'aoe',r:96,knock:2,d:'Onda que empurra os inimigos.'}]]},
  clerigo:{nome:'Clérigo',papel:'Suporte',desc:'Cura a si mesmo e castiga o mal.',
    hp:100,atk:10,def:7,rng:30,aspd:0.9,crit:.08,speed:68,bars:[.75,.45,.8,.15],atk_:'slash',
    skills:[['golpe_sagrado','Golpe Sagrado',6,1.8,{t:'single',heal:.1,d:'Golpe que cura 10% da vida.'}],['julgamento','Julgamento',10,1.7,{t:'aoe',r:72,d:'Luz sagrada em área.'}],['escudo_aliado','Escudo',12,0,{t:'shield',pct:.35,dur:8,d:'Escudo de 35% da vida por 8s.'}]]},
  arqueiro:{nome:'Arqueiro',papel:'Atirador',desc:'Flechas certeiras a grande distância.',
    hp:88,atk:15,def:5,rng:170,aspd:0.9,crit:.2,speed:76,bars:[.55,.7,.4,1.0],atk_:'shoot',
    skills:[['saraivada_total','Saraivada',6,1.0,{t:'multi',n:4,d:'4 flechas em sequência.'}],['flecha_incendiaria','Flecha Incendiária',10,1.4,{t:'dot',dps:.35,dur:5,col:'#ff9a3a',d:'Flecha que queima por 5s.'}],['golpe_costas','Tiro Certeiro',12,3.0,{t:'single',crit:true,d:'Tiro crítico garantido.'}]]},
  bardo:{nome:'Bardo',papel:'Apoio',desc:'Canções que fortalecem. Acha mais ouro.',
    hp:90,atk:11,def:6,rng:30,aspd:0.8,crit:.1,speed:72,bars:[.65,.5,.55,.15],atk_:'slash',
    skills:[['grito_estridente','Canção Estridente',6,1.6,{t:'aoe',r:72,d:'Canção que fere em área.'}],['grito_guerra','Hino de Guerra',12,0,{t:'buff',atk:.25,spd:.15,dur:8,d:'+25% ataque e +15% velocidade.'}],['escudo_aliado','Escudo',12,0,{t:'shield',pct:.3,dur:8,d:'Escudo de 30% da vida por 8s.'}]]}
};
const CLS_ORDER=['guerreiro','ladino','mago','clerigo','arqueiro','bardo'];
const STAT_NAMES=['Vida','Ataque','Defesa','Alcance'],STAT_COL=['#d6403a','#ffa83c','#5490e0','#96e08a'];
const MOBS={
  goblin:{nome:'Goblin',sheet:'goblin',hp:78,atk:7,xp:18,gold:[3,8],speed:46,aggro:130,rng:24,aspd:1.3,sw:18},
  esq:{nome:'Esqueleto',sheet:'esqueleto',hp:104,atk:9,xp:27,gold:[4,10],speed:40,aggro:120,rng:24,aspd:1.4,sw:18},
  javali:{nome:'Javali',sheet:'javali',hp:125,atk:10,xp:33,gold:[5,11],speed:60,aggro:140,rng:26,aspd:1.5,sw:22},
  rato:{nome:'Rato Gigante',sheet:'rato',hp:42,atk:4,xp:11,gold:[1,4],speed:58,aggro:110,rng:20,aspd:1.0,sw:14}
};
const BOSS={nome:'Ogro de Brumavale',sheet:'ogro',hp:1500,atk:16,xp:260,gold:[80,140],speed:36,aggro:260,rng:44,aspd:1.7,scale:1.5};
const KILLS_FOR_BOSS=16;
const bossLv=()=>4+G.zoneLv;
const SLOTS=['arma','elmo','armadura','botas','amuleto'],SLOT_NAME={arma:'Arma',elmo:'Elmo',armadura:'Armadura',botas:'Botas',amuleto:'Amuleto'};
const RAR=[{n:'Comum',c:'#d0d0d0',m:1,aff:0},{n:'Incomum',c:'#6cd86c',m:1.25,aff:1},{n:'Raro',c:'#5aa8ff',m:1.55,aff:2},{n:'Épico',c:'#c070ff',m:1.95,aff:3},{n:'Lendário',c:'#ffa63a',m:2.5,aff:4}];
const SUFIX=['Gasto','de Ferro','Rúnico','Ancestral','do Dragão'];
const BASES={
 arma:{guerreiro:[['Espada','i_espada'],['Machado','i_machado'],['Martelo','i_martelo']],ladino:[['Adaga','i_adaga'],['Espada Curta','i_espada']],mago:[['Cajado','i_cajado'],['Cetro','i_cetro']],clerigo:[['Maça','i_martelo'],['Cetro Sagrado','i_cetro']],arqueiro:[['Arco','i_arco'],['Arco Longo','i_arco']],bardo:[['Florete','i_espada'],['Adaga de Palco','i_adaga']]},
 elmo:{guerreiro:[['Elmo','i_elmo']],ladino:[['Capuz','i_capuz']],mago:[['Chapéu','i_capuz']],clerigo:[['Elmo Sagrado','i_elmo']],arqueiro:[['Capuz','i_capuz']],bardo:[['Boina','i_capuz']]},
 armadura:{guerreiro:[['Couraça','i_couraca'],['Cota de Malha','i_cota']],ladino:[['Colete','i_colete']],mago:[['Manto','i_manto']],clerigo:[['Túnica','i_tunica']],arqueiro:[['Colete','i_colete']],bardo:[['Túnica','i_tunica']]},
 botas:{_:[['Botas','i_botas'],['Sandálias','i_sandalias']]},
 amuleto:{_:[['Colar','i_colar'],['Pingente','i_pingente'],['Talismã','i_talisma'],['Anel','i_anel']]}
};
const STAT_LBL={atk:'Ataque',def:'Defesa',hp:'Vida',crit:'Crítico %',spd:'Velocidade %'};
const PASS=[['vigor','Vigor','+8% de vida por nível'],['forca','Força','+6% de ataque por nível'],['arm','Armadura','+6% de defesa por nível'],['sorte','Sorte','+3% de crítico por nível']];
const IMG_ICO={};
const xpNeed=L=>Math.round(38*Math.pow(L,1.6)+30);

/* ------------------------------ assets ---------------------------------- */
const IMG={};
function loadImg(src){return new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>err(new Error('img '+src));i.src=src;});}
let ZONE=null,ATLAS=null,ATLAS_J=null,GROUND=null;
const SHEETS={};const MAPS={};const IMG_UI={};   // nome -> {walk,hurt,atk,cell,frames,anc:{x,y}}
function anchorOf(img,cx,cy,cw,ch){
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.drawImage(img,cx,cy,cw,ch,0,0,cw,ch);
  const d=x.getImageData(0,0,cw,ch).data;let minx=cw,maxx=-1,maxy=-1;
  for(let y=0;y<ch;y++)for(let xx=0;xx<cw;xx++)if(d[(y*cw+xx)*4+3]>10){if(xx<minx)minx=xx;if(xx>maxx)maxx=xx;if(y>maxy)maxy=y;}
  return maxx<0?{x:cw/2,y:ch-4}:{x:(minx+maxx)/2,y:maxy};
}
async function loadSheet(name,atkKind){
  const b='assets/chars/';const walk=await loadImg(b+name+'__walk.png'),hurt=await loadImg(b+name+'__hurt.png');
  let atk=null,cell=64,frames=6;
  if(atkKind){atk=await loadImg(b+name+'__'+atkKind+'.png');
    if(atkKind==='slash'){cell=atk.height/4>=190?192:64;frames=6;}
    else if(atkKind==='spellcast'){cell=64;frames=7;} else if(atkKind==='shoot'){cell=64;frames=13;}}
  const anc=[0,1,2,3].map(r=>anchorOf(walk,0,r*64,64,64));
  SHEETS[name]={walk,hurt,atk,cell,frames,anc};
}
function useMap(n){const m=MAPS[n];ZONE=m.zone;ATLAS=m.atlas;ATLAS_J=m.atlasJ;GROUND=m.ground;WATER=m.water;WCW=m.wcw;G.map=n;}
async function loadMap(name,zf,af,gf,pf){
  const [z,aj]=await Promise.all([fetch(zf).then(r=>r.json()),fetch(af).then(r=>r.json())]);
  const [g,at]=await Promise.all([loadImg(gf),loadImg(pf)]);MAPS[name]={zone:z,atlasJ:aj,ground:g,atlas:at,water:null,wcw:0};
}
async function loadAll(){
  LOOKM=await fetch('assets/look2/look2.json').then(r=>r.json());
  await Promise.all([loadMap('zone1','assets/zone1.json','assets/atlas.json','assets/zone1_ground.png','assets/atlas.png'),loadMap('town','assets/town.json','assets/town_atlas.json','assets/town_ground.png','assets/town_atlas.png')]);
  const jobs=[];
  for(const [k,c] of Object.entries(CLASSES))jobs.push(loadSheet(k,c.atk_==='cast'?'spellcast':c.atk_));
  for(const k of ['goblin','esqueleto','javali','rato','ogro'])jobs.push(loadSheet(k,'slash'));
  for(const k of ['bardo','guardiao','mago','guarda','pov_f','ladino_b'])if(!SHEETS[k])jobs.push(loadSheet(k,null));
  await Promise.all(jobs);
  for(const k of new Set(CLS_ORDER.flatMap(c=>CLASSES[c].skills.map(s=>s[0]))))IMG[k]=await loadImg('../assets/skill-icons/'+k+'.png').catch(()=>null);
  for(const n of ['i_espada','i_machado','i_martelo','i_adaga','i_cajado','i_cetro','i_arco','i_elmo','i_capuz','i_couraca','i_cota','i_colete','i_manto','i_tunica','i_botas','i_sandalias','i_colar','i_pingente','i_talisma','i_anel'])IMG_ICO[n]=await loadImg('../assets/ico/'+n+'.png').catch(()=>null);
  for(const n of ['coins','anvil','health-potion','treasure-map','clover','fist','heart-plus','shop','greek-temple'])IMG_UI[n]=await loadImg('../assets/ui-icons/'+n+'.png').catch(()=>null);
  for(const name of Object.keys(MAPS)){useMap(name);buildSolids();buildWater();MAPS[name].water=WATER;MAPS[name].wcw=WCW;
    if(name==='zone1')fixSpawns();else{ZONE.start=freeSpot(ZONE.start[0],ZONE.start[1]);ZONE.portal.stand=freeSpot(ZONE.portal.stand[0],ZONE.portal.stand[1]);}}
  useMap('town');
}

/* ------------------------------ colisão do cenário ---------------------- */
function buildSolids(){
  const S=[];
  for(const p of ZONE.props){
    if(p.col){for(const c of p.col)S.push({x:p.x+c[0],y:p.y+c[1],r:c[2]});continue;}
    if(p.t==='fire'){S.push({x:p.x,y:p.y-4,r:13});continue;}
    if(p.t!=='p')continue;const a=ATLAS_J[p.id];if(!a)continue;const w=a[2],h=a[3];
    if(h>=96)S.push({x:p.x,y:p.y-2,r:8});                       // tronco de árvore
    else if(h>=22){const fw=Math.max(8,w*.72),n=Math.max(1,Math.round(fw/10)),r=Math.max(5,Math.min(9,h*.16));   // pedras, arbustos, cercas, barris, tocos
      for(let i=0;i<n;i++)S.push({x:n===1?p.x:p.x+(i/(n-1)-.5)*(fw-10),y:p.y-3,r});}
  }
  ZONE.solids=S;
}
let WATER=null,WCW=0;
function buildWater(){

/* ------------------------------ itens ----------------------------------- */
function rollRar(boost=0){const r=Math.random()*100-boost;return r<.5?4:r<3?3:r<12?2:r<38?1:0;}
function genItem(ilvl,minR=0,boost=0){
  const slot=pick(SLOTS),rar=Math.max(minR,rollRar(boost)),R=RAR[rar],cls=SAVE.cls;
  const pool=(BASES[slot][cls]||BASES[slot]._),[bn,ic]=pick(pool);
  const m=R.m*rnd(.92,1.08),L=ilvl,s={};
  if(slot==='arma')s.atk=(2.2+L*1.1)*m;
  else if(slot==='elmo'){s.def=(1+L*.35)*m;s.hp=(4+L*3)*m;}
  else if(slot==='armadura'){s.def=(1.6+L*.6)*m;s.hp=(8+L*5)*m;}
  else if(slot==='botas'){s.def=(.8+L*.25)*m;s.spd=(2+L*.15)*m;}
  else {s.hp=(6+L*4)*m;s.crit=1.5*m;}
  const aff=[['atk',L*.35],['def',L*.18],['hp',L*2.5],['crit',1.2],['spd',1.6]];
  for(let i=0;i<R.aff;i++){const [k,v]=pick(aff);s[k]=(s[k]||0)+v*R.m*rnd(.8,1.2);}
  for(const k in s)s[k]=k==='crit'||k==='spd'?Math.round(s[k]*10)/10:Math.round(s[k]);
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),slot,rar,ilvl:L,name:bn+' '+SUFIX[rar],icon:ic,s};
}
function effS(it,k){const v=(it.s[k]||0)*(1+.08*(it.up||0));return k==='crit'||k==='spd'?Math.round(v*10)/10:Math.round(v);}
function itemName(it){return it.name+(it.up?' +'+it.up:'');}
function itemScore(it){if(!it)return 0;const s={};for(const k in it.s)s[k]=effS(it,k);return (s.atk||0)*3+(s.def||0)*2+(s.hp||0)*.35+(s.crit||0)*4+(s.spd||0)*1.5;}
function itemVal(it){return Math.round((3+it.ilvl*2)*Math.pow(it.rar+1,1.5)*(1+.35*(it.up||0)));}
function gearTotals(){const t={atk:0,def:0,hp:0,crit:0,spd:0};for(const k of SLOTS){const it=SAVE.eq[k];if(it)for(const st in it.s)t[st]+=effS(it,st);}return t;}
function skPoints(){const spent=(SAVE.sk[0]-1)+SAVE.sk[1]+SAVE.sk[2];return (SAVE.lv-1)-spent;}
const ATTR=[['for','Força','+2% de ataque por ponto'],['vit','Vitalidade','+2,7% de vida por ponto'],['res','Resistência','+2% de defesa por ponto'],['agi','Agilidade','+0,7% de vel. de ataque e +0,5% de movimento'],['sor','Sorte','+1% de chance de crítico por ponto']];

function collide(e,r=6){

    if(e._lx!==undefined){const lx=e._lx,ly=e._ly;
      if(!isWater(e.x,ly)&&!isWater(e.x,ly+4))e.y=ly;else if(!isWater(lx,e.y)&&!isWater(lx,e.y+4))e.x=lx;else{e.x=lx;e.y=ly;}}
  }
  if(!isWater(e.x,e.y)&&!isWater(e.x,e.y+4)){e._lx=e.x;e._ly=e.y;}
}

  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d<1)return 0;
  if(G.t-(e._lt||-9)>.3){e._sx=e.x;e._sy=e.y;e._sc=0;}   // voltou a andar depois de uma pausa
  e._lt=G.t;e._sc=(e._sc||0)+dt;
  if(e._sc>=.5){const mv=Math.hypot(e.x-e._sx,e.y-e._sy);
    if(mv<sp*.5*.3&&!e.detour&&d>16){const px=-dy/d,py=dx/d,sd=Math.random()<.5?1:-1;e.detour={x:e.x+px*sd*80+dx/d*30,y:e.y+py*sd*80+dy/d*30,t:1.3};}
    e._sx=e.x;e._sy=e.y;e._sc=0;}
  const s=Math.min(d,sp*dt);e.x+=dx/d*s;e.y+=dy/d*s;e.row=dir4(dx,dy);return s;
}
function nearestMob(from,maxD){let b=null,bd=maxD;for(const m of G.mobs){if(m.dead)continue;const d=dist(from,m);if(d<bd){bd=d;b=m;}}return b;}

  else if(a==='sell'&&it&&panSel.src==='bag'){SAVE.inv.splice(panSel.k,1);sellItem(it);panSel=null;}
  else if(a==='unequip'&&it&&panSel.src==='eq'){if(SAVE.inv.length>=24){sfx('ui_denied');toast('Mochila cheia',1000);return;}SAVE.inv.push(it);delete SAVE.eq[it.slot];panSel=null;sfx('ui_click');recalcHero(true);}
  else if(a==='best'){let n=0;for(let i=SAVE.inv.length-1;i>=0;i--){const x=SAVE.inv[i],cur=SAVE.eq[x.slot];if(itemScore(x)>itemScore(cur)+.01){SAVE.inv.splice(i,1);if(cur)SAVE.inv.push(cur);SAVE.eq[x.slot]=x;n++;}}if(n){sfx('tr_equip',.8);recalcHero(true);}else sfx('ui_denied');panSel=null;}
  else if(a==='sellc'){let g=0,n=0;SAVE.inv=SAVE.inv.filter(x=>{if(x.rar===0){g+=itemVal(x);n++;return false;}return true;});SAVE.gold+=g;if(n)sfx('coin',.7);else sfx('ui_denied');panSel=null;}
  else if(a==='auto'){SAVE.autoEq=!SAVE.autoEq;sfx('ui_click');}
  else if(a==='pot'){if(SAVE.gold<potPrice()){sfx('ui_denied');return;}SAVE.gold-=potPrice();SAVE.potions++;sfx('coin',.7);updPot();}
  else if(a==='reset'){if(SAVE.gold<resetCost()){sfx('ui_denied');return;}SAVE.gold-=resetCost();SAVE.sk=[1,0,0];sfx('ui_confirm');afterPts();return;}
  else if(a==='resetat'){if(SAVE.gold<resetCost()){sfx('ui_denied');return;}SAVE.gold-=resetCost();SAVE.at={for:0,vit:0,res:0,agi:0,sor:0};sfx('ui_confirm');afterPts();return;}
  updPot();badge();writeSave();renderPan();
}
$('tEq').onclick=()=>{panTab='eq';panSel=null;sfx('ui_click');renderPan();};
$('tSk').onclick=()=>{panTab='sk';panSel=null;sfx('ui_click');renderPan();};

/* ------------------------------ janelas dos NPCs ------------------------ */
const UI='../assets/ui-icons/';
function openWin(id){sfx('tr_open',.6);G.winOpen=id;G.wp=null;if(id==='forja'&&!G.fslot)G.fslot=SLOTS.find(k=>SAVE.eq[k])||'arma';if(id==='mercador'&&!G.shop)restock(true);
  $('toast').style.display='none';$('win').classList.add('on');renderWin();}
function closeWin(){G.winOpen=null;$('win').classList.remove('on');}
$('wx').onclick=()=>{sfx('tr_close',.6);closeWin();};
function renderWin(){const f={mercador:winMercador,forja:winForja,alquimista:winAlq,portal:winPortal,locais:winLocais}[G.winOpen];if(f){f();updPot();}}
$('wbody').addEventListener('click',ev=>{const e=ev.target.closest('[data-a]');if(!e||e.disabled)return;winAct(e.dataset.a);});
function coin(n){return `<span class="pr"><img src="${UI}coins.png">${n}</span>`;}
function itemRow(it,btn,price,extra){const R=RAR[it.rar];const st=['atk','def','hp','crit','spd'].filter(k=>effS(it,k)).map(k=>STAT_LBL[k].replace(' %','')+' +'+effS(it,k)).join(' · ');
  return `<div class="wr"><img class="ic" style="border-color:${R.c}" src="../assets/ico/${it.icon}.png"><div class="tx"><b style="color:${R.c}">${itemName(it)}</b><span>${R.n} · ${SLOT_NAME[it.slot]} · Nv ${it.ilvl}<br>${st}</span></div>${price!=null?coin(price):''}${btn||''}</div>`;}
function goldBar(){return `<div class="wgold"><img src="${UI}coins.png">${SAVE.gold} ouro</div>`;}
/* Locais (atalho na barra da cidade) */
function winLocais(){
  $('wtt').textContent='IR PARA...';
  let h='<div class="sub">Toque em um lugar da cidade e o herói vai sozinho até lá.</div>';
  for(const n of G.npcs)h+=`<div class="wr"><img class="ic" src="${UI}${n.ic}.png"><div class="tx"><b>${n.nm}</b><span>${{mercador:'Vender e comprar equipamentos',forja:'Melhorar o equipamento',alquimista:'Poções e elixires',portal:'Entrar nas dungeons'}[n.win]}</span></div><button class="gb" data-a="goto:${n.id}">IR</button></div>`;
  h+=`<div class="wr"><img class="ic" src="${UI}greek-temple.png"><div class="tx"><b>Portal das Dungeons</b><span>Entrar nas dungeons</span></div><button class="gb" data-a="goto:portal">IR</button></div>`;
  $('wbody').innerHTML=h;
}
/* Mercador */
function restock(free){const L=Math.max(1,Math.round(SAVE.lv*.9+2));G.shop=[];for(let i=0;i<5;i++)G.shop.push(genItem(L+rint(0,2),i>=3?1:0,i>=2?14:0));}
function winMercador(){
  $('wtt').textContent='MERCADOR';const tab=G.mtab||'sell';
  let h=goldBar()+`<div class="tabs"><button data-a="mt:sell" class="${tab==='sell'?'on':''}">VENDER</button><button data-a="mt:buy" class="${tab==='buy'?'on':''}">COMPRAR</button></div>`;
  if(tab==='sell'){
    if(!SAVE.inv.length)h+='<div class="sub" style="padding:16px 0">Sua mochila está vazia.<br>Itens equipados não são vendidos.</div>';
    SAVE.inv.forEach((it,i)=>{h+=itemRow(it,`<button class="gb" data-a="sell:${i}">VENDER</button>`,itemVal(it));});
    const c0=SAVE.inv.filter(x=>x.rar===0),c1=SAVE.inv.filter(x=>x.rar===1),g=a=>a.reduce((t,x)=>t+itemVal(x),0);
    h+=`<div class="wdiv"></div><div style="display:flex;gap:6px"><button class="db" style="flex:1" data-a="sellr:0" ${c0.length?'':'disabled'}>COMUNS (${c0.length}) +${g(c0)}</button><button class="db" style="flex:1" data-a="sellr:1" ${c1.length?'':'disabled'}>INCOMUNS (${c1.length}) +${g(c1)}</button></div>`;
  }else{
    G.shop.forEach((it,i)=>{if(!it)return;const p=itemVal(it)*4;h+=itemRow(it,`<button class="gb" data-a="buy:${i}" ${SAVE.gold<p?'disabled':''}>COMPRAR</button>`,p);});
    const rc=40+SAVE.lv*6;h+=`<div class="wdiv"></div><button class="db" data-a="restock" ${SAVE.gold<rc?'disabled':''}>RENOVAR ESTOQUE (${rc} ouro)</button>`;
  }
  $('wbody').innerHTML=h;
}
/* Ferreiro */
function upCost(it){return Math.round((18+it.ilvl*5)*((it.up||0)+1)*(1+it.rar*.4));}
function upChance(it){const n=(it.up||0)+1;return n<=2?1:n===3?.9:n===4?.8:n===5?.7:1;}
function winForja(){
  $('wtt').textContent='FERREIRO';const it=SAVE.eq[G.fslot];
  let h=goldBar()+'<div class="sub">Melhore o equipamento que você está usando. Falhas só até o +5 e nunca destroem o item.</div><div class="fslots">'+
    SLOTS.map(k=>{const x=SAVE.eq[k];return x?`<div class="fs ${k===G.fslot?'sel':''}" style="border-color:${RAR[x.rar].c}" data-a="fs:${k}"><img src="../assets/ico/${x.icon}.png">${x.up?`<i>+${x.up}</i>`:''}</div>`:`<div class="fs" style="opacity:.35;display:flex;align-items:center;justify-content:center;font-size:8px;color:#8a7a5a;text-align:center" data-a="fs:${k}">${SLOT_NAME[k]}</div>`;}).join('')+'</div>';
  if(!it)h+='<div class="sub" style="padding:18px 0">Nenhum item equipado neste espaço.<br>Equipe um item na mochila.</div>';
  else{const R=RAR[it.rar],up=it.up||0,nx={...it,up:up+1},max=up>=10,ch=upChance(it),cost=upCost(it);
    h+=`<div class="fbig"><div class="fi" id="fitem" style="border-color:${R.c}"><img src="../assets/ico/${it.icon}.png"></div><b style="color:${R.c};font-size:14px">${itemName(it)}</b><span style="font-size:10px;color:#cdb68a">${R.n} · ${SLOT_NAME[it.slot]} · Nv ${it.ilvl}</span></div><div class="wdiv"></div>`;
    ['atk','def','hp','crit','spd'].filter(k=>it.s[k]).forEach(k=>{h+=`<div class="stline"><span>${STAT_LBL[k]}</span><span>${effS(it,k)} ${max?'':`<span class="up">▶ ${effS(nx,k)}</span>`}</span></div>`;});
    h+=max?'<div class="sub" style="padding:8px 0;color:#ffd65a">Nível máximo (+10)</div>':`<div class="stline" style="margin-top:4px"><span>Chance de sucesso</span><span style="color:${ch<1?'#ffd678':'#96e08a'}">${Math.round(ch*100)}%</span></div><div class="fbar"><b style="width:${ch*100}%"></b></div><div class="stline"><span>Custo</span>${coin(cost)}</div>`;
    if(G.fmsg)h+=`<div style="text-align:center;font-size:15px;font-weight:700;color:${G.fmsg.ok?'#ffe08a':'#ff9a8a'};margin-top:2px">${G.fmsg.t}</div>`;
    h+=`<button class="gb big" data-a="up" ${max||SAVE.gold<cost?'disabled':''}>MELHORAR</button>`;}
  $('wbody').innerHTML=h;
}
/* Alquimista */
const ELIX={forca:['Elixir de Força','fist','+20% de ataque'],vigor:['Elixir de Vigor','heart-plus','+20% de vida'],sorte:['Elixir da Sorte','clover','+drops e itens melhores']};
function elixPrice(){return 60+SAVE.lv*12;}
function winAlq(){
  $('wtt').textContent='ALQUIMISTA';
  let h=goldBar()+'<div class="sub">Poções curam sozinhas na dungeon. Elixires duram 5 min dentro da dungeon.</div>';
  h+=`<div class="wr"><img class="ic" src="${UI}health-potion.png"><div class="tx"><b>Poção de Cura</b><span>Cura 45% da vida · você tem ${SAVE.potions}</span></div>${coin(potPrice())}<button class="gb" data-a="bp:s" ${SAVE.gold<potPrice()?'disabled':''}>COMPRAR</button></div>`;
  h+=`<div class="wr"><img class="ic" src="${UI}healing.png"><div class="tx"><b>Poção Maior</b><span>Cura 80% da vida · você tem ${SAVE.potL}</span></div>${coin(Math.round(potPrice()*2.6))}<button class="gb" data-a="bp:l" ${SAVE.gold<Math.round(potPrice()*2.6)?'disabled':''}>COMPRAR</button></div>`;
  h+='<div class="wdiv"></div>';
  for(const k of ['forca','vigor','sorte']){const [n,ic,d]=ELIX[k],left=SAVE.elix[k]||0;
    h+=`<div class="wr"><img class="ic" src="${UI}${ic}.png"><div class="tx"><b>${n}</b><span>${d}${left>0?` · <b style="color:#96e08a;display:inline">ativo ${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}</b>`:''}</span></div>${coin(elixPrice())}<button class="gb" data-a="be:${k}" ${SAVE.gold<elixPrice()?'disabled':''}>BEBER</button></div>`;}
  $('wbody').innerHTML=h;
}
/* Portal */
const DUNGS=[{nm:'Clareira de Brumavale',sub:'Nv 1+ · Chefe: Ogro de Brumavale',ic:'crossed-swords',ok:true},{nm:'Floresta Gelada',sub:'Nv 8+ · em breve',ic:'snowflake-1'},{nm:'Ruínas de Pedra',sub:'Nv 15+ · em breve',ic:'greek-temple'},{nm:'Floresta Seca',sub:'Nv 22+ · em breve',ic:'tornado-discs'}];
function winPortal(){
  $('wtt').textContent='PORTAL DAS DUNGEONS';const zs=G.pz||Math.min(SAVE.zoneMax||1,SAVE.zone||1)||1;G.pz=clamp(zs,1,SAVE.zoneMax||1);
  let h='<div class="sub">Dentro da dungeon o herói luta sozinho. Volte à cidade quando quiser.</div>';
  DUNGS.forEach((d,i)=>{
    if(d.ok){h+=`<div class="wr sel"><img class="ic" src="${UI}${d.ic}.png"><div class="tx"><b>${d.nm}</b><span>${d.sub}</span></div></div>
      <div style="display:flex;align-items:center;gap:6px"><button class="db" data-a="pz:-1" ${G.pz<=1?'disabled':''}>◀</button><div style="flex:1;text-align:center;font-size:12px"><b style="color:#ffd65a">Zona ${G.pz}</b><br><span style="color:#cdb68a;font-size:10px">Monstros Nv ${1+(G.pz-1)*2}–${3+(G.pz-1)*2} · Chefe Nv ${6+(G.pz-1)*2}${G.pz>1?'<br>itens melhores':''}</span></div><button class="db" data-a="pz:1" ${G.pz>=(SAVE.zoneMax||1)?'disabled':''}>▶</button></div>
      <button class="gb big" data-a="go">ENTRAR NA DUNGEON</button>`;}
    else h+=`<div class="wr lock"><img class="ic" src="${UI}${d.ic}.png"><div class="tx"><b>${d.nm}</b><span>${d.sub}</span></div><img src="${UI}padlock.png" style="width:20px;height:20px;image-rendering:pixelated"></div>`;});
  $('wbody').innerHTML=h;
}
function winAct(a){
  const [k,v]=a.split(':');
  if(k==='goto'){closeWin();const t=v==='portal'?{kind:'portal'}:G.npcs.find(n=>n.id===v);G.wp=v==='portal'?{x:ZONE.portal.stand[0],y:ZONE.portal.stand[1],target:t}:{x:t.x,y:t.y+8,target:t};sfx('ui_confirm',.6);return;}
  if(k==='mt'){G.mtab=v;sfx('ui_click');}
  else if(k==='sell'){const i=+v,it=SAVE.inv[i];if(!it)return;SAVE.inv.splice(i,1);SAVE.gold+=itemVal(it);sfx('coin',.7);}
  else if(k==='sellr'){let g=0,n=0;SAVE.inv=SAVE.inv.filter(x=>{if(x.rar===+v){g+=itemVal(x);n++;return false;}return true;});SAVE.gold+=g;sfx(n?'coin':'ui_denied',.8);}
  else if(k==='buy'){const i=+v,it=G.shop[i];if(!it)return;const p=itemVal(it)*4;if(SAVE.gold<p){sfx('ui_denied');return;}SAVE.gold-=p;G.shop[i]=null;sfx('coin',.7);addItem(it);}
  else if(k==='restock'){const rc=40+SAVE.lv*6;if(SAVE.gold<rc){sfx('ui_denied');return;}SAVE.gold-=rc;restock();sfx('coin',.7);}
  else if(k==='fs'){G.fslot=v;G.fmsg=null;sfx('ui_click');}
  else if(k==='up'){const it=SAVE.eq[G.fslot];if(!it)return;const cost=upCost(it);if(SAVE.gold<cost||(it.up||0)>=10){sfx('ui_denied');return;}
    SAVE.gold-=cost;sfx('hit_0',.8);setTimeout(()=>sfx('hit_1',.8),180);
    if(Math.random()<upChance(it)){it.up=(it.up||0)+1;recalcHero(true);G.fmsg={ok:true,t:'SUCESSO! '+itemName(it)};setTimeout(()=>sfx(it.up>=5?'levelup':'tr_equip',.9),380);}
    else{G.fmsg={ok:false,t:'FALHOU! O item continua +'+(it.up||0)};setTimeout(()=>sfx('ui_denied',.8),380);}
    renderWin();const f=$('fitem');if(f)f.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:320});writeSave();return;}
  else if(k==='bp'){const big=v==='l',p=big?Math.round(potPrice()*2.6):potPrice();if(SAVE.gold<p){sfx('ui_denied');return;}SAVE.gold-=p;if(big)SAVE.potL++;else SAVE.potions++;sfx('coin',.7);}
  else if(k==='be'){const p=elixPrice();if(SAVE.gold<p){sfx('ui_denied');return;}SAVE.gold-=p;SAVE.elix[v]=300;recalcHero(true);sfx('heal',.8);sfx('coin',.5);}
  else if(k==='pz'){G.pz=clamp((G.pz||1)+ +v,1,SAVE.zoneMax||1);sfx('ui_click');}
  else if(k==='go'){sfx('spell_cast',.8);sfx('levelup',.4);enterDungeon(G.pz||1);return;}
  badge();writeSave();renderWin();
}
/* ------------------------------ loop ------------------------------------ */
let last=0,hudAcc=0;
function frame(ts){
  requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(document.getElementById('create').classList.contains('on')){cprevT++;drawPreview(ts/1000);return;}
  if(!G.on)return;
  const steps=G.speed;for(let i=0;i<steps;i++)update(dt);
  render();hudAcc+=dt;if(hudAcc>.1){hudAcc=0;updHUD();}
}
/* ------------------------------ entrada --------------------------------- */
function tapFx(x,y){const e=$('tapfx');e.style.left=x+'px';e.style.top=y+'px';e.animate([{opacity:.9,transform:'translate(-50%,-50%) scale(.3)'},{opacity:0,transform:'translate(-50%,-50%) scale(1.3)'}],{duration:380});}
$('cv').addEventListener('pointerdown',ev=>{
  if(!G.on||G.winOpen)return;const r=$('cv').getBoundingClientRect();const lx=(ev.clientX-r.left)/r.width*G.LW+G.cam.x,ly=(ev.clientY-r.top)/r.height*G.LH+G.cam.y;
  const fx=()=>{tapFx(ev.clientX-$('stage').getBoundingClientRect().left,ev.clientY);sfx('ui_click',.4);};
  if(G.scene==='town'){
    let t=null;for(const n of G.npcs)if(Math.abs(lx-n.x)<24&&ly>n.y-62&&ly<n.y+10)t=n;
    if(!t){const P=ZONE.portal;if(Math.abs(lx-P.x)<46&&ly>P.y-90&&ly<P.y+14)t={kind:'portal'};}
    if(t&&t.kind==='npc')G.wp={x:t.x,y:t.y+8,target:t};else if(t)G.wp={x:ZONE.portal.stand[0],y:ZONE.portal.stand[1],target:t};else G.wp={x:lx,y:ly};
    fx();return;
  }
  if(G.auto)return;G.wp={x:lx,y:ly};fx();
});
$('bNew').onclick=()=>{if(SAVE&&!confirm('Você já tem um herói ('+SAVE.name+'). Criar um novo apaga o herói atual. Continuar?'))return;audioInit();sfx('ui_confirm');SAVE={name:'',cls:'guerreiro',lv:1,xp:0,gold:0,zone:1,inv:[],eq:{},potions:2,potL:0,elix:{forca:0,vigor:0,sorte:0},zoneMax:1,sk:[1,0,0],at:{for:0,vit:0,res:0,agi:0,sor:0},autoEq:true};selCls='guerreiro';$('cname').value='';show('create');buildCreate();playMusic('m_campina');};
$('bCont').onclick=()=>{audioInit();sfx('ui_confirm');G.zoneLv=SAVE.zoneMax||SAVE.zone||1;startGame();};
$('cname').addEventListener('input',()=>{updCreateBtn();});
document.querySelectorAll('.ctabs button').forEach(b=>b.onclick=()=>{ctab=b.dataset.t;document.querySelectorAll('.ctabs button').forEach(x=>x.classList.toggle('on',x===b));sfx('ui_click',.6);renderLook();});
$('bSug').onclick=()=>{sfx('ui_click',.6);$('cname').value=NOMES[Math.floor(Math.random()*NOMES.length)];updCreateBtn();};
$('cBack').onclick=()=>{sfx('tr_close',.6);if(cstep>1)setStep(cstep-1);else show('title');};

  SAVE={name:n,cls:selCls,lv:1,xp:0,gold:0,zone:1,totalKills:0,inv:[],eq:{},potions:2,potL:0,elix:{forca:0,vigor:0,sorte:0},zoneMax:1,sk:[1,0,0],at:{for:0,vit:0,res:0,agi:0,sor:0},autoEq:true,look:{...LK}};writeSave();sfx('ui_confirm');sfx('levelup',.5);G.zoneLv=1;startGame();}
$('bNext').onclick=()=>{sfx('ui_confirm');nextZone();};
$('bTown').onclick=()=>{sfx('ui_confirm');show('hud');enterTown(false);};
document.addEventListener('pointerdown',()=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();},{passive:true});
window.addEventListener('resize',fitStage);window.addEventListener('orientationchange',()=>setTimeout(fitStage,100));
setInterval(()=>{if(G.on&&SAVE)writeSave();},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&SAVE&&G.on)writeSave();});
/* ------------------------------ início ---------------------------------- */
(async function(){
  fitStage();
  SAVE=loadSave();if(SAVE){$('bCont').style.display='block';$('bCont').textContent='CONTINUAR · '+SAVE.name+' Nv.'+SAVE.lv;}

})();
