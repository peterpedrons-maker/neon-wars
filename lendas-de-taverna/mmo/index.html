<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140e09">

<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<title>Hearthblade — Lendas de Brumavale</title>
<style>
@font-face{font-family:'Rubik';src:url(assets/fonts/Rubik.woff2) format('woff2');font-weight:300 900;font-display:swap}
@font-face{font-family:'Cinzel';src:url(assets/fonts/Cinzel.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'CinzelDeco';src:url(assets/fonts/CinzelDecorative-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--ft:'Cinzel',Georgia,serif;--fd:'CinzelDeco','Cinzel',Georgia,serif;--f:'Rubik',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
--papel:#e9e2d0;--papel2:#a39b86;--ouro:#ffd65a;--ouroC:#f3d98e;--ouroE:#d9b45f;--lin:rgba(217,180,95,.45);--gl:rgba(12,11,17,.94);--bg:#18110b;--verde:#6cc35e;--azul:#5490e0;--verm:#d6403a;--borda:#8a6a3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--papel);font-family:var(--f);font-size:13px;overflow:hidden;touch-action:manipulation}
#stage{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);background:var(--bg);overflow:hidden}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:none}
#gc{position:absolute;inset:0;display:none;z-index:300;align-items:center;justify-content:center;padding:22px;background:rgba(4,3,8,.74);backdrop-filter:blur(2px)}
#gc.on{display:flex;animation:gcf .14s ease-out}@keyframes gcf{from{opacity:0}to{opacity:1}}
#gc .gcb{position:relative;width:100%;max-width:310px;background:linear-gradient(180deg,rgba(24,20,32,.97),rgba(11,10,16,.98));border:1px solid var(--lin);box-shadow:0 14px 40px rgba(0,0,0,.75),inset 0 0 0 1px rgba(0,0,0,.8);padding:18px 18px 14px;animation:pop .16s ease-out}
#gc h3{margin:0 0 8px;font:700 15px var(--ft);letter-spacing:.1em;text-transform:uppercase;color:var(--ouroC);text-align:center}
#gc p{margin:0 0 16px;font:400 13px/1.45 var(--f);color:var(--papel);text-align:center;white-space:pre-line}
#gc .gcbt{display:flex;gap:10px}#gc button{flex:1;height:40px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 11px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--papel)}
#gc button.ok{background:linear-gradient(#f0cf7c,#b98a2f);border-color:var(--ouroC);color:#2a1a06}#gc button.danger{background:linear-gradient(#e0605a,#9a2a26);border-color:#ffb0a8;color:#fff}
#gc i{position:absolute;width:9px;height:9px;border:2px solid var(--ouroE)}#gc .c1{left:-2px;top:-2px;border-width:2px 0 0 2px}#gc .c2{right:-2px;top:-2px;border-width:2px 2px 0 0}#gc .c3{left:-2px;bottom:-2px;border-width:0 0 2px 2px}#gc .c4{right:-2px;bottom:-2px;border-width:0 2px 2px 0}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.txt-o{text-shadow:0 1px 0 #140e09,1px 0 0 #140e09,-1px 0 0 #140e09,0 -1px 0 #140e09}
button{font-family:var(--f);cursor:pointer;color:var(--papel);transition:transform .08s,filter .1s}
button:active:not(:disabled){transform:scale(.97);filter:brightness(1.15)}
/* ---------- vidro escuro com moldura fina dourada ---------- */
.panel,#hero,#prog,#bar,#gold,#toast,#win .box,#pan .box,.gl{background:var(--gl);border:1px solid var(--lin);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 6px 20px rgba(0,0,0,.55);position:relative}
#win .box::before,#pan .box::before,.gl::before,#win .box::after,#pan .box::after,.gl::after{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--ouroE);pointer-events:none}
#win .box::before,#pan .box::before,.gl::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
#win .box::after,#pan .box::after,.gl::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:46px;padding:0 10px;border:1px solid var(--ouroC);background:linear-gradient(#f0cf7c,#b98a2f);color:#2a1a06;font:700 13px var(--ft);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 0 #ffe8a8;box-shadow:0 0 14px rgba(217,180,95,.3)}
.btn.sec{background:linear-gradient(#2a2433,#17131d);border-color:var(--lin);color:var(--papel);text-shadow:none;box-shadow:none}
.btn:disabled{background:linear-gradient(#26222e,#15121a);border-color:rgba(217,180,95,.25);color:#6c6678;text-shadow:none;box-shadow:none}
/* título */
#title{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#2d4a1e,#0e150a 70%);padding:24px;gap:14px;text-align:center}
#title img{width:78%;max-width:300px;image-rendering:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
#title .sub{font:600 11px var(--ft);letter-spacing:.28em;text-transform:uppercase;color:var(--papel2)}
#title .col{width:80%;max-width:300px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
#title a{color:var(--papel2);font-size:11px;text-decoration:underline}
/* ---------- criação em 3 etapas ---------- */
#create{background:radial-gradient(ellipse at 50% 28%,#2b2a3a,#0b0b12 72%);padding:0 12px 14px}
#csteps{display:flex;justify-content:center;align-items:flex-start;padding-top:12px;flex:none}
#csteps .s{display:flex;flex-direction:column;align-items:center;gap:7px;width:84px;font:600 9px var(--ft);letter-spacing:.14em;color:var(--papel2);text-transform:uppercase}
#csteps .s i{width:24px;height:24px;border:1px solid var(--lin);display:grid;place-items:center;font:700 12px var(--ft);font-style:normal;transform:rotate(45deg);background:#14111a}
#csteps .s i span{transform:rotate(-45deg)}
#csteps .s.on{color:var(--ouroC)}#csteps .s.on i{background:linear-gradient(#f0cf7c,#b98a2f);color:#2a1a06;border-color:var(--ouroC);box-shadow:0 0 12px rgba(217,180,95,.5)}
#csteps .s.ok i{background:#2a2433;color:var(--ouroE)}
#csteps .ln{width:34px;height:1px;background:var(--lin);margin-top:12px}
#cstage{position:relative;flex:1;min-height:120px}
#cprev{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#cname-tag{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:700 11px var(--ft);letter-spacing:.28em;text-transform:uppercase;color:var(--ouroE);text-shadow:0 1px 3px #000}
.cstep{display:none;flex-direction:column;gap:10px;flex:none}.cstep.on{display:flex}
#cls{display:flex;gap:6px;justify-content:center}
#cls button{width:50px;height:50px;padding:2px;background:#14111a;border:1px solid var(--lin);position:relative}
#cls button canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#cls button.on{border-color:var(--ouroC);box-shadow:0 0 12px rgba(217,180,95,.5);background:#241d12}
#cinfo{padding:12px 14px;display:grid;grid-template-columns:1fr auto;column-gap:10px}
#cinfo h3{margin:0;font:700 20px var(--ft);letter-spacing:.06em;color:var(--ouroC)}
#cinfo .papel{font:700 10.5px var(--ft);letter-spacing:.14em;text-transform:uppercase;color:#8fd88a;align-self:center}
#cinfo p{grid-column:1/3;margin:3px 0 8px;font-size:12px;color:var(--papel2)}
#cbars{grid-column:1/3}
.sbar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--papel2);margin:3px 0}
.sbar span{width:52px}.sbar i{flex:1;height:6px;background:#0a090e;border:1px solid #3a3446;position:relative;display:block}
.sbar i b{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .35s}
#csk{grid-column:1/3;margin-top:8px}#csk .h{font:600 10px var(--ft);letter-spacing:.14em;color:var(--papel2);margin-bottom:6px;text-transform:uppercase}
#csk .r{display:flex;gap:6px}#csk img{width:36px;height:36px;image-rendering:pixelated;background:#0d0b11;border:1px solid var(--lin);padding:2px}
.ctabs{display:flex;border-bottom:1px solid var(--lin)}
.ctabs button{flex:1;height:34px;border:0;background:transparent;color:var(--papel2);font:700 11px var(--ft);letter-spacing:.14em;text-transform:uppercase}
.ctabs button.on{color:var(--ouroC);background:linear-gradient(#2a2433,#17131d);box-shadow:inset 0 -2px 0 var(--ouroE)}
#look{padding:6px 12px 10px;min-height:248px}
#look .lr{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid rgba(255,255,255,.06)}
#look .lr>span{width:62px;flex:none;font:600 10px var(--ft);letter-spacing:.14em;text-transform:uppercase;color:var(--papel2)}
#look .sw{display:grid;grid-template-columns:repeat(7,26px);gap:6px;flex:1;padding:6px 0}
#look .sw button{width:26px;height:26px;border:1px solid #000;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
#look .sw button.on{outline:2px solid var(--ouroC);outline-offset:1px}
#look .sel{flex:1;display:flex;align-items:center;justify-content:space-between;height:32px;border:1px solid var(--lin);background:#0e0c13;padding:0 4px}
#look .sel b{font:600 12.5px var(--f);color:var(--papel)}
#look .sel a{width:24px;height:24px;display:grid;place-items:center;color:var(--ouroC);font-size:11px;background:#1c1822;cursor:pointer}
#look .sel a:active{background:#2c2636}
#look .tools{display:flex;gap:8px;margin-top:12px}
#look .tools button{flex:1;height:34px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10.5px var(--ft);letter-spacing:.12em;text-transform:uppercase}
#cs3 .gl{padding:14px}
#cs3 label{display:block;text-align:center;font:600 10px var(--ft);letter-spacing:.2em;color:var(--papel2);margin-bottom:8px}
#cname{width:100%;height:46px;border:1px solid var(--lin);background:#0e0c13;color:var(--ouroC);font:700 19px var(--ft);text-align:center;letter-spacing:.1em;outline:0;border-radius:0}
#cname:focus{border-color:var(--ouroC)}#cname::placeholder{color:#6c6678;font-weight:500}
#cs3 .tools{display:flex;margin-top:10px}#cs3 .tools button{flex:1;height:32px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10px var(--ft);letter-spacing:.12em;text-transform:uppercase}
.st{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;font-size:12px}
.st div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:3px 0}.st b{color:var(--ouroC);font-weight:600}
#cnav{display:flex;gap:10px;flex:none;margin-top:12px}#cnav .btn{flex:1}
/* ---------- HUD ---------- */
#hud{pointer-events:none}#hud *{pointer-events:none}#hud button{pointer-events:auto}
#hero{position:absolute;left:6px;top:calc(6px + env(safe-area-inset-top));width:186px;padding:7px 9px 8px 62px;min-height:58px;background:linear-gradient(180deg,rgba(40,32,52,.94),rgba(18,14,24,.94));border-color:#8a7440;box-shadow:inset 0 0 0 1px rgba(255,226,150,.14),inset 0 1px 0 rgba(255,255,255,.12),0 6px 20px rgba(0,0,0,.6)}
#hero::before,#hero::after{content:'';position:absolute;width:7px;height:7px;border:2px solid #d9b45f}#hero::before{left:-3px;top:-3px;border-right:0;border-bottom:0}#hero::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
#hport{position:absolute;left:7px;top:7px;width:46px;height:46px;background:#0d0b11;border:2px solid #d9b45f;box-shadow:0 0 0 1px #3a2c10,inset 0 0 0 1px #0a0a10,0 2px 6px rgba(0,0,0,.6)}
#hport canvas{position:absolute;left:0;top:0;width:42px!important;height:42px!important;border:0!important;background:radial-gradient(circle at 50% 35%,#3a3050,#14101c)}
#hl{position:absolute;right:-9px;bottom:-9px;min-width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#c8962e 70%,#8a6418);border:2px solid #3a2808;color:#2a1a06;font:800 10.5px/16px var(--f);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.7);padding:0 2px;box-sizing:border-box}
#hero canvas{image-rendering:pixelated}
#hero .nm{font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;line-height:1.2}
#hero .nm span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:104px;font-weight:700;letter-spacing:.02em}#hero .nm span:last-child{color:#d9b45f;font:600 9px var(--f);letter-spacing:.1em;text-transform:uppercase;align-self:center}
.bar{height:8px;background:#0a090e;margin-top:3px;position:relative;border:1px solid #3a3446}
.bar b{display:block;position:absolute;left:0;top:0;bottom:0}
#hpw{position:relative}#hpw #hp{height:15px;margin-top:4px;border:1px solid #5a4a28;background:#120c0c;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}#hpw #hp::after{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
#hp b{background:linear-gradient(#ff7a6a,#d6302a 55%,#a01c18)}#xp b{background:linear-gradient(#8fc2ff,#3a7be0)}
#hpt{position:absolute;left:0;right:0;top:4px;height:15px;line-height:15px;text-align:center;font:600 9px var(--f);color:#fff;text-shadow:0 1px 1px #000,0 0 2px #000}
#hero #xp{height:6px;margin-top:4px;border-color:#2a3a5a;background:linear-gradient(#070b16,#0d1426)}#hero #xp b::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.35)}#hport::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 8px rgba(0,0,0,.7);pointer-events:none}#hero #xp b{box-shadow:0 0 6px rgba(120,180,255,.6)}#xpt{position:absolute;right:9px;bottom:1px;font:600 7px var(--f);color:#9fc4ff;opacity:.9;display:none}
#gold{display:none!important;position:absolute;left:6px;top:calc(66px + var(--sth,0px) + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;height:26px;padding:0 12px 0 8px;font:700 13px var(--f);color:var(--ouroC)}
#gold::before{content:'';width:16px;height:16px;background:url(assets/ui2/i_coin.png) center/contain no-repeat;image-rendering:pixelated}
#zone{display:none}
#prog{position:absolute;right:6px;top:calc(6px + env(safe-area-inset-top));width:100px;padding:5px 8px 6px;text-align:center;font:600 10.5px var(--f)}
#hud #mm{pointer-events:auto;position:absolute;right:6px;top:calc(58px + env(safe-area-inset-top));border:2px solid #b8923c;border-radius:5px;background:rgba(8,10,16,.55);box-shadow:0 0 0 1px #2a1c08,inset 0 0 0 1px rgba(255,226,150,.25),0 4px 12px rgba(0,0,0,.6);display:none;cursor:pointer}
#hud #mm.big{position:fixed;left:50%;top:50%;right:auto;transform:translate(-50%,-50%);z-index:30;box-shadow:0 0 0 100vmax rgba(4,6,10,.62),0 8px 30px rgba(0,0,0,.7);border-color:var(--ouroC)}
#prog .bar{height:5px;margin-top:4px}#prog .bar b{background:#e8a63a}
#boss{position:absolute;left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);width:62%;padding:4px 8px 6px;border-color:#b0442e;background:rgba(36,12,10,.94);display:none}
#boss .t{font:700 11px var(--ft);letter-spacing:.1em;text-align:center;color:#ffd6a0}
#boss .bar b{background:linear-gradient(#f26a5a,#b02a24)}
#sts{position:absolute;left:6px;top:calc(74px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:3px 3px;width:186px}
#hud #sts .si{pointer-events:auto;position:relative;width:26px;height:35px}
#sts .ib{width:26px;height:26px;box-sizing:border-box;background:rgba(10,8,14,.82);border:1px solid #4f9a5a;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#sts .si.bad .ib{border-color:#d0483c;background:rgba(44,10,10,.84)}
#sts img{width:20px;height:20px;image-rendering:pixelated}
#sts .tm{position:absolute;left:-2px;right:-2px;bottom:0;text-align:center;font:700 9.5px var(--f);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000,0 0 3px #000}
#sts .si.bad .tm{color:#ffd0c8}
#sts .n{position:absolute;right:-3px;top:-4px;background:#000c;border:1px solid #888;color:#fff;font:700 8px var(--f);line-height:1;padding:1px 3px;border-radius:7px}
#sts .si.low .ib{animation:stblink .45s infinite alternate}
@keyframes stblink{from{opacity:1}to{opacity:.35}}
#buffs{position:absolute;left:6px;top:calc(98px + var(--sth,0px) + env(safe-area-inset-top));display:flex;gap:3px}
#buffs div{display:flex;align-items:center;gap:2px;background:var(--gl);border:1px solid var(--lin);padding:1px 4px 1px 2px;font-size:9px}
#buffs img{width:14px;height:14px;image-rendering:pixelated}
#soc{position:absolute;left:6px;top:calc(70px + env(safe-area-inset-top));width:186px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
#sbt{display:flex;gap:5px}#sbt button{position:relative;width:34px;height:34px;pointer-events:auto;background:var(--gl);border:1px solid var(--lin);padding:0;display:flex;align-items:center;justify-content:center}
#sbt img{width:22px;height:22px;image-rendering:pixelated;filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15)}
#bdQ{display:none;position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:#e8402a;border:1px solid #fff}
#qtr{position:absolute;right:6px;top:150px;width:158px;pointer-events:auto;background:linear-gradient(180deg,rgba(28,22,38,.9),rgba(14,11,20,.9));border:1px solid #8a7440;font:600 10px var(--f)}
#qtr,#qtr *{pointer-events:auto}
#qtr .qth{display:flex;align-items:center;gap:6px;height:22px;padding:0 6px;color:var(--ouroC);font:700 10px var(--ft);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid rgba(138,116,64,.4);cursor:pointer}
#qtr.cl .qth{border-bottom:0}#qtr .qth i{margin-left:auto;font-style:normal;font-size:11px;color:#e6dcc2}#qtr .qth u{display:none;width:8px;height:8px;border-radius:50%;background:#e8402a;text-decoration:none}#qtr.rdy .qth u{display:block}
#qtr .qrs{padding:3px 6px 5px}#qtr.cl .qrs{display:none}#qtr .qr{padding:3px 0;line-height:1.25;cursor:pointer;color:#e6dcc2;font-weight:500}#qtr .qr b{display:flex;justify-content:space-between;gap:6px;color:#f3d98e;font-size:10.5px;font-weight:600}#qtr .qr b em{font-style:normal;color:#e6dcc2}#qtr .qr.ok b{color:#9ef09a}#qtr .qr.dn{opacity:.5}#qtr .qr span{display:block;font-size:9.5px;color:#a9a2b8}#qtr .qr i{display:block;height:3px;margin-top:2px;background:#0d0b11}#qtr .qr i s{display:block;height:100%;background:linear-gradient(#f0cf7c,#b98a2f)}#qtr .qr.ok i s{background:#6ed26a}
#pty{display:flex;flex-direction:column;gap:3px}.uqc{display:inline-flex;gap:2px;margin-right:6px;vertical-align:-3px}.skc .t b .ci{margin-right:4px;vertical-align:-3px}
.ci{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;flex:none}.wr .ic.cic{padding:0;border:0;background:none;width:40px;height:40px;display:flex}.wr .ic.cic .ci{width:40px;height:40px}
#hcl{display:inline-flex;align-items:center;gap:4px}
.pm b{display:flex;align-items:center;gap:5px}.pm b span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pm em{margin-left:0!important}
.pm{padding:3px 6px;background:rgba(14,11,20,.7);border:1px solid #4a4458;font:600 10px var(--f)}.pm em{font-style:normal;color:var(--papel2);margin-left:6px}.pm .bar{height:5px;margin-top:2px}
.wr .bar{height:6px;background:#0d0b11;border:1px solid #3a3446}.wr .bar b{display:block;height:100%;background:linear-gradient(#f0cf7c,#b98a2f)}
.clog{height:170px;overflow-y:auto;background:#0d0b11;border:1px solid #3a3446;padding:6px 8px;font:500 11.5px/1.45 var(--f);margin-bottom:6px}
.tokb{display:flex;align-items:center;gap:7px;margin:8px 0 0;padding:6px 10px;background:#0d0b11;border:1px solid #4a4458;font:600 11.5px var(--f);color:var(--papel2)}.tokb img{width:18px;height:18px;image-rendering:pixelated;filter:sepia(1) saturate(5) hue-rotate(150deg) brightness(1.3)}.tokb b{margin-left:auto;color:#9fe8ff;font-size:14px}

/* ===== título cinematográfico de dungeon ===== */
#dgt{position:fixed;inset:0;z-index:70;pointer-events:none;display:none;overflow:hidden;--c1:#fff7d6;--c2:#f6cf63;--c3:#b9721d;--g:255,170,50}
#dgt.on{display:block}
#dgt.cripta{--c1:#f4eaff;--c2:#b79cff;--c3:#4a2a9a;--g:150,110,255}
#dgt .vg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,.05) 0,rgba(0,0,0,.62) 78%);opacity:0;animation:dgVg 4.6s ease-in-out forwards}
#dgt .bar{position:absolute;left:0;right:0;height:14%;background:#000;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#dgt .bar.t{top:0;transform:translateY(-101%)}#dgt .bar.b{bottom:0;transform:translateY(101%)}
#dgt.on .bar{transform:none}#dgt.out .bar.t{transform:translateY(-101%)}#dgt.out .bar.b{transform:translateY(101%)}
#dgt .c{position:absolute;left:0;right:0;top:40%;text-align:center;padding:0 5%}
#dgt .tag{font:700 clamp(10px,2.6vw,14px) var(--ft);letter-spacing:.55em;text-transform:uppercase;color:rgb(var(--g));text-shadow:0 0 12px rgba(var(--g),.9),0 2px 0 #000;opacity:0;animation:dgFade .6s .15s both;margin-bottom:10px}
#dgt .n{font:900 min(10.2vw,60px)/1.04 var(--fd);text-transform:uppercase;letter-spacing:.04em}
#dgt .w{display:inline-block;white-space:nowrap;margin:0 .14em}
#dgt .n i{font-style:normal;display:inline-block;opacity:0;color:transparent;-webkit-text-fill-color:transparent;
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 44%,var(--c3) 54%,var(--c2) 100%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:1.5px rgba(10,4,2,.9);paint-order:stroke fill;
  filter:drop-shadow(0 3px 0 #120804) drop-shadow(0 0 16px rgba(var(--g),.75));
  animation:dgL .62s cubic-bezier(.2,1.7,.35,1) both}
#dgt .ln{height:3px;width:0;margin:12px auto 10px;background:linear-gradient(90deg,transparent,rgb(var(--g)),#fff,rgb(var(--g)),transparent);box-shadow:0 0 14px rgba(var(--g),.95);animation:dgLn .9s .95s cubic-bezier(.2,.8,.2,1) forwards}
#dgt .sub{font:700 clamp(11px,3vw,15px) var(--ft);letter-spacing:.42em;text-transform:uppercase;color:#f5ebcf;text-shadow:0 2px 0 #000,0 0 12px #000;opacity:0;animation:dgFade .7s 1.25s both}
#dgt .fl{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,rgba(var(--g),.65),transparent 55%);opacity:0;mix-blend-mode:screen}
#dgt.on .fl{animation:dgFl .9s .12s ease-out}
#dgt.out .c{animation:dgOut .7s ease-in forwards}
@keyframes dgL{0%{opacity:0;transform:translateY(-46px) scale(2.8) rotate(-7deg);filter:blur(10px)}55%{opacity:1;transform:translateY(5px) scale(.94) rotate(1deg);filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes dgFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dgLn{from{width:0}to{width:min(78%,520px)}}
@keyframes dgFl{0%{opacity:.95}100%{opacity:0}}
@keyframes dgVg{0%{opacity:0}18%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes dgOut{to{opacity:0;transform:scale(1.08)}}

@keyframes bnu{0%,10%{width:0}40%{width:78%}100%{width:90%}}

.uq{margin:0 0 6px;padding:4px 7px;border:1px solid rgba(255,166,58,.55);background:rgba(255,166,58,.1);color:#ffb860;font-size:10.5px;line-height:1.3}

.cv{display:flex;justify-content:space-between;align-items:center;padding:4px 7px;margin:0 0 6px;font-size:10.5px;letter-spacing:.05em;border:1px solid;background:rgba(0,0,0,.35)}.cv b{font-size:13px}.cv.up{color:#7de06d;border-color:rgba(125,224,109,.5)}.cv.dn{color:#ff7a6a;border-color:rgba(255,122,106,.5)}.cv.eq{color:#d9b45f;border-color:rgba(217,180,95,.5)}
.ce{display:grid;grid-template-columns:22px 1fr;gap:1px 6px;align-items:center;margin-top:6px;padding:4px 5px;background:rgba(255,255,255,.04);font-size:10.5px}.ce img{width:22px;height:22px;grid-row:span 2;image-rendering:pixelated}.ce em{font-style:normal;color:#8e8a98;font-size:9.5px}
#tip .th span,#wtip .th span{display:block}#tip .th span.st,#wtip .th span.st{font-size:11px;letter-spacing:.04em}#tip .th span.st b,#wtip .th span.st b{display:inline;font:700 11px var(--ft);margin-left:3px}
i.ts{position:absolute;left:2px;top:1px;font-size:7px;font-style:normal;line-height:1}i.ts .stars{letter-spacing:-.5px}
/* estrelas: a cor e o brilho crescem com o tier; no 12º queimam */
.stars{display:inline-block;position:relative;font-style:normal;letter-spacing:1px}
.tr1{color:#b8b2a4}.tr2{color:#c9905a}.tr3{color:#dfe5ee}.tr4{color:#6fd6e8}.tr5{color:#6cd86c}
.tr6{color:#5aa8ff;text-shadow:0 0 4px #5aa8ffaa}.tr7{color:#b878ff;text-shadow:0 0 5px #b878ffcc}.tr8{color:#ff6ad0;text-shadow:0 0 6px #ff6ad0cc}
.tr9,.tr10,.tr11{background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shim 2.2s linear infinite;filter:drop-shadow(0 0 3px rgba(255,200,60,.8))}
.tr9{background-image:linear-gradient(100deg,#ffc83a 20%,#fff6c0 40%,#ffc83a 60%)}
.tr10{background-image:linear-gradient(100deg,#ff8a2a 20%,#ffe28a 40%,#ff8a2a 60%);filter:drop-shadow(0 0 4px rgba(255,138,42,.95))}
.tr11{background-image:linear-gradient(100deg,#ff4a3a 20%,#ffd0a0 40%,#ff4a3a 60%);filter:drop-shadow(0 0 5px rgba(255,74,58,1));animation-duration:1.5s}
.tr12{background-image:linear-gradient(0deg,#ff2a0a 0%,#ff7a1a 40%,#ffd23a 75%,#fff6c0 100%);background-size:100% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flame .55s ease-in-out infinite alternate,fglow 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 -2px 3px rgba(255,120,20,.95))}
.tr12::before,.tr12::after{content:'';position:absolute;bottom:55%;width:3px;height:3px;border-radius:50%;background:#ffb040;box-shadow:0 0 4px #ff6a1a;animation:ember 1.3s linear infinite;opacity:0;-webkit-text-fill-color:initial}
.tr12::before{left:18%}.tr12::after{left:62%;animation-delay:.65s;background:#ffd23a}
@keyframes shim{to{background-position:-220% 0}}
@keyframes flame{from{background-position:0 0}to{background-position:0 100%}}
@keyframes fglow{from{filter:drop-shadow(0 -1px 2px rgba(255,90,20,.8))}to{filter:drop-shadow(0 -4px 6px rgba(255,170,40,1))}}
@keyframes ember{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:1}100%{transform:translateY(-12px) scale(.2);opacity:0}}
.tc10{box-shadow:0 0 8px rgba(255,138,42,.5)}.tc12{animation:cfire 1s ease-in-out infinite alternate}
@keyframes cfire{from{box-shadow:0 0 6px rgba(255,90,20,.6),inset 0 0 6px rgba(255,90,20,.25)}to{box-shadow:0 0 14px rgba(255,170,40,.95),inset 0 0 10px rgba(255,150,30,.45)}}small.st2{display:block;font-size:9px;opacity:.85}
i.upg{position:absolute;right:1px;top:0;font-size:9px;color:#7de06d;font-style:normal;text-shadow:0 1px 2px #000;line-height:1}i.upg.dn{color:#ff6a5a}i.upg.lk{font-size:8px;color:#ff6a5a;right:2px;top:1px}
.pcl{position:absolute;left:0;right:0;bottom:0;text-align:right;padding:2px 3px 0;font:700 10px var(--f);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.82) 60%);text-shadow:0 1px 0 #000;white-space:nowrap}
.pcl em{font-style:normal;font-size:7px;letter-spacing:.05em;color:#cdbf8f;margin-right:2px;vertical-align:1px}.pcl .pa{font-style:normal;font-size:8px;margin-left:1px}.pcl .pa.up{color:#7de06d}.pcl .pa.dn{color:#ff6a5a}
i.ul{position:absolute;right:2px;top:1px;font:700 9px var(--f);font-style:normal;color:#ffd24a;text-shadow:0 1px 0 #000,0 0 3px #000}
.nolv img{opacity:.5;filter:saturate(.5)}
#tip .th,#wtip .th{display:flex;gap:8px;align-items:center;margin-bottom:6px}
#tip .ti,#wtip .ti{width:38px;height:38px;border:1px solid;background:#0d0b11;flex:none;padding:3px}#tip .ti img,#wtip .ti img{width:100%;height:100%;image-rendering:pixelated}
#tip .th b,#wtip .th b{display:block;font:700 13px var(--ft);line-height:1.15}#tip .th span,#wtip .th span{font-size:10.5px;color:var(--papel2)}
#tip .row,#wtip .row{display:flex;justify-content:space-between;padding:1px 0;color:#9be08f}#tip .row span:first-child,#wtip .row span:first-child{color:var(--papel)}

#tip::after,#wtip::after{content:'';position:absolute;left:var(--ax,50%);width:10px;height:10px;background:inherit;border:inherit;border-width:0 1px 1px 0;transform:translateX(-50%) rotate(45deg);bottom:-6px}
#tip.bl::after,#wtip.bl::after{bottom:auto;top:-6px;border-width:1px 0 0 1px}

/* ===== janelas de NPC (estilo vendedor de MMO) ===== */
.nh{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(90deg,rgba(217,180,95,.12),rgba(217,180,95,0));border:1px solid var(--lin)}

.nh b{display:block;font:700 14px var(--ft);letter-spacing:.06em;color:var(--ouroC)}.nh span{font-size:11.5px;color:var(--papel2);font-style:italic}
.nh .gd{margin-left:auto;display:flex;align-items:center;gap:5px;font:700 13px var(--f);color:var(--ouroC);background:#0d0b11;border:1px solid var(--lin);padding:5px 9px}

.vg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vi{display:flex;align-items:center;gap:8px;padding:6px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);cursor:pointer;min-height:54px}

.vi .ic2{width:38px;height:38px;flex:none;background:#0d0b11;border:1px solid;padding:3px;position:relative}.vi .ic2 img{width:100%;height:100%;image-rendering:pixelated}
.vi .tx2{min-width:0;flex:1}.vi .tx2 b{display:block;font-size:11.5px;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vi .pr2{display:flex;align-items:center;gap:3px;font:700 11.5px var(--f);color:var(--ouroC);margin-top:2px}.vi .pr2.bad{color:#ff8a7a}.vi .pr2 img{width:12px;height:12px;image-rendering:pixelated;filter:sepia(1) saturate(7) hue-rotate(-8deg) brightness(1.25)}
.vfoot{display:flex;gap:8px}.vfoot button{flex:1}
.fcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;background:radial-gradient(ellipse at 50% 35%,rgba(217,180,95,.12),rgba(0,0,0,0) 70%),rgba(255,255,255,.02);border:1px solid var(--lin)}
.fcard .fi{width:84px;height:84px;border:2px solid;background:#0d0b11;padding:8px;position:relative;box-shadow:0 0 18px rgba(0,0,0,.6)}.fcard .fi img{width:100%;height:100%;image-rendering:pixelated}
.fcard b{font:700 15px var(--ft);letter-spacing:.04em}.fcard span{font-size:11px;color:var(--papel2)}
.seg{display:flex;gap:3px}.seg i{flex:1;height:8px;background:#26222e;border:1px solid #3a3446}.seg i.on{background:linear-gradient(#8ee07e,#4aa33e);border-color:#6cc35e}.seg i.mid{background:linear-gradient(#ffd070,#c98a2a);border-color:#e0b050}
.dg{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09)}
.dg.sel{border-color:var(--ouroC);background:rgba(217,180,95,.1)}.dg.lock{opacity:.5}
.dg .ic{width:42px;height:42px;background:#0d0b11;border:1px solid var(--lin);padding:5px;image-rendering:pixelated}
.dg b{display:block;font:700 13px var(--ft);letter-spacing:.04em}.dg span{font-size:11px;color:var(--papel2)}
.dd{padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid var(--lin);font-size:12px;line-height:1.55}.dd .zs{display:flex;align-items:center;gap:8px;margin:8px 0}.dd .zs b{flex:1;text-align:center;font:700 15px var(--ft);color:var(--ouroC)}
.dd .row2{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:2px 0}.dd .row2 span:first-child{color:var(--papel2)}

/* ===== subclasses ===== */
#csub{padding:10px 12px}#csub .hd2{display:flex;justify-content:space-between;font:700 10px var(--ft);letter-spacing:.16em;text-transform:uppercase;color:var(--papel2);margin-bottom:8px}

#csk img{cursor:pointer}

#cdemo.on{display:block}#cdemo .dh{display:flex;justify-content:space-between;align-items:center}
#cdemo .bd{font:700 9px var(--ft);letter-spacing:.2em;color:#1a1208;background:var(--ouroC);padding:2px 6px}
#cdemo b{display:block;font:700 15px var(--ft);color:var(--ouroC);margin-top:4px}#cdemo .dd2{font-size:11.5px;color:var(--papel)}

.sbc b{font:700 15px var(--ft);color:var(--ouroC);letter-spacing:.05em;display:block}.sbc .sbh span{font-size:11px;color:#8fd88a;text-transform:uppercase;letter-spacing:.1em}
.sbc p{margin:0;font-size:12px;line-height:1.4;color:var(--papel)}
.sbs{display:flex;gap:8px}.sbk{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-align:center}.sbk.sel img{border-color:var(--ouroC)}.sbk em{font:600 10px var(--f);font-style:normal;color:var(--papel2);line-height:1.15}
.skc.sub{border-color:rgba(217,180,95,.35)}

/* ===== barra de ação estilo MMO ===== */
#bar{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;background:none!important;border:0!important;box-shadow:none!important;padding:0;height:auto}
#bar>*{pointer-events:auto}
.abar{display:flex;gap:6px;padding:7px;position:relative;background:var(--gl);border:1px solid var(--lin);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 6px 20px rgba(0,0,0,.55)}
.abar::before,.abar::after{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--ouroE);pointer-events:none}
.abar::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.abar::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.slot2{position:relative;width:58px;height:58px;border:1px solid var(--lin);background:#0d0b11;padding:3px;flex:none}
.slot2>img{width:100%;height:100%;image-rendering:pixelated;display:block}
.slot2.sep{margin-left:6px}.slot2.sep::before{content:'';position:absolute;left:-7px;top:6px;bottom:6px;width:1px;background:var(--lin)}
.slot2.lock>img{filter:grayscale(1) brightness(.4)}.slot2.empty>img{opacity:.22}
.slot2.ready{border-color:var(--ouroC);box-shadow:0 0 10px rgba(243,217,142,.55),inset 0 0 8px rgba(243,217,142,.25)}
.slot2 .key{position:absolute;left:3px;top:1px;font:700 9.5px var(--f);color:#d8c8a0;text-shadow:0 1px 0 #000,0 0 3px #000;z-index:2}
.slot2 .suf{position:absolute;inset:0;background:radial-gradient(circle,#fff6d0 0,rgba(255,214,120,.65) 55%,transparent 100%);pointer-events:none;z-index:4;mix-blend-mode:screen}
.slot2 .sur{position:absolute;inset:-2px;border:2px solid #ffe08a;box-shadow:0 0 12px #ffcf6a;pointer-events:none;z-index:4}
.slot2.pop{animation:none}
.slot2 .cd{position:absolute;inset:3px;background:conic-gradient(rgba(0,0,0,.72) var(--p,0deg),transparent 0)}
.slot2 .ct{position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--f);color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.slot2 .n{position:absolute;right:4px;bottom:2px;font:700 11.5px var(--f);color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000;z-index:2}
.slot2 .lv{position:absolute;inset:0;display:grid;place-items:center;font:700 10px var(--ft);letter-spacing:.06em;color:#d8c8a0;text-shadow:0 1px 0 #000}
.slot2 .lbl{background:rgba(0,0,0,.45);position:absolute;left:0;right:0;bottom:2px;text-align:center;font:600 8.5px var(--f);color:#e9e2d0;text-shadow:0 1px 2px #000,0 0 3px #000;letter-spacing:.04em;text-transform:uppercase}
.slot2 .bd{position:absolute;right:-5px;top:-6px;background:#d6403a;color:#fff;font:700 10px var(--f);border-radius:9px;min-width:17px;padding:0 4px;display:none;text-align:center;z-index:3}
#mmenu{position:absolute;right:6px;bottom:calc(88px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;pointer-events:none}
.mbtn{position:relative;width:46px;height:46px;pointer-events:auto;background:var(--gl);border:1px solid var(--lin);box-shadow:0 4px 12px rgba(0,0,0,.5);font:700 10px var(--ft);letter-spacing:.06em;color:var(--ouroC);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.mbtn img{width:34px;height:34px;image-rendering:pixelated}
.mbtn img.ui{width:26px;height:26px;margin-top:3px;filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15)}
#mmenu.col .grp{display:none}.mbtn.mtgl{height:22px;font-size:14px;align-self:flex-end;width:30px}
.mbtn small{display:block;font:700 8px var(--f);color:var(--papel2);letter-spacing:.03em;line-height:1;text-transform:uppercase}
#bAuto.on{border-color:#96e08a;background:linear-gradient(#26502e,#183a20);color:#c8ffd0;box-shadow:0 0 10px rgba(120,230,140,.35)}
.mbtn .bd{position:absolute;right:-5px;top:-6px;background:#d6403a;color:#fff;font:700 10px var(--f);border-radius:9px;min-width:17px;padding:0 4px;display:none;text-align:center}

/* talentos */
.tlb{display:flex;gap:6px}.tlb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border:1px solid var(--lin);background:linear-gradient(#26202d,#15111b);color:var(--papel2);font:700 10px var(--f);letter-spacing:.04em}
.tlb button img{width:22px;height:22px;image-rendering:pixelated;opacity:.75}.tlb button em{font:600 9px var(--f);font-style:normal;opacity:.8}
.tlb button.on{border-color:var(--bc);color:#fff;background:linear-gradient(#352c3f,#1d1726);box-shadow:inset 0 -2px 0 var(--bc)}.tlb button.on img{opacity:1}
.tlsub{font:600 11px var(--f);letter-spacing:.06em;text-align:center;padding:2px 0 0}

.tli{width:40px;height:40px;flex:none;display:grid;place-items:center;background:#0d0a12}.tli img{width:40px;height:40px;image-rendering:pixelated;display:block}
.tlx{flex:1;min-width:0}.tlx b{display:block;font:700 12px var(--f);color:var(--papel)}.tlx span{display:block;font:500 10.5px/1.25 var(--f);color:var(--papel2);margin-top:1px}

.tla{width:34px;height:34px;flex:none;border:1px solid var(--ouroC);background:linear-gradient(#f0cf7c,#b98a2f);color:#2a1a06;font:700 18px var(--f)}.tla:disabled{opacity:.3;filter:grayscale(.6)}

.mats{display:flex;gap:6px}.mats div{flex:1;display:flex;align-items:center;gap:6px;padding:5px 7px;border:1px solid var(--lin);background:linear-gradient(#26202d,#15111b);position:relative}

 background:linear-gradient(105deg,transparent 40%,#fff 50%,transparent 60%) -100% 0/260% 100% no-repeat,linear-gradient(180deg,#fffbe0 0%,#ffe27a 38%,#f0a21c 56%,#ffd35a 100%);-webkit-background-clip:text;background-clip:text;
 filter:drop-shadow(0 3px 0 #3a1a04) drop-shadow(0 0 22px rgba(255,170,40,.85));animation:lvp .7s cubic-bezier(.2,1.6,.4,1) both,bns 1.4s .6s ease-out both}

@keyframes lvo{0%,82%{opacity:1}100%{opacity:0}}

@keyframes lvs{0%{opacity:0;transform:translate(0,0) rotate(45deg)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 50px)) rotate(225deg)}}
/* seções do diário: cada tipo com sua fonte e cor */

/* ===== UI v2 (parte 3): Personagem, talentos e árvore de habilidades ===== */
.tt>span,#wtt{font-family:var(--fd);font-weight:700;letter-spacing:.14em;background:linear-gradient(#fff3bd,#e6a92c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 #000)}

.s-hp{--sc:#ff6a6a}.s-atk{--sc:#ff9a4a}.s-def{--sc:#6fb7ff}.s-crit{--sc:#ffd84a}.s-kb{--sc:#c59aff}.s-spd{--sc:#6fe0b0}
.atr{border-left:3px solid #4a4458;background:linear-gradient(180deg,#201a28,#14101a);padding:10px 12px}

.atr .av{font:700 24px var(--fd);color:#ffe08a;min-width:46px;text-shadow:0 0 10px rgba(255,190,70,.4)}
.pl,.tla{width:42px;height:42px;font:700 22px var(--f);border:1px solid #ffe08a;background:linear-gradient(#ffe38a,#c88a1f);color:#2a1a06;box-shadow:0 0 10px rgba(255,190,70,.35)}.pl:disabled,.tla:disabled{opacity:.28;box-shadow:none;filter:grayscale(.7)}
.tlb button{padding:8px 2px}.tlb button b{font-family:var(--fd);font-size:11px;letter-spacing:.08em}
.tlsub{font:italic 600 12px var(--f);padding:6px 0 2px}
.det{position:sticky;top:-14px;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 12px;margin:8px 0 4px;border:1px solid var(--bc,#f0c24f);background:radial-gradient(120% 140% at 0 0,rgba(255,255,255,.07),transparent 60%),#17121e;box-shadow:0 8px 16px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.5)}
.det .tli{width:52px;height:52px;flex:none;border:2px solid var(--bc);border-radius:50%;overflow:hidden;background:#0d0a12;display:grid;place-items:center}.det .tli img{width:44px;height:44px;image-rendering:pixelated}
.det .dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.det .dt b,.det .sh b{font:700 15px var(--fd);letter-spacing:.04em;color:#ffe9a8}.det .dt b u{text-decoration:none;font:700 9px var(--ft);letter-spacing:.14em;color:#1a1208;background:var(--bc);padding:2px 6px;margin-left:6px;text-transform:uppercase;vertical-align:2px}
.det .dt>span{font-size:12px;line-height:1.4;color:#cfc7b0}.det .warn{color:#ff9a8a!important;font-size:11px!important}
.det .sh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.det .sh em{font-style:normal;font-size:11px;color:#f0c24f;white-space:nowrap;font-weight:600}
.det .chs{display:flex;flex-wrap:wrap;gap:4px}.det .chs span{font:600 10.5px var(--f);padding:2px 7px;background:#0d0b11;border:1px solid rgba(217,180,95,.3);color:#e9dcb4}
.det .sbt{display:flex;flex-direction:column;gap:6px}.det .eqb{height:34px;min-width:84px;font-size:11px}
.tree,.det,.avl,.qs,.tlb,.eqs,.stg{flex:none}.tree{position:relative;margin:6px 0 10px;background:radial-gradient(ellipse at 50% 0,rgba(240,194,79,.06),transparent 70%)}
.tree svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.tree line{stroke:#2e2938;stroke-width:4;vector-effect:non-scaling-stroke;stroke-linecap:round}.tree line.on{stroke-width:4;filter:drop-shadow(0 0 4px currentColor)}
.tgl{position:absolute;left:0;right:0;text-align:center;font:600 9.5px var(--ft);letter-spacing:.18em;text-transform:uppercase;color:#6c667a;pointer-events:none}
.nd{position:absolute;width:92px;margin-left:-46px;padding:0;border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nd .ci{position:relative;width:60px;height:60px;border-radius:50%;border:3px solid #3a3446;background:radial-gradient(circle,#26202d,#0d0a12);display:grid;place-items:center;transition:transform .12s}
.nd .ci img{width:100%;height:100%;border-radius:50%;object-fit:cover;transform:scale(1.18);image-rendering:pixelated}
.nd.key .ci{width:70px;height:70px;border-radius:14px;transform:rotate(45deg)}.nd.key .ci i,.nd.key .ci u{transform:rotate(-45deg)}.nd.key .ci img{transform:rotate(-45deg) scale(1.1)}

.nd.can .ci{border-color:var(--bc);animation:ndp 1.6s ease-in-out infinite}
.nd.has .ci{border-color:var(--bc);box-shadow:0 0 12px var(--bc)}.nd.max .ci{border-color:#ffe08a;box-shadow:0 0 16px #ffcf6a,inset 0 0 10px rgba(255,214,110,.4);background:radial-gradient(circle,#4a3a1c,#14100a)}
.nd.sel .ci{transform:scale(1.14)}.nd.key.sel .ci{transform:rotate(45deg) scale(1.14)}.nd.sel .nl{color:#fff}

.nd .rk{position:absolute;right:-6px;bottom:-4px;font:700 10px var(--f);font-style:normal;padding:1px 5px;border-radius:8px;background:#0d0a12;border:1px solid #4a4458;color:#e6dcc2}.nd.has .rk,.nd.max .rk{border-color:var(--bc);color:#ffe08a}

.nd s{position:absolute;inset:0;margin:auto;width:16px;height:16px;background:#0d0a12 url(../assets/ui-icons/padlock.png) center/12px no-repeat;border-radius:50%;image-rendering:pixelated}
.nd .nl{font:600 10.5px/1.15 var(--f);font-style:normal;color:#bdb59e;text-align:center;max-width:92px}
.nd.lock .nl{color:#6c667a}
.qs.sb b{color:#d2b4ff;background:none;-webkit-text-fill-color:#d2b4ff}.qs.sb{--qa:#b58cff;border-image:linear-gradient(90deg,#b58cff,transparent) 1}

#qtr .qr.mn{border-left:2px solid #f0c24f;padding-left:6px;margin-left:-2px}

.abar{padding:8px;border-color:#b8923c;background:linear-gradient(180deg,rgba(38,30,50,.96),rgba(14,11,20,.96))}
.slot2{border:2px solid #6a5424;background:radial-gradient(circle at 50% 35%,#2a2336,#0d0b11);box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),inset 0 0 10px rgba(0,0,0,.6)}

/* títulos épicos: nome da área (zone) e chefe (boss, estilo Dark Souls: só o nome) */
#banner.zone{top:calc(30% + env(safe-area-inset-top));--c1:#fff3cf;--c2:#e9c46a;--c3:#8a5a1c;--g:240,190,90}
#banner.zone::before{content:'';position:absolute;left:0;right:0;top:50%;height:150px;transform:translateY(-50%);background:linear-gradient(180deg,transparent,rgba(0,0,0,.55) 30%,rgba(0,0,0,.55) 70%,transparent);z-index:-1}
#banner.zone b{font-size:min(46px,10.8vw);letter-spacing:.16em}
#banner.zone u{height:1px;margin:2px auto 10px}
#banner.zone span{font:600 12px var(--ft);letter-spacing:.5em;color:#e8d9ae}
#banner.zone.show{animation:bzr 4.6s ease-in-out forwards}
#banner.zone.show b{animation:bzb 4.6s cubic-bezier(.2,.7,.2,1) forwards}
#banner.zone.show u{animation:bzu 4.6s ease-out forwards}
@keyframes bzr{0%{opacity:0}14%{opacity:1}78%{opacity:1}100%{opacity:0}}
@keyframes bzb{0%{letter-spacing:.5em;transform:scale(1.18);opacity:0}28%{letter-spacing:.17em;transform:scale(1);opacity:1}100%{letter-spacing:.2em;transform:scale(1.04)}}
@keyframes bzu{0%,12%{width:0}45%{width:86%}100%{width:96%}}
#banner.boss{top:calc(36% + env(safe-area-inset-top));--c1:#ffe9e2;--c2:#d9d2cc;--c3:#6b1a14;--g:200,30,20}
#banner.boss::before{content:'';position:absolute;left:0;right:0;top:50%;height:130px;transform:translateY(-50%);background:linear-gradient(180deg,transparent,rgba(20,0,0,.72) 35%,rgba(20,0,0,.72) 65%,transparent);z-index:-1}
#banner.boss b{font-size:min(44px,11vw);letter-spacing:.28em;background:linear-gradient(180deg,#fff0e8 0%,#e8c8bc 48%,#a2362a 54%,#c2503a 100%);-webkit-background-clip:text;background-clip:text}
#banner.boss u,#banner.boss span{display:none}
#banner.boss.show{animation:bbr 4.2s ease-in-out forwards}
#banner.boss.show b{animation:bbb 4.2s cubic-bezier(.15,.8,.2,1) forwards}
@keyframes bbr{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes bbb{0%{letter-spacing:.1em;transform:scale(.9);opacity:0}30%{opacity:1}100%{letter-spacing:.36em;transform:scale(1.08)}}
#boss{animation:bossin .6s ease-out}

#bsts{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:4px;pointer-events:auto}
#bsts .si{position:relative;width:22px;height:30px}
#bsts .ib{width:22px;height:22px;box-sizing:border-box;background:rgba(10,8,14,.82);border:1px solid #4f9a5a;display:grid;place-items:center}
#bsts .si.bad .ib{border-color:#d0483c;background:rgba(44,10,10,.84)}
#bsts img{width:17px;height:17px;image-rendering:pixelated}
#bsts .tm{position:absolute;left:-2px;right:-2px;bottom:0;text-align:center;font:700 8.5px var(--f);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
#bsts .n{position:absolute;right:-3px;top:-4px;background:#000c;border:1px solid #888;color:#fff;font:700 8px var(--f);line-height:1;padding:1px 3px;border-radius:7px}
#alertv{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(140,0,10,.35) 70%,rgba(170,0,12,.7) 100%);transition:opacity .5s}
#alertv.on{opacity:1;animation:alv .8s ease-in-out infinite alternate}

/* HUD compacto e alinhado: margem de 8 px; herói à esquerda, minimapa à direita (nome da área centralizado em cima, progresso embaixo, mesma largura); chefe centralizado na tela abaixo dessa faixa */
#hero{left:8px!important;top:calc(8px + env(safe-area-inset-top))!important;transform:scale(.8);transform-origin:0 0}
#sts{left:8px!important;top:calc(62px + env(safe-area-inset-top))!important;width:84px!important;gap:3px!important}

#hud #mm{right:8px!important;top:calc(26px + env(safe-area-inset-top))!important}
#zname{position:absolute;right:8px;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));text-align:center;font:700 9.5px/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;color:#f3d98e;text-shadow:0 1px 0 #000,0 0 6px #000;white-space:nowrap;display:none;padding-left:.08em}

#prog{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;right:8px!important}

#prog #progt{display:none}

#boss{position:absolute!important;left:50%!important;transform:translateX(-50%);width:calc(100% - 20px)!important;top:calc(6px + env(safe-area-inset-top))!important}
#boss .t{font-size:16px;letter-spacing:.32em;padding-left:.32em;margin-bottom:3px}
#boss .bar{height:17px;border:2px solid #0a0606;background:linear-gradient(#1a0a0a,#2a1010);box-shadow:0 0 0 1px #b8923c,0 0 0 3px #3a2a10,0 4px 14px rgba(0,0,0,.8),inset 0 2px 4px #000}
#boss .bar b{background:linear-gradient(#ff9a7a,#e0301e 45%,#8a0e0e);box-shadow:0 0 14px rgba(255,60,40,.75)}
#bsts{margin-top:6px}
/* na luta de chefe, painel do herói, status e minimapa descem para dar o topo à barra do chefe */

body.bossbar #hero{top:calc(92px + env(safe-area-inset-top))!important}
body.bossbar #sts{top:calc(146px + env(safe-area-inset-top))!important}

/* dificuldade: o nível do monstro sobe com a profundidade na floresta (0 na entrada → 1 no fim da estrada) e +5 por zona */
/* curva de dificuldade ajustada por modelo (tools/mmo/balance_fit.py): fácil no início (≈5 s por monstro, ≈7 % da vida por abate) e cada vez mais dura até o endgame (≈13 s e ≈37 %); defesa estilo PoE: def/(def+5·dano), teto 85 % */
const BAL={zoneLv:5,K:{"1":[1.253,0.453],"5":[4.021,1.316],"10":[7.72,5.947],"20":[16.574,12.011],"30":[42.982,20.693],"40":[132.41,59.734],"50":[197.794,100.885],"60":[279.165,206.051]}};   // multiplicadores [vida, ataque] por nível, calibrados com heróis de equipamento mediano (início) até quase perfeito (endgame)
function balMul(lv,j){const ks=Object.keys(BAL.K).map(Number).sort((a,b)=>a-b);if(lv<=ks[0])return BAL.K[ks[0]][j];if(lv>=ks[ks.length-1]){const e=ks[ks.length-1],q=ks[ks.length-2];return BAL.K[e][j]*Math.pow(BAL.K[e][j]/BAL.K[q][j],(lv-e)/(e-q));}for(let i=0;i<ks.length-1;i++)if(lv<=ks[i+1]){const f=(lv-ks[i])/(ks[i+1]-ks[i]);return Math.exp(Math.log(BAL.K[ks[i]][j])*(1-f)+Math.log(BAL.K[ks[i+1]][j])*f);}}
const mobHpMul=lv=>balMul(lv,0),mobAtkMul=lv=>balMul(lv,1);

function makeElite(m,tier){

  m.el=got;m.elite=true;m.tier=tier;m.maxhp=Math.round(m.maxhp*(gold?3.2:1.9));m.pow*=gold?1.25:1.05;m.spdMul=1;m.aspdMul=1;m.take=1;m.imm={};
  for(const k of got){
    if(k==='veloz'){m.spdMul*=1.35;m.aspdMul*=.6;}else if(k==='brutal')m.pow*=1.5;else if(k==='blindado'){m.take*=.65;m.maxhp=Math.round(m.maxhp*1.2);}

function genItem(ilvl,minR=0,boost=0,U,ST){
  const tier=tierOf(ilvl),slot=U?U.slot:ST?pick(SETSLOTS):pick(SLOTS),rar=U?4:ST?3:Math.max(minR,rollRarT(tier,boost)),R=RAR[rar],cls=SAVE.cls;
  const pool=basePool(slot),[bn0,ic]=U?[U.nm,U.ic]:pick(pool),bn=ST?ST.pcs[slot]:bn0,shieldCls=SDEF.includes(bn0);
  const um=U?1.95*U.mul:0,m=(U?um:R.m)*rnd(.92,1.08)*tierMul(tier)*GS*(ST?1.08:1),L=ilvl,s={};   /* único: mul = múltiplo da força de um Épico (1.95) */
  if(slot==='arma')s.atk=(2.2+L*1.1)*m;
  else if(slot==='elmo'){s.def=(1+L*.35)*m;s.hp=(4+L*3)*m;}
  else if(slot==='armadura'){s.def=(1.6+L*.6)*m;s.hp=(8+L*5)*m;}
  else if(slot==='botas'){s.def=(.8+L*.25)*m;s.spd=(2+L*.15)*m;}
  else if(slot==='amuleto'){s.hp=(6+L*4)*m;s.crit=1.5*m;}
  else if(slot==='luvas'){s.atk=(.8+L*.4)*m;s.def=(.5+L*.18)*m;}
  else if(slot==='anel'){s.hp=(4+L*2.8)*m;s.crit=1.2*m;s.atk=(.5+L*.15)*m;}
  else if(slot==='escudo'){if(shieldCls){s.def=(.9+L*.34)*m;s.hp=(5+L*2.8)*m;}else{s.atk=(.8+L*.42)*m;s.crit=1.1*m;}}
  const aff=[['atk',L*.35],['def',L*.18],['hp',L*2.5],['crit',1.2],['spd',1.6]];
  if(['arma','luvas','armadura','escudo','anel'].includes(slot))aff.push(['kb',1.8],['kb',1.8],['kd',3.5]);
  for(let i=0;i<R.aff;i++){const [k,v]=pick(aff);s[k]=(s[k]||0)+v*(U?um*.75:R.m)*tierMul(tier)*rnd(.8,1.2);}   /* único: 4 afixos valem 3 afixos de Épico × mul */
  for(const k in s)s[k]=k==='crit'||k==='spd'||k==='kb'||k==='kd'?Math.round(s[k]*10)/10:Math.round(s[k]);
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),slot,rar,tier,tv:2,ilvl:L,bn,name:U?U.nm:ST?bn:bn+' '+tierAdj(bn,tier),icon:ic,set:ST?ST.id:undefined,wl:slot==='arma'?(U&&U.wl)||WLK[bn0]||cls:undefined,sd:slot==='escudo'?shieldCls:undefined,s,u:U?{id:U.id,fx:U.fx,desc:U.desc}:undefined};
}

function collide(e,r=6){
  for(const s of ZONE.solids){const dx=e.x-s.x,dy=e.y-s.y;if(Math.abs(dx)>26||Math.abs(dy)>26)continue;const d=Math.hypot(dx,dy),R=s.r+r;if(d<R&&d>0.01){e.x=s.x+dx/d*R;e.y=s.y+dy/d*R;}}
  e.x=clamp(e.x,14,ZONE.w-14);e.y=clamp(e.y,ZONE.ymin||50,ZONE.h-(ZONE.room?4:10));
  if(isWater(e.x,e.y)||isWater(e.x,e.y+4)){
    if(e._lx!==undefined){const lx=e._lx,ly=e._ly;
      if(!isWater(e.x,ly)&&!isWater(e.x,ly+4))e.y=ly;else if(!isWater(lx,e.y)&&!isWater(lx,e.y+4))e.x=lx;else{e.x=lx;e.y=ly;}}
    if(isWater(e.x,e.y)||isWater(e.x,e.y+4)){const f=freeSpot(e.x,e.y);e.x=f[0];e.y=f[1];}   /* nasceu dentro d'água: tira de lá */
  }

  if(m.kvx||m.kvy){m.x+=m.kvx*dt;m.y+=m.kvy*dt;const f=Math.exp(-11*dt);m.kvx*=f;m.kvy*=f;if(Math.abs(m.kvx)+Math.abs(m.kvy)<4)m.kvx=m.kvy=0;collide(m);m.wx=m.x;m.wy=m.y;}

(function(){

  const mv=ev=>{const r=J.getBoundingClientRect();setV(ev.clientX-(r.left+r.width/2),ev.clientY-(r.top+r.height/2));};
  J.addEventListener('pointerdown',ev=>{id=ev.pointerId;J.setPointerCapture(id);J.classList.add('act');G.wp=null;mv(ev);ev.preventDefault();});
  J.addEventListener('pointermove',ev=>{if(ev.pointerId===id)mv(ev);});

  J.addEventListener('pointerup',up);J.addEventListener('pointercancel',up);
  // teclado (WASD / setas)
  const KS={};const kv=()=>{const dx=(KS.d||KS.arrowright?1:0)-(KS.a||KS.arrowleft?1:0),dy=(KS.s||KS.arrowdown?1:0)-(KS.w||KS.arrowup?1:0);if(id!==null)return;if(!dx&&!dy){setV(0,0);return;}const d=Math.hypot(dx,dy);G.joy.m=1;G.joy.x=dx/d;G.joy.y=dy/d;K.style.transform=`translate(${dx/d*R*.8}px,${dy/d*R*.8}px)`;};

    else if(['1','2','3'].includes(k)){G.castReq=+k-1;}});
  addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KS[k]){KS[k]=0;kv();}});
