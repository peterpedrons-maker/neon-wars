<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140e09">

<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<title>Hearthblade — Lendas de Brumavale</title>
<style>
@font-face{font-family:'Rubik';src:url(assets/fonts/Rubik.woff2) format('woff2');font-weight:300 900;font-display:swap}
@font-face{font-family:'Cinzel';src:url(assets/fonts/Cinzel.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'CinzelDeco';src:url(assets/fonts/CinzelDecorative-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--ft:'Cinzel',Georgia,serif;--fd:'CinzelDeco','Cinzel',Georgia,serif;--f:'Rubik',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
--papel:#e9e2d0;--papel2:#a39b86;--ouro:#ffd65a;--ouroC:#f3d98e;--ouroE:#d9b45f;--lin:rgba(217,180,95,.45);--gl:rgba(12,11,17,.94);--bg:#18110b;--verde:#6cc35e;--azul:#5490e0;--verm:#d6403a;--borda:#8a6a3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--papel);font-family:var(--f);font-size:13px;overflow:hidden;touch-action:manipulation}
#stage{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);background:var(--bg);overflow:hidden}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:none}
#gc{position:absolute;inset:0;display:none;z-index:300;align-items:center;justify-content:center;padding:22px;background:rgba(4,3,8,.74);backdrop-filter:blur(2px)}
#gc.on{display:flex;animation:gcf .14s ease-out}@keyframes gcf{from{opacity:0}to{opacity:1}}
#gc .gcb{position:relative;width:100%;max-width:310px;background:linear-gradient(180deg,rgba(24,20,32,.97),rgba(11,10,16,.98));border:1px solid var(--lin);box-shadow:0 14px 40px rgba(0,0,0,.75),inset 0 0 0 1px rgba(0,0,0,.8);padding:18px 18px 14px;animation:pop .16s ease-out}
#gc h3{margin:0 0 8px;font:700 15px var(--ft);letter-spacing:.1em;text-transform:uppercase;color:var(--ouroC);text-align:center}
#gc p{margin:0 0 16px;font:400 13px/1.45 var(--f);color:var(--papel);text-align:center;white-space:pre-line}
#gc .gcbt{display:flex;gap:10px}#gc button{flex:1;height:40px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 11px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--papel)}
#gc button.ok{background:linear-gradient(#f0cf7c,#b98a2f);border-color:var(--ouroC);color:#2a1a06}#gc button.danger{background:linear-gradient(#e0605a,#9a2a26);border-color:#ffb0a8;color:#fff}
#gc i{position:absolute;width:9px;height:9px;border:2px solid var(--ouroE)}#gc .c1{left:-2px;top:-2px;border-width:2px 0 0 2px}#gc .c2{right:-2px;top:-2px;border-width:2px 2px 0 0}#gc .c3{left:-2px;bottom:-2px;border-width:0 0 2px 2px}#gc .c4{right:-2px;bottom:-2px;border-width:0 2px 2px 0}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.txt-o{text-shadow:0 1px 0 #140e09,1px 0 0 #140e09,-1px 0 0 #140e09,0 -1px 0 #140e09}
button{font-family:var(--f);cursor:pointer;color:var(--papel);transition:transform .08s,filter .1s}
button:active:not(:disabled){transform:scale(.97);filter:brightness(1.15)}
/* ---------- vidro escuro com moldura fina dourada ---------- */
.panel,#hero,#prog,#bar,#gold,#toast,#win .box,#pan .box,.gl{background:var(--gl);border:1px solid var(--lin);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 6px 20px rgba(0,0,0,.55);position:relative}
#win .box::before,#pan .box::before,.gl::before,#win .box::after,#pan .box::after,.gl::after{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--ouroE);pointer-events:none}
#win .box::before,#pan .box::before,.gl::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
#win .box::after,#pan .box::after,.gl::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:46px;padding:0 10px;border:1px solid var(--ouroC);background:linear-gradient(#f0cf7c,#b98a2f);color:#2a1a06;font:700 13px var(--ft);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 0 #ffe8a8;box-shadow:0 0 14px rgba(217,180,95,.3)}
.btn.sec{background:linear-gradient(#2a2433,#17131d);border-color:var(--lin);color:var(--papel);text-shadow:none;box-shadow:none}
.btn:disabled{background:linear-gradient(#26222e,#15121a);border-color:rgba(217,180,95,.25);color:#6c6678;text-shadow:none;box-shadow:none}
/* título */
#title{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#2d4a1e,#0e150a 70%);padding:24px;gap:14px;text-align:center}
#title img{width:78%;max-width:300px;image-rendering:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
#title .sub{font:600 11px var(--ft);letter-spacing:.28em;text-transform:uppercase;color:var(--papel2)}
#title .col{width:80%;max-width:300px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
#title a{color:var(--papel2);font-size:11px;text-decoration:underline}
/* ---------- criação em 3 etapas ---------- */
#create{background:radial-gradient(ellipse at 50% 28%,#2b2a3a,#0b0b12 72%);padding:0 12px 14px}
#csteps{display:flex;justify-content:center;align-items:flex-start;padding-top:12px;flex:none}
#csteps .s{display:flex;flex-direction:column;align-items:center;gap:7px;width:84px;font:600 9px var(--ft);letter-spacing:.14em;color:var(--papel2);text-transform:uppercase}
#csteps .s i{width:24px;height:24px;border:1px solid var(--lin);display:grid;place-items:center;font:700 12px var(--ft);font-style:normal;transform:rotate(45deg);background:#14111a}
#csteps .s i span{transform:rotate(-45deg)}
#csteps .s.on{color:var(--ouroC)}#csteps .s.on i{background:linear-gradient(#f0cf7c,#b98a2f);color:#2a1a06;border-color:var(--ouroC);box-shadow:0 0 12px rgba(217,180,95,.5)}
#csteps .s.ok i{background:#2a2433;color:var(--ouroE)}
#csteps .ln{width:34px;height:1px;background:var(--lin);margin-top:12px}
#cstage{position:relative;flex:1;min-height:120px}
#cprev{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#cname-tag{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:700 11px var(--ft);letter-spacing:.28em;text-transform:uppercase;color:var(--ouroE);text-shadow:0 1px 3px #000}
.cstep{display:none;flex-direction:column;gap:10px;flex:none}.cstep.on{display:flex}
#cls{display:flex;gap:6px;justify-content:center}
#cls button{width:50px;height:50px;padding:2px;background:#14111a;border:1px solid var(--lin);position:relative}
#cls button canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#cls button.on{border-color:var(--ouroC);box-shadow:0 0 12px rgba(217,180,95,.5);background:#241d12}
#cinfo{padding:12px 14px;display:grid;grid-template-columns:1fr auto;column-gap:10px}
#cinfo h3{margin:0;font:700 20px var(--ft);letter-spacing:.06em;color:var(--ouroC)}
#cinfo .papel{font:700 10.5px var(--ft);letter-spacing:.14em;text-transform:uppercase;color:#8fd88a;align-self:center}
#cinfo p{grid-column:1/3;margin:3px 0 8px;font-size:12px;color:var(--papel2)}
#cbars{grid-column:1/3}
.sbar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--papel2);margin:3px 0}
.sbar span{width:52px}.sbar i{flex:1;height:6px;background:#0a090e;border:1px solid #3a3446;position:relative;display:block}
.sbar i b{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .35s}
#csk{grid-column:1/3;margin-top:8px}#csk .h{font:600 10px var(--ft);letter-spacing:.14em;color:var(--papel2);margin-bottom:6px;text-transform:uppercase}
#csk .r{display:flex;gap:6px}#csk img{width:36px;height:36px;image-rendering:pixelated;background:#0d0b11;border:1px solid var(--lin);padding:2px}
.ctabs{display:flex;border-bottom:1px solid var(--lin)}
.ctabs button{flex:1;height:34px;border:0;background:transparent;color:var(--papel2);font:700 11px var(--ft);letter-spacing:.14em;text-transform:uppercase}
.ctabs button.on{color:var(--ouroC);background:linear-gradient(#2a2433,#17131d);box-shadow:inset 0 -2px 0 var(--ouroE)}
#look{padding:6px 12px 10px;min-height:248px}
#look .lr{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid rgba(255,255,255,.06)}
#look .lr>span{width:62px;flex:none;font:600 10px var(--ft);letter-spacing:.14em;text-transform:uppercase;color:var(--papel2)}
#look .sw{display:grid;grid-template-columns:repeat(7,26px);gap:6px;flex:1;padding:6px 0}
#look .sw button{width:26px;height:26px;border:1px solid #000;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
#look .sw button.on{outline:2px solid var(--ouroC);outline-offset:1px}
#look .sel{flex:1;display:flex;align-items:center;justify-content:space-between;height:32px;border:1px solid var(--lin);background:#0e0c13;padding:0 4px}
#look .sel b{font:600 12.5px var(--f);color:var(--papel)}
#look .sel a{width:24px;height:24px;display:grid;place-items:center;color:var(--ouroC);font-size:11px;background:#1c1822;cursor:pointer}
#look .sel a:active{background:#2c2636}
#look .tools{display:flex;gap:8px;margin-top:12px}
#look .tools button{flex:1;height:34px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10.5px var(--ft);letter-spacing:.12em;text-transform:uppercase}
#cs3 .gl{padding:14px}
#cs3 label{display:block;text-align:center;font:600 10px var(--ft);letter-spacing:.2em;color:var(--papel2);margin-bottom:8px}
#cname{width:100%;height:46px;border:1px solid var(--lin);background:#0e0c13;color:var(--ouroC);font:700 19px var(--ft);text-align:center;letter-spacing:.1em;outline:0;border-radius:0}
#cname:focus{border-color:var(--ouroC)}#cname::placeholder{color:#6c6678;font-weight:500}
#cs3 .tools{display:flex;margin-top:10px}#cs3 .tools button{flex:1;height:32px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10px var(--ft);letter-spacing:.12em;text-transform:uppercase}
.st{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;font-size:12px}
.st div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:3px 0}.st b{color:var(--ouroC);font-weight:600}
#cnav{display:flex;gap:10px;flex:none;margin-top:12px}#cnav .btn{flex:1}
/* ---------- HUD ---------- */
#hud{pointer-events:none}#hud *{pointer-events:none}#hud button{pointer-events:auto}
#hero{position:absolute;left:6px;top:calc(6px + env(safe-area-inset-top));width:186px;padding:7px 9px 8px 62px;min-height:58px;background:linear-gradient(180deg,rgba(40,32,52,.94),rgba(18,14,24,.94));border-color:#8a7440;box-shadow:inset 0 0 0 1px rgba(255,226,150,.14),inset 0 1px 0 rgba(255,255,255,.12),0 6px 20px rgba(0,0,0,.6)}
#hero::before,#hero::after{content:'';position:absolute;width:7px;height:7px;border:2px solid #d9b45f}#hero::before{left:-3px;top:-3px;border-right:0;border-bottom:0}#hero::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
#hport{position:absolute;left:7px;top:7px;width:46px;height:46px;background:#0d0b11;border:2px solid #d9b45f;box-shadow:0 0 0 1px #3a2c10,inset 0 0 0 1px #0a0a10,0 2px 6px rgba(0,0,0,.6)}
#hport canvas{position:absolute;left:0;top:0;width:42px!important;height:42px!important;border:0!important;background:radial-gradient(circle at 50% 35%,#3a3050,#14101c)}
#hl{position:absolute;right:-9px;bottom:-9px;min-width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#c8962e 70%,#8a6418);border:2px solid #3a2808;color:#2a1a06;font:800 10.5px/16px var(--f);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.7);padding:0 2px;box-sizing:border-box}
#hero canvas{image-rendering:pixelated}
#hero .nm{font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;line-height:1.2}
#hero .nm span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:104px;font-weight:700;letter-spacing:.02em}#hero .nm span:last-child{color:#d9b45f;font:600 9px var(--f);letter-spacing:.1em;text-transform:uppercase;align-self:center}
.bar{height:8px;background:#0a090e;margin-top:3px;position:relative;border:1px solid #3a3446}
.bar b{display:block;position:absolute;left:0;top:0;bottom:0}
#hpw{position:relative}#hpw #hp{height:15px;margin-top:4px;border:1px solid #5a4a28;background:#120c0c;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}#hpw #hp::after{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
#hp b{background:linear-gradient(#ff7a6a,#d6302a 55%,#a01c18)}#xp b{background:linear-gradient(#8fc2ff,#3a7be0)}
#hpt{position:absolute;left:0;right:0;top:4px;height:15px;line-height:15px;text-align:center;font:600 9px var(--f);color:#fff;text-shadow:0 1px 1px #000,0 0 2px #000}
#hero #xp{height:6px;margin-top:4px;border-color:#2a3a5a;background:linear-gradient(#070b16,#0d1426)}#hero #xp b::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.35)}#hport::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 8px rgba(0,0,0,.7);pointer-events:none}#hero #xp b{box-shadow:0 0 6px rgba(120,180,255,.6)}#xpt{position:absolute;right:9px;bottom:1px;font:600 7px var(--f);color:#9fc4ff;opacity:.9;display:none}
#gold{display:none!important;position:absolute;left:6px;top:calc(66px + var(--sth,0px) + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;height:26px;padding:0 12px 0 8px;font:700 13px var(--f);color:var(--ouroC)}
#gold::before{content:'';width:16px;height:16px;background:url(assets/ui2/i_coin.png) center/contain no-repeat;image-rendering:pixelated}
#zone{display:none}
#prog{position:absolute;right:6px;top:calc(6px + env(safe-area-inset-top));width:100px;padding:5px 8px 6px;text-align:center;font:600 10.5px var(--f)}
#hud #mm{pointer-events:auto;position:absolute;right:6px;top:calc(58px + env(safe-area-inset-top));border:2px solid #b8923c;border-radius:5px;background:rgba(8,10,16,.55);box-shadow:0 0 0 1px #2a1c08,inset 0 0 0 1px rgba(255,226,150,.25),0 4px 12px rgba(0,0,0,.6);display:none;cursor:pointer}
#hud #mm.big{position:fixed;left:50%;top:50%;right:auto;transform:translate(-50%,-50%);z-index:30;box-shadow:0 0 0 100vmax rgba(4,6,10,.62),0 8px 30px rgba(0,0,0,.7);border-color:var(--ouroC)}
#prog .bar{height:5px;margin-top:4px}#prog .bar b{background:#e8a63a}
#boss{position:absolute;left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);width:62%;padding:4px 8px 6px;border-color:#b0442e;background:rgba(36,12,10,.94);display:none}
#boss .t{font:700 11px var(--ft);letter-spacing:.1em;text-align:center;color:#ffd6a0}
#boss .bar b{background:linear-gradient(#f26a5a,#b02a24)}
#sts{position:absolute;left:6px;top:calc(74px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:3px 3px;width:186px}
#hud #sts .si{pointer-events:auto;position:relative;width:26px;height:35px}
#sts .ib{width:26px;height:26px;box-sizing:border-box;background:rgba(10,8,14,.82);border:1px solid #4f9a5a;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#sts .si.bad .ib{border-color:#d0483c;background:rgba(44,10,10,.84)}
#sts img{width:20px;height:20px;image-rendering:pixelated}
#sts .tm{position:absolute;left:-2px;right:-2px;bottom:0;text-align:center;font:700 9.5px var(--f);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000,0 0 3px #000}
#sts .si.bad .tm{color:#ffd0c8}
#sts .n{position:absolute;right:-3px;top:-4px;background:#000c;border:1px solid #888;color:#fff;font:700 8px var(--f);line-height:1;padding:1px 3px;border-radius:7px}
#sts .si.low .ib{animation:stblink .45s infinite alternate}
@keyframes stblink{from{opacity:1}to{opacity:.35}}
#buffs{position:absolute;left:6px;top:calc(98px + var(--sth,0px) + env(safe-area-inset-top));display:flex;gap:3px}
#buffs div{display:flex;align-items:center;gap:2px;background:var(--gl);border:1px solid var(--lin);padding:1px 4px 1px 2px;font-size:9px}
#buffs img{width:14px;height:14px;image-rendering:pixelated}
#chat{position:absolute;left:6px;bottom:calc(88px + env(safe-area-inset-bottom));width:60%;font-size:10.5px;line-height:1.35;background:linear-gradient(90deg,rgba(8,8,12,.55),rgba(8,8,12,0));padding:2px 6px;display:none}
#chat div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);padding:9px 18px;font:600 13.5px var(--f);color:var(--ouroC);display:none;text-align:center;white-space:nowrap}
#joy{position:absolute;left:14px;bottom:calc(150px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;display:none;touch-action:none;pointer-events:auto;z-index:6;background:radial-gradient(circle,rgba(20,16,26,.35) 0,rgba(20,16,26,.55) 100%);border:2px solid rgba(217,180,95,.55);box-shadow:0 0 0 3px rgba(0,0,0,.35),inset 0 0 18px rgba(0,0,0,.6)}
#joy.on{display:block}#joy::before{content:'';position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(217,180,95,.25)}
#joyk{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6df9c,#b98a2f 70%,#6d4c14);border:2px solid #2a1a06;box-shadow:0 3px 8px rgba(0,0,0,.6);pointer-events:none;transition:transform .08s}
#joy.act #joyk{transition:none}
#tapfx{position:absolute;pointer-events:none;width:30px;height:30px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(.3);opacity:0}
#banner{position:absolute;left:0;right:0;top:calc(30% + env(safe-area-inset-top));text-align:center;pointer-events:none;opacity:0;padding:22px 8px 20px;background:linear-gradient(90deg,transparent,rgba(8,5,3,.62) 22%,rgba(8,5,3,.62) 78%,transparent)}
#banner b{display:block;font:700 21px var(--fd);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:#ffd65a;text-shadow:0 2px 0 #2a160a,0 0 14px rgba(255,190,70,.5)}
#banner u{display:block;height:2px;width:0;margin:9px auto 7px;background:linear-gradient(90deg,transparent,#ffd65a,transparent);text-decoration:none}
#banner span{display:block;font:600 12px var(--ft);letter-spacing:.32em;text-transform:uppercase;color:#eadcb4;text-shadow:0 1px 3px #000}
#banner i{display:none}
#banner.show{animation:bnr 3.6s ease-in-out forwards}
#banner.show b{animation:bnb 3.6s ease-out forwards}
#banner.show u{animation:bnu 3.6s ease-out forwards}
@keyframes bnr{0%{opacity:0}18%{opacity:1}76%{opacity:1}100%{opacity:0}}
@keyframes bnb{0%{letter-spacing:.34em;transform:scale(1.1)}30%{letter-spacing:.1em;transform:scale(1)}100%{letter-spacing:.14em;transform:scale(1.02)}}
@keyframes bnu{0%,10%{width:0}40%{width:78%}100%{width:90%}}
#res{align-items:center;justify-content:center;background:rgba(6,5,10,.8);gap:12px;padding:24px;text-align:center}
#res h2{margin:0;font:700 26px var(--ft);letter-spacing:.14em;color:var(--ouroC);text-shadow:0 2px 0 #2a160a}
#res .l{font-size:12.5px;color:var(--papel)}#res .box{padding:12px 16px;width:100%;max-width:320px}
#res .col{width:100%;max-width:300px;display:flex;flex-direction:column;gap:8px}
#ko{align-items:center;justify-content:center;background:rgba(40,0,0,.45);font:700 18px var(--ft);color:#ffd6d0;text-align:center;display:none;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:50}#fade.on{opacity:1;pointer-events:auto}
/* ---------- janelas (MMO) ---------- */
#win,#pan{align-items:center;justify-content:center;background:rgba(5,4,8,.72);padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
#win .box,#pan .box{width:100%;max-height:100%;display:flex;flex-direction:column;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.tt{flex:none;display:flex;align-items:center;justify-content:space-between;height:38px;padding:0 6px 0 14px;background:linear-gradient(#2a2433,#16131c);border-bottom:1px solid var(--lin);font:700 13px var(--ft);letter-spacing:.2em;text-transform:uppercase;color:var(--ouroC)}
.xb{position:relative;width:26px;height:26px;border:1px solid var(--lin);background:#1c1822;padding:0;font-size:0}
.xb::before,.xb::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:2px;margin:-1px 0 0 -6px;background:var(--ouroC);transform:rotate(45deg)}
.xb::after{transform:rotate(-45deg)}
.tabs{display:flex;border-bottom:1px solid var(--lin);flex:none}
.tabs button{flex:1;height:36px;border:0;background:transparent;color:var(--papel2);font:700 10px var(--ft);letter-spacing:.06em;padding:0 2px;text-transform:uppercase;white-space:nowrap}
.tabs button.on{color:var(--ouroC);background:linear-gradient(#2a2433,#17131d);box-shadow:inset 0 -2px 0 var(--ouroE)}
.wb{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0;-webkit-overflow-scrolling:touch;padding:12px}
#win .sub{font-size:12px;color:var(--papel2);text-align:center;margin:0}
.wgold{display:flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--ft);letter-spacing:.06em;color:var(--ouroC)}
.wgold img,.wr .pr img,.stline .pr img{width:16px;height:16px;image-rendering:pixelated;filter:sepia(1) saturate(7) hue-rotate(-8deg) brightness(1.25)}
.wr{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:56px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);font-size:12px}
.wr.sel{border-color:var(--lin);background:rgba(217,180,95,.1)}.wr.lock{opacity:.5;filter:grayscale(.6)}
.wr .ic{width:40px;height:40px;flex:none;image-rendering:pixelated;background:#0d0b11;border:1px solid #4a4458;padding:3px}
.wr .tx{flex:1;min-width:0}.wr .tx b{display:block;font-size:13px;font-weight:600;line-height:1.2}.wr .tx span{color:var(--papel2);font-size:11px;line-height:1.35;display:block}
.wr .pr{color:var(--ouroC);font-weight:700;font-size:12.5px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.gb,.db{height:36px;min-width:72px;padding:0 12px;border:1px solid;font:700 11px var(--f);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;flex:none;display:flex;align-items:center;justify-content:center}
.gb{background:linear-gradient(#f0cf7c,#b98a2f);border-color:var(--ouroC);color:#2a1a06;text-shadow:0 1px 0 #ffe8a8}
.db{background:linear-gradient(#2a2433,#17131d);border-color:var(--lin);color:var(--papel)}
.gb:disabled,.db:disabled{opacity:.4;filter:grayscale(.7)}
.gb.big{width:100%;height:48px;font-size:13px}
.wdiv{height:1px;background:linear-gradient(90deg,transparent,var(--lin) 20%,var(--lin) 80%,transparent);flex:none;margin:2px 0}
.stline{display:flex;justify-content:space-between;font-size:12px;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.fslots{display:flex;gap:6px;justify-content:center}
.fslots .fs{width:17%;max-width:56px;aspect-ratio:1;border:1px solid #4a4458;background:#0d0b11;padding:3px;position:relative}
.fslots .fs.sel{box-shadow:0 0 0 2px var(--ouroC)}.fslots .fs img{width:100%;height:100%;image-rendering:pixelated;display:block}
.fslots .fs i{position:absolute;right:2px;bottom:0;font:700 9.5px var(--f);font-style:normal;color:#fff;text-shadow:0 1px 0 #000}
.fbig{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.fbig .fi{width:76px;height:76px;border:2px solid;background:#0d0b11;padding:6px;position:relative}.fbig .fi img{width:100%;height:100%;image-rendering:pixelated}
.fbig b{font-size:15px}.fbig span{font-size:11px;color:var(--papel2)}
.fbar{height:8px;background:#0a090e;border:1px solid #3a3446;position:relative}.fbar b{display:block;height:100%;background:linear-gradient(#8ee07e,#4aa33e)}
.up{color:#7de06d}.dn{color:#ff7a6a}
.acts{display:flex;gap:8px}.acts button{flex:1;height:38px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10.5px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--papel)}
.acts button.g{background:linear-gradient(#f0cf7c,#b98a2f);border-color:var(--ouroC);color:#2a1a06}.acts button:disabled{opacity:.4}
/* herói */
.pd{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pc{flex:1;display:grid;place-items:center;position:relative;height:176px}.pc canvas{width:128px;height:160px;image-rendering:pixelated}
.slot,.cell{position:relative;border:1px solid #3a3446;background:#0d0b11;aspect-ratio:1;cursor:pointer}
.slot{width:50px}.slot img,.cell img{position:absolute;inset:0;margin:auto;width:76%;height:76%;image-rendering:pixelated;display:block}
.slot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5a5468;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.cell.e{cursor:default;opacity:.55}
/* contorno de raridade estilo ARPG (PoE): moldura de 2px na cor da raridade sobre fundo escuro com leve tom da cor */
[style*="--rc"].cell,[style*="--rc"].slot,[style*="--rc"].fs,[style*="--rc"].ic2,[style*="--rc"].ti{border-width:2px;border-style:solid;background:linear-gradient(155deg,color-mix(in srgb,var(--rc) 26%,#0d0b11),#0d0b11 78%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.9),inset 0 0 10px color-mix(in srgb,var(--rc) 38%,transparent)}
.cell.sel[style*="--rc"],.slot.sel[style*="--rc"]{box-shadow:inset 0 0 0 1px #000,0 0 0 2px var(--ouroC),inset 0 0 10px color-mix(in srgb,var(--rc) 38%,transparent)}
.slot.sel,.cell.sel{box-shadow:0 0 0 2px var(--ouroC)}
.il{position:absolute;right:2px;bottom:0;font:700 10px var(--f);color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sec-h{display:flex;justify-content:space-between;font:600 10px var(--ft);letter-spacing:.16em;text-transform:uppercase;color:var(--papel2);margin:4px 2px 0}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:12px}
.stg div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:3px 0}.stg b{color:var(--ouroC);font-weight:600}
.skc{display:flex;gap:10px;padding:10px;align-items:center;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09)}
.skc img{width:44px;height:44px;image-rendering:pixelated;background:#0d0b11;border:1px solid var(--lin);padding:3px;flex:none}
.skc .t{flex:1;font-size:11.5px;line-height:1.4;color:var(--papel2)}.skc .t b{font:700 13px var(--ft);color:var(--ouroC);letter-spacing:.03em}
.pl{width:40px;height:40px;border:1px solid var(--ouroC);background:linear-gradient(#f0cf7c,#b98a2f);color:#2a1a06;font:700 20px var(--f);flex:none}
.pl:disabled{background:#26222e;border-color:#3a3446;color:#5a5468}
.pips{display:flex;gap:3px;margin-top:4px}.pips i{width:14px;height:5px;background:#26222e;border:1px solid #4a4458}.pips i.on{background:var(--ouroE);border-color:var(--ouroC)}
.avl{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(217,180,95,.08);border:1px solid var(--lin);font-size:12px}.avl b{font:700 16px var(--ft);color:var(--ouroC)}
.atr{display:flex;align-items:center;gap:10px;padding:9px 10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09)}
.atr .an{flex:1}.atr .an b{display:block;font:700 13px var(--ft);letter-spacing:.05em;color:var(--papel)}.atr .an span{font-size:11px;color:var(--papel2)}
.atr .av{font:700 18px var(--ft);color:var(--ouroC);min-width:34px;text-align:center}

.eqs{display:flex;gap:8px}.eqk{flex:1;height:64px;border:1px solid #3a3446;background:#0d0b11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-align:center}
.eqk img{width:34px;height:34px;image-rendering:pixelated}.eqk em{font:600 9.5px var(--f);font-style:normal;color:var(--papel2);line-height:1.1;padding:0 2px}.eqk span{font:600 10px var(--ft);letter-spacing:.1em;color:#5a5468;text-transform:uppercase}
.eqk.on{border-color:var(--ouroC);box-shadow:0 0 0 1px var(--ouroC),0 0 10px rgba(243,217,142,.3)}.eqk.lk{opacity:.5;cursor:default}
.skc.lock{opacity:.55}.skc .warn{color:#ff9a8a;font-size:10.5px}
.sbt{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none;width:78px}.sbt .pl{width:100%}
.eqb{height:26px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 9.5px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--papel)}
.eqb.on{border-color:var(--ouroC);color:var(--ouroC)}.eqb:disabled{opacity:.35}
#csk img{width:30px;height:30px}
/* dica flutuante do item (estilo WoW) */
#tip,#wtip{position:absolute;display:none;width:208px;z-index:30;background:rgba(10,9,14,.97);border:1px solid;padding:9px 10px 8px;font-size:11.5px;box-shadow:0 8px 24px rgba(0,0,0,.7);animation:pop .12s ease-out}
#tip.on,#wtip.on{display:block}
#tip,#wtip{width:232px}
.uq{margin:0 0 6px;padding:4px 7px;border:1px solid rgba(255,166,58,.55);background:rgba(255,166,58,.1);color:#ffb860;font-size:10.5px;line-height:1.3}
.cr{display:grid;grid-template-columns:1fr 40px 46px 56px;gap:2px;padding:2px 0;font-size:11.5px;align-items:center;border-bottom:1px solid rgba(255,255,255,.05)}.cr.p{grid-template-columns:1fr auto}.cr .cl{color:var(--papel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.cr .cn{text-align:right;color:#f4ecd8;font-weight:700}.cr .co{text-align:right;color:#8e8a98}.cr .cd2{text-align:right;font-weight:700}.cr .cd2.eq{color:#8e8a98}.cr.ch{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#8e8a98;border-bottom:1px solid rgba(217,180,95,.25)}.cr.ch span{font-weight:400!important;color:#8e8a98!important}
.cv{display:flex;justify-content:space-between;align-items:center;padding:4px 7px;margin:0 0 6px;font-size:10.5px;letter-spacing:.05em;border:1px solid;background:rgba(0,0,0,.35)}.cv b{font-size:13px}.cv.up{color:#7de06d;border-color:rgba(125,224,109,.5)}.cv.dn{color:#ff7a6a;border-color:rgba(255,122,106,.5)}.cv.eq{color:#d9b45f;border-color:rgba(217,180,95,.5)}
.ce{display:grid;grid-template-columns:22px 1fr;gap:1px 6px;align-items:center;margin-top:6px;padding:4px 5px;background:rgba(255,255,255,.04);font-size:10.5px}.ce img{width:22px;height:22px;grid-row:span 2;image-rendering:pixelated}.ce em{font-style:normal;color:#8e8a98;font-size:9.5px}
#tip .th span,#wtip .th span{display:block}#tip .th span.st,#wtip .th span.st{font-size:11px;letter-spacing:.04em}#tip .th span.st b,#wtip .th span.st b{display:inline;font:700 11px var(--ft);margin-left:3px}
i.ts{position:absolute;left:2px;top:1px;font-size:7px;font-style:normal;line-height:1}i.ts .stars{letter-spacing:-.5px}
/* estrelas: a cor e o brilho crescem com o tier; no 12º queimam */
.stars{display:inline-block;position:relative;font-style:normal;letter-spacing:1px}
.tr1{color:#b8b2a4}.tr2{color:#c9905a}.tr3{color:#dfe5ee}.tr4{color:#6fd6e8}.tr5{color:#6cd86c}
.tr6{color:#5aa8ff;text-shadow:0 0 4px #5aa8ffaa}.tr7{color:#b878ff;text-shadow:0 0 5px #b878ffcc}.tr8{color:#ff6ad0;text-shadow:0 0 6px #ff6ad0cc}
.tr9,.tr10,.tr11{background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shim 2.2s linear infinite;filter:drop-shadow(0 0 3px rgba(255,200,60,.8))}
.tr9{background-image:linear-gradient(100deg,#ffc83a 20%,#fff6c0 40%,#ffc83a 60%)}
.tr10{background-image:linear-gradient(100deg,#ff8a2a 20%,#ffe28a 40%,#ff8a2a 60%);filter:drop-shadow(0 0 4px rgba(255,138,42,.95))}
.tr11{background-image:linear-gradient(100deg,#ff4a3a 20%,#ffd0a0 40%,#ff4a3a 60%);filter:drop-shadow(0 0 5px rgba(255,74,58,1));animation-duration:1.5s}
.tr12{background-image:linear-gradient(0deg,#ff2a0a 0%,#ff7a1a 40%,#ffd23a 75%,#fff6c0 100%);background-size:100% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flame .55s ease-in-out infinite alternate,fglow 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 -2px 3px rgba(255,120,20,.95))}
.tr12::before,.tr12::after{content:'';position:absolute;bottom:55%;width:3px;height:3px;border-radius:50%;background:#ffb040;box-shadow:0 0 4px #ff6a1a;animation:ember 1.3s linear infinite;opacity:0;-webkit-text-fill-color:initial}
.tr12::before{left:18%}.tr12::after{left:62%;animation-delay:.65s;background:#ffd23a}
@keyframes shim{to{background-position:-220% 0}}
@keyframes flame{from{background-position:0 0}to{background-position:0 100%}}
@keyframes fglow{from{filter:drop-shadow(0 -1px 2px rgba(255,90,20,.8))}to{filter:drop-shadow(0 -4px 6px rgba(255,170,40,1))}}
@keyframes ember{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:1}100%{transform:translateY(-12px) scale(.2);opacity:0}}
.tc10{box-shadow:0 0 8px rgba(255,138,42,.5)}.tc12{animation:cfire 1s ease-in-out infinite alternate}
@keyframes cfire{from{box-shadow:0 0 6px rgba(255,90,20,.6),inset 0 0 6px rgba(255,90,20,.25)}to{box-shadow:0 0 14px rgba(255,170,40,.95),inset 0 0 10px rgba(255,150,30,.45)}}small.st2{display:block;font-size:9px;opacity:.85}
i.upg{position:absolute;right:1px;top:0;font-size:9px;color:#7de06d;font-style:normal;text-shadow:0 1px 2px #000;line-height:1}
#tip .th,#wtip .th{display:flex;gap:8px;align-items:center;margin-bottom:6px}
#tip .ti,#wtip .ti{width:38px;height:38px;border:1px solid;background:#0d0b11;flex:none;padding:3px}#tip .ti img,#wtip .ti img{width:100%;height:100%;image-rendering:pixelated}
#tip .th b,#wtip .th b{display:block;font:700 13px var(--ft);line-height:1.15}#tip .th span,#wtip .th span{font-size:10.5px;color:var(--papel2)}
#tip .row,#wtip .row{display:flex;justify-content:space-between;padding:1px 0;color:#9be08f}#tip .row span:first-child,#wtip .row span:first-child{color:var(--papel)}
#tip .vl,#wtip .vl{margin-top:6px;font-size:10.5px;color:var(--papel2)}
#tip .ta,#wtip .ta{display:flex;gap:6px;margin-top:8px}#tip .ta button,#wtip .ta button{flex:1;height:32px;border:1px solid var(--lin);background:linear-gradient(#2a2433,#17131d);font:700 10.5px var(--f);letter-spacing:.08em;text-transform:uppercase}
#tip .ta button.g,#wtip .ta button.g{background:linear-gradient(#f0cf7c,#b98a2f);border-color:var(--ouroC);color:#2a1a06}
#tip::after,#wtip::after{content:'';position:absolute;left:var(--ax,50%);width:10px;height:10px;background:inherit;border:inherit;border-width:0 1px 1px 0;transform:translateX(-50%) rotate(45deg);bottom:-6px}
#tip.bl::after,#wtip.bl::after{bottom:auto;top:-6px;border-width:1px 0 0 1px}

/* ===== janelas de NPC (estilo vendedor de MMO) ===== */
.nh{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(90deg,rgba(217,180,95,.12),rgba(217,180,95,0));border:1px solid var(--lin)}
.nh .np{width:46px;height:46px;flex:none;background:#0d0b11;border:1px solid var(--lin);display:grid;place-items:center}.nh .np img{width:30px;height:30px;image-rendering:pixelated}
.nh b{display:block;font:700 14px var(--ft);letter-spacing:.06em;color:var(--ouroC)}.nh span{font-size:11.5px;color:var(--papel2);font-style:italic}
.nh .gd{margin-left:auto;display:flex;align-items:center;gap:5px;font:700 13px var(--f);color:var(--ouroC);background:#0d0b11;border:1px solid var(--lin);padding:5px 9px}
.nh .gd img{width:15px;height:15px;image-rendering:pixelated;filter:sepia(1) saturate(7) hue-rotate(-8deg) brightness(1.25)}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vi{display:flex;align-items:center;gap:8px;padding:6px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);cursor:pointer;min-height:54px}
.vi.sel{border-color:var(--ouroC);background:rgba(217,180,95,.1)}.vi.no{opacity:.55}
.vi .ic2{width:38px;height:38px;flex:none;background:#0d0b11;border:1px solid;padding:3px;position:relative}.vi .ic2 img{width:100%;height:100%;image-rendering:pixelated}
.vi .tx2{min-width:0;flex:1}.vi .tx2 b{display:block;font-size:11.5px;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vi .pr2{display:flex;align-items:center;gap:3px;font:700 11.5px var(--f);color:var(--ouroC);margin-top:2px}.vi .pr2.bad{color:#ff8a7a}.vi .pr2 img{width:12px;height:12px;image-rendering:pixelated;filter:sepia(1) saturate(7) hue-rotate(-8deg) brightness(1.25)}
.vfoot{display:flex;gap:8px}.vfoot button{flex:1}
.fcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;background:radial-gradient(ellipse at 50% 35%,rgba(217,180,95,.12),rgba(0,0,0,0) 70%),rgba(255,255,255,.02);border:1px solid var(--lin)}
.fcard .fi{width:84px;height:84px;border:2px solid;background:#0d0b11;padding:8px;position:relative;box-shadow:0 0 18px rgba(0,0,0,.6)}.fcard .fi img{width:100%;height:100%;image-rendering:pixelated}
.fcard b{font:700 15px var(--ft);letter-spacing:.04em}.fcard span{font-size:11px;color:var(--papel2)}
.seg{display:flex;gap:3px}.seg i{flex:1;height:8px;background:#26222e;border:1px solid #3a3446}.seg i.on{background:linear-gradient(#8ee07e,#4aa33e);border-color:#6cc35e}.seg i.mid{background:linear-gradient(#ffd070,#c98a2a);border-color:#e0b050}
.dg{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09)}
.dg.sel{border-color:var(--ouroC);background:rgba(217,180,95,.1)}.dg.lock{opacity:.5}
.dg .ic{width:42px;height:42px;background:#0d0b11;border:1px solid var(--lin);padding:5px;image-rendering:pixelated}
.dg b{display:block;font:700 13px var(--ft);letter-spacing:.04em}.dg span{font-size:11px;color:var(--papel2)}
.dd{padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid var(--lin);font-size:12px;line-height:1.55}.dd .zs{display:flex;align-items:center;gap:8px;margin:8px 0}.dd .zs b{flex:1;text-align:center;font:700 15px var(--ft);color:var(--ouroC)}
.dd .row2{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:2px 0}.dd .row2 span:first-child{color:var(--papel2)}

/* ===== subclasses ===== */
#csub{padding:10px 12px}#csub .hd2{display:flex;justify-content:space-between;font:700 10px var(--ft);letter-spacing:.16em;text-transform:uppercase;color:var(--papel2);margin-bottom:8px}
#csub .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#csub .sc{padding:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09)}
#csub .sc b{display:block;font:700 13px var(--ft);color:var(--ouroC);letter-spacing:.05em}#csub .sc i{font-style:normal;font-size:10px;color:#8fd88a;text-transform:uppercase;letter-spacing:.1em}
#csub .sc p{margin:4px 0 6px;font-size:10.5px;line-height:1.35;color:var(--papel2)}
#csub .sk3{display:flex;gap:5px}#csub .sk3 img,.sbk img{width:34px;height:34px;image-rendering:pixelated;background:#0d0b11;border:1px solid var(--lin);padding:2px;cursor:pointer}

/* equilíbrio: valores originais foram reduzidos (cada tipo tem um fator) e as descrições são geradas a partir deles */
(function(){const F={atk:.5,def:.5,hp:.5,spd:.6,aspd:.5,crit:.5,critd:.4,ls:.4,thorns:.6,kb:.8,kd:.8,xp:.6,gold:.6,drop:.6,regen:.6,pot:.6,cdr:.5,dcd:.6,dmgred:.5,exec:.2,boss:.3},
 L={atk:'de ataque',def:'de defesa',hp:'de vida',spd:'de velocidade de movimento',aspd:'de velocidade de ataque',crit:'de chance de crítico',critd:'de dano crítico',ls:'do dano causado vira vida',thorns:'do dano recebido é refletido',kb:'de chance de empurrão',kd:'de duração da queda',xp:'de experiência',gold:'de ouro',drop:'de chance de drop',regen:'da vida por segundo',pot:'de cura das poções',cdr:'a menos de recarga das habilidades',dcd:'a menos de recarga da esquiva',dmgred:'a menos de dano recebido',exec:'de dano em inimigos abaixo de 30% de vida',boss:'de dano contra elites e chefes'};
 const pc=v=>{const p=Math.round(Math.abs(v)*1000)/10;return String(p).replace('.',',');};
 for(const c in TALENTS)for(const b of TALENTS[c])for(const n of b.nodes){const fx=n[3];for(const k in fx){fx[k]=Math.round(fx[k]*(F[k]||.6)*1000)/1000;if(!fx[k])fx[k]=.001;}
  const parts=Object.keys(fx).map(k=>(fx[k]<0?'−':'+')+pc(fx[k])+'% '+(L[k]||k));n[4]=(n[2]===1?'PEDRA ANGULAR: ':'')+parts.join(', ')+(n[2]>1?' por nível':'');}})();
const TCAP={exec:.06,boss:.08,ls:.04,dmgred:.25,thorns:.15,crit:.08,aspd:.12,critd:.45,atk:.2,regen:.02};
let TF={};
function tfCalc(){TF={};const R=SAVE.tl||{};for(const b of (TALENTS[SAVE.cls]||[]))for(const n of b.nodes){const r=R[n[0]]||0;if(!r)continue;for(const k in n[3])TF[k]=(TF[k]||0)+n[3][k]*r;}for(const k in TCAP)if(TF[k]>TCAP[k])TF[k]=TCAP[k];}
function tf(k){return TF[k]||0;}
const tlTotal=()=>SAVE.lv<6?0:Math.floor((SAVE.lv-6)/2)+1;
const tlSpentAll=()=>Object.values(SAVE.tl||{}).reduce((a,b)=>a+b,0);
const tlPoints=()=>tlTotal()-tlSpentAll();
const tlSpentIn=b=>b.nodes.reduce((a,n)=>a+((SAVE.tl||{})[n[0]]||0),0);
let tlBr=0;
function tlInvest(id){const T=TALENTS[SAVE.cls];for(const b of T){const i=b.nodes.findIndex(n=>n[0]===id);if(i<0)continue;const n=b.nodes[i],r=SAVE.tl[id]||0;
  if(r>=n[2]||tlPoints()<=0||tlSpentIn(b)<TL_REQ[TL_TIER[i]]){sfx('ui_denied',.5);return;}
  SAVE.tl[id]=r+1;tfCalc();if(G.hero)recalcHero(true);sfx('ui_confirm',.7);writeSave();badge();renderPan();return;}}
function tlReset(){const cost=50*SAVE.lv;if(!tlSpentAll())return;
  gConfirm('Devolve todos os pontos de talento. Custa '+cost+' de ouro.',{title:'Redefinir talentos?',ok:'Redefinir',no:'Cancelar'}).then(ok=>{if(!ok)return;if(SAVE.gold<cost){toast('Ouro insuficiente',1200);sfx('ui_denied');return;}SAVE.gold-=cost;SAVE.tl={};tfCalc();if(G.hero)recalcHero(true);sfx('ui_confirm');writeSave();badge();renderPan();});}
function renderTalents(B){
  const T=TALENTS[SAVE.cls],pts=tlPoints();tlBr=Math.min(tlBr,T.length-1);
  let h=`<div class="avl"><span>Pontos de talento · 1 a cada 2 níveis (Nv 6+)</span><b>${pts}</b></div>`;
  h+=`<div class="tlb">`+T.map((b,i)=>`<button class="${i===tlBr?'on':''}" data-tlb="${i}" style="--bc:${b.col}"><img src="${UI}${b.ic}.png"><b>${b.nm}</b><em>${tlSpentIn(b)} pts</em></button>`).join('')+`</div>`;
  const br=T[tlBr],sp=tlSpentIn(br);
  h+=`<div class="tlsub" style="color:${br.col}">${br.sub}</div>`;
  let lastT=-1;
  br.nodes.forEach((n,i)=>{const t=TL_TIER[i],r=SAVE.tl[n[0]]||0,open=sp>=TL_REQ[t],can=open&&r<n[2]&&pts>0,key=i===6;
    if(t!==lastT){lastT=t;h+=`<div class="tlt ${open?'':'lk'}"><span>${key?'Pedra angular':'Camada '+(t+1)}</span><span>${open?'liberada':'requer '+TL_REQ[t]+' pontos neste ramo'}</span></div>`;}
    h+=`<div class="tln ${open?'':'lk'} ${r?'has':''} ${key?'key':''}" style="--bc:${br.col}"><div class="tli"><img src="assets/talents/${n[0]}.png"></div><div class="tlx"><b>${n[1]}</b><span>${n[4]}</span><div class="pips">${Array.from({length:n[2]},(_,k)=>`<i class="${k<r?'on':''}"></i>`).join('')}</div></div><button class="tla" data-tl="${n[0]}" ${can?'':'disabled'}>+</button></div>`;});
  h+=`<div class="acts"><button data-tlr="1" ${tlSpentAll()?'':'disabled'}>Redefinir talentos (${50*SAVE.lv} ouro)</button></div>`;
  B.innerHTML=h;
  B.querySelectorAll('[data-tlb]').forEach(e=>e.onclick=()=>{tlBr=+e.dataset.tlb;sfx('ui_click',.5);renderPan();});
  B.querySelectorAll('[data-tl]').forEach(e=>e.onclick=()=>tlInvest(e.dataset.tl));
  const rb=B.querySelector('[data-tlr]');if(rb)rb.onclick=tlReset;
}

function heroStatsInto(h){
  const C=CLASSES[SAVE.cls],L=SAVE.lv,g=gearTotals(),A=SAVE.at;
  const E=SAVE.elix||{};
  h.maxhp=Math.round((C.hp*(1+.15*(L-1))+g.hp+ATV.vit*A.vit)*(E.vigor>0?1.2:1));
  h.pow=C.atk*(1+.12*(L-1))+g.atk+atkFromAttrs(A)+(E.forca>0?elixPow():0);
  h.def=C.def+L*.8+g.def+(E.defesa>0?elixDef():0);h.kbG=g.kb||0;h.kdG=g.kd||0;
  h.speed=C.speed*(1+g.spd/100);h.rng=C.rng;h.aspd=C.aspd;h.crit=C.crit+g.crit/100+Math.floor((A.sor||0)/ATV.sorN)*.01;subApply(h);
  h.maxhp=Math.round(h.maxhp*(1+tf('hp')));h.pow*=1+tf('atk');h.def*=1+tf('def');h.speed*=1+tf('spd');h.aspd=h.aspd/(1+tf('aspd'));h.crit+=tf('crit');
}
/* dificuldade: o nível do monstro sobe com a profundidade na floresta (0 na entrada → 1 no fim da estrada) e +5 por zona */
/* curva de dificuldade ajustada por modelo (tools/mmo/balance_fit.py): fácil no início (≈5 s por monstro, ≈7 % da vida por abate) e cada vez mais dura até o endgame (≈13 s e ≈37 %); defesa estilo PoE: def/(def+5·dano), teto 85 % */
const BAL={zoneLv:5,K:{"1":[2.062,1.027],"5":[4.313,2.189],"10":[7.318,6.7],"20":[16.721,15.2],"30":[48.683,37],"40":[180.473,120],"50":[293.679,205],"60":[273.303,325]}};   // multiplicadores [vida, ataque] por nível, calibrados com heróis de equipamento mediano (início) até quase perfeito (endgame)
function balMul(lv,j){const ks=Object.keys(BAL.K).map(Number).sort((a,b)=>a-b);if(lv<=ks[0])return BAL.K[ks[0]][j];if(lv>=ks[ks.length-1]){const e=ks[ks.length-1],q=ks[ks.length-2];return BAL.K[e][j]*Math.pow(BAL.K[e][j]/BAL.K[q][j],(lv-e)/(e-q));}for(let i=0;i<ks.length-1;i++)if(lv<=ks[i+1]){const f=(lv-ks[i])/(ks[i+1]-ks[i]);return Math.exp(Math.log(BAL.K[ks[i]][j])*(1-f)+Math.log(BAL.K[ks[i+1]][j])*f);}}
const mobHpMul=lv=>balMul(lv,0),mobAtkMul=lv=>balMul(lv,1);
function mobLevel(y){const d=ZONE&&ZONE.h?Math.max(0,Math.min(1,1-(y||0)/ZONE.h)):0;return 1+Math.round(d*5)+rint(0,2)+(G.zoneLv-1)*BAL.zoneLv;}
/* ===== ELITES: 1 a 3 modificadores sorteados (mais mods em zonas mais altas) ===== */
const ELMOD={
  veloz:{n:'Veloz',col:'#6ae0ff',d:'ataca e anda mais rápido'},
  brutal:{n:'Brutal',col:'#ff6a4a',d:'dano muito maior'},
  blindado:{n:'Blindado',col:'#b8c4d8',d:'recebe menos dano'},
  fogo:{n:'Imune a Fogo',col:'#ff9a3a',d:'não queima'},
  gelo:{n:'Imune a Gelo',col:'#9fe0ff',d:'não congela nem desacelera'},
  ctrl:{n:'Inabalável',col:'#e8d8ff',d:'imune a atordoar, medo e prender'},
  vampiro:{n:'Vampírico',col:'#e0508a',d:'cura-se ao ferir'},
  espinho:{n:'Espinhoso',col:'#9be06a',d:'reflete parte do dano'},
  explosivo:{n:'Explosivo',col:'#ffb030',d:'explode ao morrer'},
  teleporte:{n:'Teleportador',col:'#c08aff',d:'surge ao seu lado'}
};
const EL_BLUE=['veloz','blindado','fogo','gelo','vampiro','espinho','teleporte'];   /* elite azul: 1 afixo, só os mais fracos */
const EL_P=.07;
function eliteChance(){return EL_P+Math.min(.04,.007*(G.zoneLv-1));}           /* chance de azul */
function eliteGoldChance(){return .03+Math.min(.05,.008*(G.zoneLv-1));}        /* chance de amarelo (mais forte) */
function makeElite(m,tier){
  tier=tier||'blue';const gold=tier==='gold',ids=gold?Object.keys(ELMOD):EL_BLUE,nm=gold?(G.zoneLv<4?2:3):1,got=[];
  while(got.length<nm){const k=pick(ids);if(got.includes(k))continue;if((k==='fogo'&&got.includes('gelo'))||(k==='gelo'&&got.includes('fogo')))continue;got.push(k);}
  m.el=got;m.elite=true;m.tier=tier;m.maxhp=Math.round(m.maxhp*(gold?3.2:1.9));m.pow*=gold?1.25:1.05;m.spdMul=1;m.aspdMul=1;m.take=1;m.imm={};
  for(const k of got){
    if(k==='veloz'){m.spdMul*=1.35;m.aspdMul*=.6;}else if(k==='brutal')m.pow*=1.5;else if(k==='blindado'){m.take*=.65;m.maxhp=Math.round(m.maxhp*1.2);}
    else if(k==='fogo')m.imm.queimadura=1;else if(k==='gelo'){m.imm.gelado=1;m.imm.lento=1;}else if(k==='ctrl'){m.imm.ctrl=1;}
    else if(k==='vampiro')m.vamp=.6;else if(k==='espinho')m.thorn=.14;else if(k==='explosivo')m.boom=1;else if(k==='teleporte')m.tpT=rnd(2,5);
  }
  m.hp=m.maxhp;m.elCol=gold?'#ffd24a':'#6aa8ff';m.baseName=m.name;m.name=m.name+' '+got.map(k=>ELMOD[k].n.replace('Imune a ','')).join(' · ');
  return m;
}
/* FAMÍLIA por zona: cada zona tem um único tipo de inimigo (muda a cada zona); multiplicadores mantêm a força média de antes */
const FAMV={goblin:['goblin','goblin','gobarq','xama','goblin'],esq:['esq','esq','esqmago','esqfogo','esqgelo'],javali:['javali'],rato:['rato']};
const varOf=(z,i)=>{const a=FAMV[famOf(z)];return a[((i%a.length)+a.length)%a.length];};
const FAMS=['goblin','esq','javali','rato'],FAMM={goblin:[1.13,1.1,1.24],esq:[.85,.86,.83],javali:[.71,.77,.68],rato:[2.1,1.9,2]};
const famOf=z=>FAMS[(Math.max(1,z)-1)%FAMS.length];
function mkMob(kind,x,y,sp){
  const T=MOBS[kind],lv=mobLevel(y),m={kind:'mob',type:kind,T,x,y,sx:x,sy:y,lv,row:1,state:'idle',animT:rnd(0,5),act:null,cd:rnd(.5,1.2),kvx:0,kvy:0,stun:0,sts:null,flash:0,dead:false,deadT:0,respawn:0,sp,wx:x,wy:y,wt:rnd(0,3)};
  const FM=FAMM[T.fam||kind]||[1,1,1];m.maxhp=Math.round(T.hp*FM[0]*mobHpMul(lv));m.hp=m.maxhp;m.pow=T.atk*FM[1]*mobAtkMul(lv);m.def=lv*1.3;m.name=T.nome;{const q=Math.random();if(q<eliteGoldChance())makeElite(m,'gold');else if(q<eliteGoldChance()+eliteChance())makeElite(m,'blue');}return m;
}

function collide(e,r=6){
  for(const s of ZONE.solids){const dx=e.x-s.x,dy=e.y-s.y;if(Math.abs(dx)>26||Math.abs(dy)>26)continue;const d=Math.hypot(dx,dy),R=s.r+r;if(d<R&&d>0.01){e.x=s.x+dx/d*R;e.y=s.y+dy/d*R;}}
  e.x=clamp(e.x,14,ZONE.w-14);e.y=clamp(e.y,ZONE.ymin||50,ZONE.h-(ZONE.room?4:10));
  if(isWater(e.x,e.y)||isWater(e.x,e.y+4)){
    if(e._lx!==undefined){const lx=e._lx,ly=e._ly;
      if(!isWater(e.x,ly)&&!isWater(e.x,ly+4))e.y=ly;else if(!isWater(lx,e.y)&&!isWater(lx,e.y+4))e.x=lx;else{e.x=lx;e.y=ly;}}
  }
  if(!isWater(e.x,e.y)&&!isWater(e.x,e.y+4)){e._lx=e.x;e._ly=e.y;}
}

  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d<1)return 0;
  if(G.t-(e._lt||-9)>.3){e._sx=e.x;e._sy=e.y;e._sc=0;}   // voltou a andar depois de uma pausa
  e._lt=G.t;e._sc=(e._sc||0)+dt;
  if(e._sc>=.5){const mv=Math.hypot(e.x-e._sx,e.y-e._sy);
    if(mv<sp*.5*.3&&!e.detour&&d>16){const px=-dy/d,py=dx/d,sd=Math.random()<.5?1:-1;e.detour={x:e.x+px*sd*80+dx/d*30,y:e.y+py*sd*80+dy/d*30,t:1.3};}
    e._sx=e.x;e._sy=e.y;e._sc=0;}
  const s=Math.min(d,sp*dt);e.x+=dx/d*s;e.y+=dy/d*s;e.row=dir4(dx,dy);return s;
}

  for(const m of allFoes()){if(m.act&&!m.act.done&&!m.act.skill&&m.act.t>=.12&&m.act.t<m.act.dur*.5&&dist(m,h)<=m.T.rng*1.7&&Math.random()<.9){if(heroDodge(h,h.x-m.x,h.y-m.y,'melee'))return;}}}
function heroAvoidZone(h,dt){const dz=G.zones.find(z=>!z.done&&(z.warn-z.t)<.8&&zoneContains(z,h,8));if(!dz)return false;
  const v=zoneExit(dz,h);moveTo(h,h.x+v.x*60,h.y+v.y*60,hSpd(h),dt);h.row=dir4(v.x,v.y);h.state='walk';h.animT+=dt*(h.speed/70);collide(h);return true;}

 javali:[{id:'charge',hp:1,cd:6.5,warn:.75,w:30,len:140,mult:1.7,min:50,max:150}],
 esq:[{id:'slam',hp:1,cd:7.5,warn:.9,r:36,mult:1.8,max:70}]};
function mobSkillStart(m,d,dt){const list=MSK[m.kind==='boss'?'boss':m.type];if(!list)return false;
  m.sk=m.sk||{};for(const k in m.sk)m.sk[k]-=dt;
  const frac=m.hp/m.maxhp,h=G.hero;let pick=null,wsum=0;
  for(const s of list){if(frac>s.hp)continue;if((m.sk[s.id]||0)>0)continue;if(s.min&&d<s.min)continue;if(s.max&&d>s.max)continue;const w=s.wt||1;wsum+=w;if(Math.random()*wsum<w)pick=s;}
  if(!pick||Math.random()>dt*1.6)return false;
  m.sk[pick.id]=pick.cd*rnd(.9,1.15);m.row=dir4(h.x-m.x,h.y-m.y);m.act={t:0,dur:pick.warn+.4,done:true,skill:true};m.state='atk';
  if(pick.id==='charge'){const a=Math.atan2(h.y-m.y,h.x-m.x);addZone({shape:'line',x:m.x,y:m.y,a,w:pick.w,len:pick.len,warn:pick.warn,mult:pick.mult,st:pick.st,src:m,shake:.35});}
  else if(pick.id==='roar')addZone({shape:'circle',x:m.x,y:m.y,r:pick.r,warn:pick.warn,mult:pick.mult,st:pick.st,src:m,shake:.5});
  else addZone({shape:'circle',x:h.x,y:h.y,r:pick.r,warn:pick.warn,mult:pick.mult,st:pick.st,src:m});
  return true;}
function hSpd(h){if(stHas(h,'preso')||stHas(h,'atordoado'))return 0;return h.speed*(h.buff&&h.buff.t>0?1+h.buff.spd:1)*stMul(h,'spd');}
function updateHero(dt){
  const h=G.hero;
  h.flash=Math.max(0,h.flash-dt);for(let i=0;i<14;i++)if(h.sk[i]>0)h.sk[i]=Math.max(0,h.sk[i]-dt);
  if(h.kvx||h.kvy){h.x+=h.kvx*dt;h.y+=h.kvy*dt;const f=Math.exp(-11*dt);h.kvx*=f;h.kvy*=f;if(Math.abs(h.kvx)+Math.abs(h.kvy)<4)h.kvx=h.kvy=0;collide(h);}
  if(h.state==='ko'){h.koT-=dt;if(h.koT<=0)heroRevive();return;}
  h.cd-=dt;h.combat=Math.max(0,h.combat-dt);h.potCd=Math.max(0,h.potCd-dt);if(h.dcd>0)h.dcd-=dt;if(h.inv>0)h.inv-=dt;
  if(h.sts){stUpdate(h,dt);if(h.state==='ko')return;if(stHas(h,'atordoado')){h.state='idle';h.act=null;return;}
    if(stHas(h,'medo')){const fm=nearestMob(h,300);if(fm){moveTo(h,h.x+(h.x-fm.x),h.y+(h.y-fm.y),h.speed*.9,dt);h.row=dir4(h.x-fm.x,h.y-fm.y);h.state='walk';h.animT+=dt*(h.speed/70);collide(h);return;}}}
  if(h.buff){h.buff.t-=dt;if(Math.random()<dt*16)VF.pt(h.x+rnd(-11,11),h.y-rnd(0,8),{vy:-rnd(20,45),life:.6,col:h.buff.col||'#ffb050',sz:2});if(h.buff.t<=0)h.buff=null;}
  if(h.shieldT>0){h.shieldT-=dt;if(h.shieldT<=0)h.shield=0;}
  {const ap=SAVE.apot==null?.35:SAVE.apot;if(ap>0&&h.hp<h.maxhp*ap&&(SAVE.potions>0||SAVE.potL>0)&&h.potCd<=0&&G.auto)usePotion(false);}
  if(G.on&&!h.dod)heroDangerCheck(h);
  if(h.dod){updateDodge(h,dt);return;}
  if(h.combat<=0&&h.hp<h.maxhp){h.hp=Math.min(h.maxhp,h.hp+h.maxhp*.025*dt);}
  if(h.act){h.act.t+=dt;h.state='atk';
    {const a=h.act;if(a.cast&&a.ch>0&&a.t<a.ch+.3&&Math.random()<dt*45){const ang=Math.random()*6.283,r=rnd(24,38);VF.pt(h.x+Math.cos(ang)*r,h.y-14+Math.sin(ang)*r*.6,{vx:-Math.cos(ang)*r*2.5,vy:-Math.sin(ang)*r*1.5,life:.38,col:CHCOL[h.cls],sz:2.2});}}
    if(!h.act.done&&h.act.t>=h.act.dur*h.act.hit){h.act.done=true;heroHitMoment(h);}
    if(h.act.t>=h.act.dur){h.act=null;h.state='idle';}
    return;}
  if(G.zones.length&&!h.act&&heroAvoidZone(h,dt))return;
  let tgt=null;const bs=G.boss;const jm=!G.auto&&G.joy.m>0;
  if(G.auto){tgt=nearestMob(h,260);}
  else tgt=nearestMob(h,h.rng*1.05);
  h.tg=tgt;
  let moved=0;
  if(jm){moved=moveTo(h,h.x+G.joy.x*60,h.y+G.joy.y*60,hSpd(h)*Math.max(.35,G.joy.m),dt);h.row=dir4(G.joy.x,G.joy.y);}
  if(!G.auto&&G.castReq>=0&&h.cd<=0)manualCast();
  if(tgt&&!jm){
    const d=dist(h,tgt),want=h.rng*(h.rng>60?.9:.8);
    if(G.auto&&h.rng>100&&d<h.rng*.55&&h.cd>.15){const k=Math.max(1,d);moved=moveTo(h,h.x+(h.x-tgt.x)/k*50,h.y+(h.y-tgt.y)/k*50,hSpd(h)*.95,dt);h.row=dir4(tgt.x-h.x,tgt.y-h.y);}
    else if(d>want&&(G.auto||G.wp)){ if(G.auto)moved=moveTo(h,tgt.x,tgt.y,hSpd(h),dt);}
    else if(d<=h.rng&&h.cd<=0){startHeroAttack(h,tgt);}
    else if(d<=h.rng){h.row=dir4(tgt.x-h.x,tgt.y-h.y);}
  }
  // loot: pegar o que está perto
  updateLoot(dt);
  if(!moved&&G.wp){moved=moveTo(h,G.wp.x,G.wp.y,hSpd(h),dt);if(dist(h,G.wp)<4)G.wp=null;}
  else if(!moved&&!tgt&&G.auto){ // explorar: ir até o monstro vivo mais próximo ou vagar
    const m=(G.phase==='farm'||G.phase==='boss')?nearestMob(h,9999):null;
    if(m)moved=moveTo(h,m.x,m.y,hSpd(h),dt);
    else{G.wpT-=dt;if(!G.wanderP||G.wpT<=0||dist(h,G.wanderP)<8){G.wanderP={x:ZONE.spawns[rint(0,ZONE.spawns.length-1)][0],y:ZONE.spawns[rint(0,ZONE.spawns.length-1)][1]};G.wpT=6;}moved=moveTo(h,G.wanderP.x,G.wanderP.y,hSpd(h)*.7,dt);}
  }
  if(moved){h.state='walk';h.animT+=dt*(h.speed/70);collide(h);stepFx(h,dt);if(Math.floor(h.animT*2.6)!==h.lastStep){h.lastStep=Math.floor(h.animT*2.6);}}else h.state='idle';
}
function updateMob(m,dt){
  const h=G.hero;
  if(m.dead){m.deadT+=dt;if(m.kvx||m.kvy){m.x+=m.kvx*dt;m.y+=m.kvy*dt;const f=Math.exp(-11*dt);m.kvx*=f;m.kvy*=f;}
    if(m.minion){if(m.deadT>2.2)m.gone=1;return;}
    if(m.kind==='mob'){m.respawn-=dt;if(m.respawn<=0&&(G.phase==='farm'||G.phase==='boss')){const n=mkMob(m.type,m.sx,m.sy,m.sp);Object.assign(m,n);}}return;}
  m.flash=Math.max(0,m.flash-dt);
  if(m.kbT>0)m.kbT-=dt;if(m.vuln>0)m.vuln-=dt;if(m.sts){stUpdate(m,dt);if(m.dead)return;}
  if(m.kvx||m.kvy){m.x+=m.kvx*dt;m.y+=m.kvy*dt;const f=Math.exp(-11*dt);m.kvx*=f;m.kvy*=f;if(Math.abs(m.kvx)+Math.abs(m.kvy)<4)m.kvx=m.kvy=0;collide(m);m.wx=m.x;m.wy=m.y;}
  if(m.dash){const k=m.dash,dp=Math.min(dt/k.dur,1-k.p);m.x+=k.dx*dp;m.y+=k.dy*dp;k.p+=dp;collide(m,6);m.wx=m.x;m.wy=m.y;m.state='walk';m.animT+=dt*10;if(Math.random()<dt*40)VF.pt(m.x+rnd(-8,8),m.y-rnd(0,4),{vy:-rnd(6,14),life:.4,col:'#a89878',sz:2.4,add:false});if(k.p>=1)m.dash=null;return;}
  if(m.stun>0){m.stun-=dt;m.state='hurt';return;}
  m.cd-=dt;const T=m.T,d=dist(m,h),ko=h.state==='ko';
  if(m.tpT!==undefined&&!ko&&d<T.aggro&&G.phase!=='end'){m.tpT-=dt;if(m.tpT<=0&&d>70&&!m.act){m.tpT=rnd(5,8);const a=Math.random()*6.283,f=freeSpot(h.x+Math.cos(a)*34,h.y+Math.sin(a)*24);VF.glow(m.x,m.y-14,30,'#c08aff',.4);VF.burst(m.x,m.y-10,12,['#c08aff','#fff'],{s0:30,s1:90});m.x=f[0];m.y=f[1];m.wx=m.x;m.wy=m.y;VF.glow(m.x,m.y-14,34,'#c08aff',.45);VF.wave(m.x,m.y,40,'#c08aff',.4,3);m.cd=Math.min(m.cd,.35);}}
  if(m.act){m.act.t+=dt;m.state='atk';
    if(!m.act.done&&m.act.t>=m.act.dur*(m.T.fire||.5)){m.act.done=true;mobAttackMoment(m);}
    if(m.act.t>=m.act.dur){m.act=null;m.state='idle';}return;}
  if(m.kind==='boss'){
    if(G.phase!=='boss'){m.state='idle';return;}
  }
  const aggro=m.hunt?520:(m.aggro||(m.kind==='boss'?T.aggro*2:T.aggro));
  if(!ko&&d<aggro&&(m.kind==='boss'||G.phase==='farm'||G.phase==='boss')&&mobSkillStart(m,d,dt))return;
  if(!ko&&d<aggro&&(m.kind==='boss'||G.phase==='farm'||G.phase==='boss')){
    m.row=dir4(h.x-m.x,h.y-m.y);
    if(m.sts&&stHas(m,'medo')){moveTo(m,m.x+(m.x-h.x),m.y+(m.y-h.y),T.speed*(m.spdMul||1)*stMul(m,'spd')*1.1,dt);m.state='walk';m.animT+=dt*(T.speed/46);collide(m,6);m.wx=m.x;m.wy=m.y;}
    else if(T.ranged&&d<50&&!(m.sts&&stHas(m,'preso'))){moveTo(m,m.x+(m.x-h.x),m.y+(m.y-h.y),T.speed*(m.spdMul||1)*stMul(m,'spd')*.9,dt);m.state='walk';m.animT+=dt*(T.speed/46);collide(m,6);m.wx=m.x;m.wy=m.y;if(m.cd<=0){m.act={t:0,dur:T.dur||.6,done:false};m.cd=T.aspd*(m.aspdMul||1);m.row=dir4(h.x-m.x,h.y-m.y);}}
    else if(d>T.rng*.85){if(m.sts&&stHas(m,'preso'))m.state='idle';else{const s=moveTo(m,h.x,h.y,T.speed*(m.spdMul||1)*stMul(m,'spd'),dt);m.state='walk';m.animT+=dt*(T.speed/46);collide(m,6);m.wx=m.x;m.wy=m.y;}}
    else{m.state='idle';if(m.cd<=0){m.act={t:0,dur:T.dur||.6,done:false};m.cd=T.aspd*(m.aspdMul||1);m.row=dir4(h.x-m.x,h.y-m.y);}}
  }else{
    m.wt-=dt;if(m.wt<=0){m.wt=rnd(1.5,4);m.wvx=rnd(-1,1)*14;m.wvy=rnd(-1,1)*10;if(Math.random()<.4){m.wvx=m.wvy=0;}}

    else m.state='idle';

    gsap.timeline({delay:.02*i/sp}).timeScale(sp).to(p,{a:.85,duration:.08},0).to(p,{x:x+Math.cos(a)*d1,y:y+Math.sin(a)*d1*.5-gxR(2,8),s:p.s*gxR(1.7,2.4),duration:.7,ease:'power3.out'},0).to(p,{a:0,duration:.5,ease:'power1.in'},.35).call(()=>GX.rm(p));}

    if(t&&t.kind==='npc')G.wp=t.ap?{x:t.ap[0],y:t.ap[1],target:t}:{x:t.x,y:t.y+8,target:t};else if(t)G.wp={x:ZONE.portal.stand[0],y:ZONE.portal.stand[1],target:t};else G.wp={x:lx,y:ly};
    fx();return;
  }
  /* na dungeon o modo manual usa o joystick */
});
