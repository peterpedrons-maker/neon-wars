<style>

<script>/*THREE*/</script>
<script>const DATA=/*DATA*/;</script>
<script>
(async()=>{
const T=THREE,$=id=>document.getElementById(id);
const R=new T.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.0;
const S=new T.Scene();const cam=new T.PerspectiveCamera(32,1,.5,140);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const U=1.3/46,wx=p=>(p-450)*U,wz=p=>p*U,TILT=47*Math.PI/180;
const loader=new T.TextureLoader();
function load(src,px){return new Promise(ok=>loader.load(src,t=>{if(px){t.magFilter=T.NearestFilter;t.minFilter=T.LinearMipmapLinearFilter;}t.encoding=T.sRGBEncoding;ok(t);}));}
const [gTex,aTex,sH,sG,sP,sL,sB]=await Promise.all([load(DATA.img.ground,1),load(DATA.img.atlas,1),load(DATA.img.hw,1),load(DATA.img.gw,1),load(DATA.img.pw,1),load(DATA.img.lw,1),load(DATA.img.bw,1)]);
[sH,sG,sP,sL,sB].forEach(t=>{t.generateMipmaps=false;t.minFilter=T.NearestFilter;});
// ---------- luz do dia ----------
const hemi=new T.HemisphereLight(0xcfe3ff,0x4a5a3a,.8),sun=new T.DirectionalLight(0xfff0d0,1.0);sun.position.set(-8,14,10);S.add(hemi,sun);
const DAY={dia:{bg:0x9fc4e6,fog:0xa9c7df,fd:.012,hemi:.85,hc:0xcfe3ff,sun:1.15,sc:0xfff0d0,exp:1.0,night:0},tarde:{bg:0xe6a468,fog:0xd89a6a,fd:.016,hemi:.55,hc:0xffc89a,sun:.85,sc:0xff9a5a,exp:1.0,night:.45},noite:{bg:0x070b1a,fog:0x0a1020,fd:.02,hemi:.28,hc:0x6a82c8,sun:.18,sc:0x8aa0ff,exp:1.15,night:1}};
let tod='dia',todK=0,night=0,cur={...DAY.dia};const mix=(a,b,t)=>a+(b-a)*t;
S.background=new T.Color(DAY.dia.bg);S.fog=new T.FogExp2(DAY.dia.fog,DAY.dia.fd);
function applyTod(dt){const D=DAY[tod],k=Math.min(1,dt*1.6);cur.hemi=mix(cur.hemi,D.hemi,k);cur.sun=mix(cur.sun,D.sun,k);cur.fd=mix(cur.fd,D.fd,k);cur.exp=mix(cur.exp,D.exp,k);night=mix(night,D.night,k);
  const c=new T.Color(cur.bgc||DAY.dia.bg);c.lerp(new T.Color(D.bg),k);cur.bgc=c.getHex();S.background.copy(c);S.fog.color.copy(c);S.fog.density=cur.fd;
  hemi.intensity=cur.hemi;hemi.color.lerp(new T.Color(D.hc),k);sun.intensity=cur.sun;sun.color.lerp(new T.Color(D.sc),k);R.toneMappingExposure=cur.exp;}
$('tb').onclick=()=>{tod=tod==='dia'?'tarde':tod==='tarde'?'noite':'dia';$('tb').textContent='Hora: '+tod;};
// ---------- chão ----------
const GW=900*U,GH=1260*U;
const ground=new T.Mesh(new T.PlaneGeometry(GW,GH),new T.MeshStandardMaterial({map:gTex,bumpMap:gTex,bumpScale:1.2,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.set(0,0,GH/2);S.add(ground);
const far=new T.Mesh(new T.PlaneGeometry(260,260),new T.MeshStandardMaterial({color:0x2c5a22,roughness:1}));far.rotation.x=-Math.PI/2;far.position.set(0,-.02,GH/2);S.add(far);
// ---------- props do atlas (quadros fundidos) ----------
const AW=aTex.image.width,AH=aTex.image.height;
function mergedQuads(items,flat){
  const pos=[],uv=[],idx=[];let n=0;
  for(const [id,px,py] of items){const a=DATA.atlas[id];if(!a)continue;const [sx,sy,sw,sh,ax,ay]=a,X=wx(px),Z=wz(py);
    const cs=[[-ax,ay],[sw-ax,ay],[sw-ax,ay-sh],[-ax,ay-sh]];   // x p/ direita, y p/ cima (px)
    cs.forEach(([cx,cy],i)=>{
      if(flat)pos.push(X+cx*U,.02+(rnd()*.002),Z-cy*U);
      else pos.push(X+cx*U,Math.max(0,cy*U*Math.cos(TILT))+(cy<0?0:0),Z-cy*U*Math.sin(TILT));
      const ux=[0,1,1,0][i],vy=[0,0,1,1][i];uv.push((sx+ux*sw)/AW,1-(sy+vy*sh)/AH);});
    idx.push(n,n+1,n+2,n,n+2,n+3);n+=4;}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  const m=new T.MeshLambertMaterial({map:aTex,alphaTest:.4,side:T.DoubleSide,emissive:0xffffff,emissiveMap:aTex,emissiveIntensity:.0});
  const me=new T.Mesh(g,m);S.add(me);return me;}
const stand=[],flats=[];const solids=[];const lampsP=[];
for(const [t,id,x,y,col] of DATA.props){const a=DATA.atlas[id];if(t==='flat'){flats.push([id,x,y]);continue;}
  if(id.startsWith('b_'))continue;stand.push([id,x,y]);
  if(a&&a[3]>=150&&a[2]>=90)for(const c of [[0,-2,8]])solids.push([wx(x),wz(y),c[2]*U]);
  else if(col)for(const c of col)solids.push([wx(x+c[0]),wz(y+c[1]),c[2]*U]);
  if(a&&a[2]<=24&&a[3]>=80)lampsP.push([wx(x),2.3,wz(y)]);}
const meshFlat=mergedQuads(flats,true);meshFlat.material.polygonOffset=true;meshFlat.material.polygonOffsetFactor=-2;
const meshStand=mergedQuads(stand,false);
// sombras suaves sob as árvores
function blobTex(a=.55){const c=cvs(64,64),x=c.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,30);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(c);}
const BT=blobTex();
{const pos=[],uv=[],idx=[];let n=0;for(const [id,px,py] of stand){const a=DATA.atlas[id];if(!a||a[3]<60)continue;const X=wx(px),Z=wz(py),rw=Math.min(a[2],100)*U*.55,rd=rw*.5;
  [[-rw,-rd],[rw,-rd],[rw,rd],[-rw,rd]].forEach(([cx,cz],i)=>{pos.push(X+cx,.03,Z+cz+rd*.6);uv.push([0,1,1,0][i],[0,0,1,1][i]);});idx.push(n,n+1,n+2,n,n+2,n+3);n+=4;}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setIndex(idx);
  S.add(new T.Mesh(g,new T.MeshBasicMaterial({map:BT,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-3})));}
// ---------- casas em 3D ----------
const HC={b_fer:{name:'Ferreiro',roof:'#2d3540',wall:'#b99a74',glow:'#ff8a2a',smoke:1},b_mer:{name:'Mercador',roof:'#7a3b29',wall:'#c4a58a',glow:'#ffd27a'},b_mes:{name:'Mestre de Classe',roof:'#34455a',wall:'#c9b8a8',glow:'#ffd27a'},b_alq:{name:'Alquimista',roof:'#355868',wall:'#a99aa6',glow:'#9affc0',smoke:1},b_lei:{name:'Leilão',roof:'#562729',wall:'#b98f6c',glow:'#ffd27a'},b_cof:{name:'Cofre',roof:'#364b42',wall:'#6a6668',glow:'#8ac8ff'}};
const winMats=[],houses=[];
function facade(cfg){const W=512,H=384,c=cvs(W,H),x=c.getContext('2d'),e=cvs(W,H),y=e.getContext('2d');
  x.fillStyle=cfg.wall;x.fillRect(0,0,W,H);for(let i=0;i<500;i++){x.fillStyle=`rgba(${rnd()<.5?'0,0,0':'255,255,255'},${.03+rnd()*.05})`;x.fillRect(rnd()*W,rnd()*H,2+rnd()*6,2+rnd()*3);}
  y.fillStyle='#000';y.fillRect(0,0,W,H);
  const stoneH=70;x.fillStyle='#6a6e72';x.fillRect(0,H-stoneH,W,stoneH);for(let j=0;j<3;j++)for(let i=0;i<10;i++){x.fillStyle=`hsl(210,6%,${34+rnd()*14}%)`;x.fillRect(i*52+(j%2)*26+2,H-stoneH+j*23+2,48,19);}
  x.fillStyle='#3a2616';const bw=14;x.fillRect(0,0,W,bw);x.fillRect(0,H-stoneH-bw/2,W,bw);x.fillRect(0,H*.38,W,bw);
  for(const px of[0,W/4,W/2,3*W/4,W-bw])x.fillRect(px,0,bw,H-stoneH);
  x.strokeStyle='#3a2616';x.lineWidth=10;x.beginPath();x.moveTo(0,H*.38);x.lineTo(W/4,0);x.moveTo(W,H*.38);x.lineTo(3*W/4,0);x.stroke();
  // porta em arco
  const dx=W/2-44,dy=H-stoneH-130,dw=88,dh=130+stoneH;
  x.fillStyle='#2c3034';x.beginPath();x.moveTo(dx-8,H);x.lineTo(dx-8,dy+30);x.arc(W/2,dy+30,dw/2+8,Math.PI,0);x.lineTo(dx+dw+8,H);x.fill();
  x.fillStyle='#4a2d18';x.beginPath();x.moveTo(dx,H);x.lineTo(dx,dy+30);x.arc(W/2,dy+30,dw/2,Math.PI,0);x.lineTo(dx+dw,H);x.fill();
  x.fillStyle='rgba(0,0,0,.35)';for(let i=1;i<5;i++)x.fillRect(dx+i*dw/5,dy+8,2,dh);x.fillStyle='#1a1c20';x.fillRect(dx,dy+50,dw,8);x.fillRect(dx,dy+110,dw,8);x.fillStyle='#d9a84a';x.fillRect(W/2-3,dy+70,6,10);
  // janelas com venezianas
  for(const wxp of[70,W-70-82]){x.fillStyle='#2c1a0e';x.fillRect(wxp-6,H*.5-6,94,84);x.fillStyle='#1a2230';x.fillRect(wxp,H*.5,82,72);x.fillStyle='#5a3a1e';x.fillRect(wxp-14,H*.5,14,72);x.fillRect(wxp+82,H*.5,14,72);
    y.fillStyle=cfg.glow;y.fillRect(wxp,H*.5,82,72);x.fillStyle=cfg.glow;x.globalAlpha=.18;x.fillRect(wxp,H*.5,82,72);x.globalAlpha=1;x.fillStyle='#2c1a0e';x.fillRect(wxp+39,H*.5,4,72);x.fillRect(wxp,H*.5+34,82,4);y.fillStyle='#000';y.fillRect(wxp+39,H*.5,4,72);y.fillRect(wxp,H*.5+34,82,4);}
  const t=new T.CanvasTexture(c),et=new T.CanvasTexture(e);t.encoding=T.sRGBEncoding;et.encoding=T.sRGBEncoding;t.anisotropy=8;return [t,et];}
function sideTex(cfg){const c=cvs(256,256),x=c.getContext('2d');x.fillStyle=cfg.wall;x.fillRect(0,0,256,256);x.fillStyle='#3a2616';x.fillRect(0,0,256,10);x.fillRect(0,100,256,10);for(const p of[0,120,246])x.fillRect(p,0,10,256);x.fillStyle='#6a6e72';x.fillRect(0,196,256,60);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t;}
function roofTex(col){const c=cvs(256,256),x=c.getContext('2d');x.fillStyle=col;x.fillRect(0,0,256,256);for(let j=0;j<16;j++)for(let i=-1;i<9;i++){const px=i*32+(j%2)*16,py=j*16;x.fillStyle=`rgba(${rnd()<.5?'0,0,0':'255,255,255'},${.05+rnd()*.12})`;x.fillRect(px+1,py+1,30,14);x.fillStyle='rgba(0,0,0,.3)';x.fillRect(px,py+14,32,2);}
  const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(3,2);t.encoding=T.sRGBEncoding;return t;}
function sign(name){const c=cvs(256,96),x=c.getContext('2d');x.fillStyle='#3a2210';x.fillRect(0,0,256,96);x.fillStyle='#5a3a1e';x.fillRect(5,5,246,86);x.fillStyle='#f0d890';x.font='700 30px Georgia';x.textAlign='center';x.textBaseline='middle';x.fillText(name,128,50,230);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t;}
const chimneys=[];
function house(id,px,py){const cfg=HC[id];const g=new T.Group();g.position.set(wx(px),0,wz(py));
  const w=5.3,d=4.5,h=2.9,[ft,fe]=facade(cfg),st=sideTex(cfg);
  const ws=new T.MeshStandardMaterial({map:st,roughness:.9}),wf=new T.MeshStandardMaterial({map:ft,emissiveMap:fe,emissive:0xffffff,emissiveIntensity:.25,roughness:.9});winMats.push(wf);
  const body=new T.Mesh(new T.BoxGeometry(w,h,d),[ws,ws,new T.MeshStandardMaterial({color:0x444}),new T.MeshStandardMaterial({color:0x222}),wf,ws]);body.position.set(0,h/2,-d/2);g.add(body);
  const rt=roofTex(cfg.roof),rm=new T.MeshStandardMaterial({map:rt,roughness:.85});
  const roof=new T.Mesh(new T.CylinderGeometry(.9,Math.hypot(w/2+.5,d/2+.5),2.3,4,1),rm);roof.rotation.y=Math.PI/4;roof.scale.set((w+1)/(d+1)*.95,1,1);
  // pirâmide (telhado de quatro águas): ajusta pela raiz para cobrir w x d
  roof.scale.set(1,1,1);const rg=roof.geometry;rg.dispose();
  const hip=new T.BufferGeometry(),a=w/2+.45,b=d/2+.45,rh=1.45,ra=Math.min(a,b)*.0+1.0,v=[[-a,0,b],[a,0,b],[a,0,-b],[-a,0,-b],[-ra,rh,-.1],[ra,rh,-.1]];
  const f=[[0,1,5],[0,5,4],[1,2,5],[2,3,4],[2,4,5],[3,0,4]];const P=[],UV=[];
  const tri=(i,j,k)=>{[i,j,k].forEach(q=>{P.push(...v[q]);});UV.push(0,0,1,0,.5,1);};f.forEach(t=>tri(...t));
  hip.setAttribute('position',new T.Float32BufferAttribute(P,3));hip.setAttribute('uv',new T.Float32BufferAttribute(UV,2));hip.computeVertexNormals();
  const rf=new T.Mesh(hip,new T.MeshStandardMaterial({map:rt,roughness:.85,side:T.DoubleSide}));rf.position.set(0,h,-d/2);g.add(rf);
  const rim=new T.Mesh(new T.BoxGeometry(w+1,.14,d+1),new T.MeshStandardMaterial({color:0x2a1a0e,roughness:.9}));rim.position.set(0,h+.04,-d/2);g.add(rim);
  const ch=new T.Mesh(new T.BoxGeometry(.7,1.2,.7),new T.MeshStandardMaterial({color:0x3b3b40,roughness:.9}));ch.position.set(w*.28,h+1.1,-d*.6);g.add(ch);
  if(cfg.smoke)chimneys.push({x:g.position.x+w*.28,y:h+1.8,z:g.position.z-d*.6});
  const sg=new T.Mesh(new T.PlaneGeometry(1.5,.56),new T.MeshBasicMaterial({map:sign(cfg.name),side:T.DoubleSide}));sg.position.set(0,h*.72,.35);sg.rotation.x=-.05;g.add(sg);
  const br=new T.Mesh(new T.BoxGeometry(.06,.06,.6),new T.MeshStandardMaterial({color:0x222}));br.position.set(0,h*.72+.34,.1);g.add(br);
  for(let i=0;i<2;i++){const s=new T.Mesh(new T.BoxGeometry(1.6-i*.3,.12,.5),new T.MeshStandardMaterial({color:0x5a5d62,roughness:.9}));s.position.set(0,.06+i*.12,.28+(1-i)*.25);g.add(s);}
  const mats=[];g.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(!mats.includes(m))mats.push(m);});}});
  g.userData={mats,o:1,box:new T.Box3(new T.Vector3(g.position.x-w/2-.7,0,g.position.z-d-.7),new T.Vector3(g.position.x+w/2+.7,h+1.7,g.position.z+.5))};houses.push(g);
  S.add(g);solids.push({aabb:[g.position.x-w/2-.1,g.position.z-d,g.position.x+w/2+.1,g.position.z+.05]});return g;}
const houseDoors={};
for(const [t,id,x,y] of DATA.props){if(id.startsWith('b_')){house(id,x,y);}}
// ---------- portal (arco de pedra + vórtice) ----------
const portal=new T.Group();portal.position.set(wx(450),0,wz(129));S.add(portal);
const stoneM=new T.MeshStandardMaterial({color:0x3e4247,roughness:.95});
for(const s of[-1,1]){const p=new T.Mesh(new T.BoxGeometry(.9,3.4,.9),stoneM);p.position.set(s*1.75,1.7,0);portal.add(p);const b=new T.Mesh(new T.BoxGeometry(1.2,.35,1.2),stoneM);b.position.set(s*1.75,.18,0);portal.add(b);const c=new T.Mesh(new T.BoxGeometry(1.1,.3,1.1),stoneM);c.position.set(s*1.75,3.5,0);portal.add(c);}
const arc=new T.Mesh(new T.TorusGeometry(1.75,.42,12,36,Math.PI),stoneM);arc.position.set(0,3.4,0);portal.add(arc);
const vm=new T.ShaderMaterial({transparent:true,depthWrite:false,blending:T.AdditiveBlending,uniforms:{t:{value:0}},vertexShader:'varying vec2 u;void main(){u=uv*2.-1.;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec2 u;uniform float t;void main(){float r=length(u*vec2(1.,.85));if(r>1.)discard;float a=atan(u.y,u.x);float s=sin(a*4.+r*9.-t*3.)*.5+.5;float s2=sin(a*3.-r*13.+t*2.2)*.5+.5;vec3 c=mix(vec3(.25,.1,.6),vec3(.5,.85,1.),s*s2);float f=smoothstep(1.,.75,r);gl_FragColor=vec4(c*(.5+.9*s)*f+vec3(.9,.8,1.)*pow(max(0.,1.-r*1.6),2.),f*.95);}'});

// ---------- fontes de luz (lampiões, fogos): pool de 7 luzes ----------
const sources=[];for(const [x,y,z] of lampsP)sources.push({p:new T.Vector3(x,y,z),c:0xffc878,k:1.5,night:1});

const pool=[];for(let i=0;i<7;i++){const L=new T.PointLight(0xffc878,0,11,2);S.add(L);pool.push(L);}
const flameTex=(()=>{const c=cvs(64,64),x=c.getContext('2d'),g=x.createRadialGradient(32,32,1,32,32,30);g.addColorStop(0,'rgba(255,240,170,1)');g.addColorStop(.3,'rgba(255,160,60,.8)');g.addColorStop(1,'rgba(255,90,10,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(c);})();

// fumaça
const smoke=[];for(const ch of chimneys)for(let i=0;i<6;i++){const sp=new T.Sprite(new T.SpriteMaterial({map:blobTex(.5),transparent:true,depthWrite:false,color:0xcfcfd4,opacity:0}));S.add(sp);smoke.push({sp,x:ch.x,y:ch.y,z:ch.z,t:i/6*4});}
// ---------- personagens ----------
const PX=1.3/46;
function setFrame(tex,c,r,cols=9,rows=4){tex.repeat.set(1/cols,1/rows);tex.offset.set(c/cols,1-(r+1)/rows);}
class Actor{constructor(tex,tint){this.root=new T.Group();S.add(this.root);this.tex=tex.clone();this.tex.needsUpdate=true;setFrame(this.tex,0,2);
  const g=new T.PlaneGeometry(64*PX,64*PX);g.translate((32-28)*PX,(61-32)*PX,0);
  this.mat=new T.MeshLambertMaterial({map:this.tex,transparent:true,alphaTest:.35,emissive:0xffffff,emissiveMap:this.tex,emissiveIntensity:.3,color:tint||0xffffff,side:T.DoubleSide});
  this.me=new T.Mesh(g,this.mat);this.root.add(this.me);const bl=new T.Mesh(new T.PlaneGeometry(1.3,.8),new T.MeshBasicMaterial({map:BT,transparent:true,depthWrite:false}));bl.rotation.x=-Math.PI/2;bl.position.y=.02;this.root.add(bl);}
  set(c,r){setFrame(this.tex,c,r);}face(){this.me.quaternion.copy(cam.quaternion);}}
const hero=new Actor(sH);hero.x=wx(450);hero.z=wz(735);hero.row=2;
const NPC=[
 {nm:'Guarda do Portal',tex:sG,x:450,y:198,row:2,tint:0xffffff},{nm:'Capitão Ruvel',tex:sG,x:520,y:648,row:2,tint:0x9fe08a},
 {nm:'Aldeã',tex:sP,x:393,y:776,row:2,wander:1},{nm:'Viajante',tex:sL,x:518,y:1035,row:1,wander:1},{nm:'Bardo',tex:sB,x:450,y:375,row:2}].map(n=>{const a=new Actor(n.tex,n.tint);a.nm=n.nm;a.x=a.hx=wx(n.x);a.z=a.hz=wz(n.y);a.row=n.row;a.wander=n.wander;a.tx=a.x;a.tz=a.z;a.ph=rnd()*6;
  a.lb=document.createElement('div');a.lb.className='lb';a.lb.textContent=n.nm;document.body.appendChild(a.lb);return a;});
for(const n of NPC)solids.push([n.x,n.z,.4]);
const DOORS=DATA.doors.map(d=>({nm:d.nm,x:wx(d.x),z:wz(d.y+8)}));DOORS.push({nm:'Portal das Dungeons',x:wx(450),z:wz(190)});
// ---------- entrada ----------
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyE'||e.code==='Space')doAct();e.preventDefault();});addEventListener('keyup',e=>keys[e.code]=0);
let jx=0,jz=0,jid=null;const st=$('stick'),kn=$('knob');
function jset(e){const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),L=r.width/2;if(m>L){dx*=L/m;dy*=L/m;}kn.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/L;jz=dy/L;}
st.addEventListener('pointerdown',e=>{jid=e.pointerId;st.setPointerCapture(jid);jset(e);});st.addEventListener('pointermove',e=>{if(e.pointerId===jid)jset(e);});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jz=0;kn.style.transform='';}};st.addEventListener('pointerup',jend);st.addEventListener('pointercancel',jend);
$('act').addEventListener('pointerdown',e=>{e.preventDefault();doAct();});
let near=null,tt=0;function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,1800);}
function doAct(){if(near)toast(near.kind==='door'?'Você entraria em: '+near.nm:near.kind==='npc'?near.nm+': "Bem-vindo a Brumavale!"':near.nm);}
function collide(p,r){p.x=Math.max(-GW/2+.6,Math.min(GW/2-.6,p.x));p.z=Math.max(.8,Math.min(GH-.8,p.z));
  for(const s of solids){if(Array.isArray(s)){const dx=p.x-s[0],dz=p.z-s[1],d=Math.hypot(dx,dz),R=s[2]+r;if(d<R&&d>1e-4){p.x=s[0]+dx/d*R;p.z=s[1]+dz/d*R;}}
    else{const [x0,z0,x1,z1]=s.aabb;if(p.x>x0-r&&p.x<x1+r&&p.z>z0-r&&p.z<z1+r){const dl=p.x-(x0-r),dr=(x1+r)-p.x,dt=p.z-(z0-r),db=(z1+r)-p.z,m=Math.min(dl,dr,dt,db);if(m===dl)p.x=x0-r;else if(m===dr)p.x=x1+r;else if(m===dt)p.z=z0-r;else p.z=z1+r;}}}}
// ---------- laço ----------
const D=new T.Vector3(0,Math.sin(TILT),Math.cos(TILT));let last=performance.now(),time=0;const camT=new T.Vector3(hero.x,0,hero.z),tmp=new T.Vector3();
setTimeout(()=>{$('msg').style.opacity=1;setTimeout(()=>$('msg').style.opacity=0,1800);},300);
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx,iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+jz;const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
  if(il>.08){hero.row=Math.abs(ix)>Math.abs(iz)?(ix>0?3:1):(iz>0?2:0);hero.x+=ix*3.6*dt;hero.z+=iz*3.6*dt;collide(hero,.35);hero.set(1+Math.floor(time*9)%8,hero.row);}else hero.set(0,hero.row);
  hero.root.position.set(hero.x,0,hero.z);
  for(const n of NPC){if(n.wander){if(Math.hypot(n.tx-n.x,n.tz-n.z)<.2){if(rnd()<.01+dt*.3){n.tx=n.hx+(rnd()-.5)*5;n.tz=n.hz+(rnd()-.5)*4;}n.set(0,n.row);}else{const dx=n.tx-n.x,dz=n.tz-n.z,d=Math.hypot(dx,dz);n.row=Math.abs(dx)>Math.abs(dz)?(dx>0?3:1):(dz>0?2:0);n.x+=dx/d*1.1*dt;n.z+=dz/d*1.1*dt;collide(n,.3);n.set(1+Math.floor((time+n.ph)*7)%8,n.row);}}
    else n.set(0,n.row);n.root.position.set(n.x,Math.max(0,Math.sin(time*2+n.ph)*.012),n.z);
    tmp.set(n.x,2.1,n.z).project(cam);n.lb.style.display=tmp.z<1&&Math.hypot(n.x-hero.x,n.z-hero.z)<9?'block':'none';n.lb.style.left=((tmp.x+1)/2*innerWidth)+'px';n.lb.style.top=((1-tmp.y)/2*innerHeight)+'px';}
  // interação
  near=null;let nd=2.6;for(const n of NPC){const d=Math.hypot(n.x-hero.x,n.z-hero.z);if(d<nd){nd=d;near={kind:'npc',nm:n.nm};}}
  for(const d of DOORS){const dd=Math.hypot(d.x-hero.x,d.z-hero.z);if(dd<nd){nd=dd;near={kind:'door',nm:d.nm};}}
  $('act').classList.toggle('on',!!near);$('act').textContent=near?(near.kind==='door'?'ENTRAR':'FALAR'):'AÇÃO';
  $('where').textContent=near?near.nm:(hero.z<7?'Portal das Dungeons':hero.z<28?'Praça central':'Estrada');
  applyTod(dt);
  // luzes
  const ns=night;let act=sources.map((s,i)=>({s,i,d:s.p.distanceToSquared(hero.root.position)})).sort((a,b)=>a.d-b.d);
  pool.forEach((L,i)=>{const a=act[i];if(!a){L.intensity=0;return;}const f=1+(a.s.fl?.18*Math.sin(time*11+a.i)+.1*Math.sin(time*23+a.i*2):.04*Math.sin(time*3+a.i));L.position.copy(a.s.p);L.color.setHex(a.s.c);L.intensity=a.s.k*(.15+Math.max(ns,a.s.night*.6))*f*(ns>.05||a.s.night?1:.25);L.distance=11;});
  sources.forEach((s,i)=>{const g=glows[i],f=1+(s.fl?.2*Math.sin(time*11+i):.05*Math.sin(time*3+i));g.material.opacity=Math.min(1,.12+Math.max(ns,s.night*.5)*.9)*(s.night>=1?1:1);g.scale.set(1.4*f,1.4*f,1);});
  winMats.forEach(m=>m.emissiveIntensity=.2+ns*1.4);
  vm.uniforms.t.value=time;pl.intensity=1.4+.4*Math.sin(time*2);
  for(const s of smoke){s.t+=dt;const u=(s.t%4)/4;s.sp.position.set(s.x+u*.9,s.y+u*2.6,s.z+Math.sin(u*5+s.t)*.1);const sc=.5+u*1.8;s.sp.scale.set(sc,sc,1);s.sp.material.opacity=Math.sin(u*Math.PI)*.35*(1-ns*.4);}
  // câmera (ângulo fixo; só a distância muda com o formato da tela)
  const asp=cam.aspect,dist=18*(asp<1?1+(1-asp)*1.2:1);camT.x+=(hero.x*.96-camT.x)*Math.min(1,dt*4);camT.z+=(hero.z-camT.z)*Math.min(1,dt*4);
  cam.position.set(camT.x,.9+D.y*dist,camT.z-1+D.z*dist);cam.lookAt(camT.x,.9,camT.z-1);
  hero.face();for(const n of NPC)n.face();
  // casas na frente do herói ficam transparentes
  {const head=new T.Vector3(hero.x,1.0,hero.z),dir=head.clone().sub(cam.position),L=dir.length();dir.normalize();const ray=new T.Ray(cam.position,dir),hit=new T.Vector3();
   for(const g of houses){const u=g.userData,p=ray.intersectBox(u.box,hit),block=p&&cam.position.distanceTo(hit)<L-.3,tg=block?.14:1;u.o+=(tg-u.o)*Math.min(1,dt*7);
     for(const m of u.mats){m.transparent=u.o<.995;m.opacity=u.o;m.depthWrite=u.o>.6;}}}
  R.render(S,cam);}
