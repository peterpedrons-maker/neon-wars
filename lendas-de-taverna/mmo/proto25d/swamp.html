<!doctype html><meta charset="utf-8"><title>Pântano (mockup por código)</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script>window.V3={};</script><script src="../three.min.js"></script><script src="../v3proc.js"></script>
<body><script>
const T=THREE,P=V3.proc,U=1.3/46,CT=Math.cos(47*Math.PI/180);
const W=900,H=1500,gw=W/4,gh=H/4;
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.15;R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x0c1614);S.fog=new T.FogExp2(0x16241f,.03);
const cam=new T.PerspectiveCamera(32,innerWidth/innerHeight,.5,200);
const hash=P.hash,fbm=P.fbm;
// caminho sinuoso (terra) e lagoas (água) vindos de ruído
const path=x=>W/2+Math.sin(x*.006)*140+Math.sin(x*.017)*40;
const WATER=new Uint8Array(gw*gh),gc=document.createElement('canvas');gc.width=gw;gc.height=gh;const gx=gc.getContext('2d');gx.fillStyle='#2f6a28';gx.fillRect(0,0,gw,gh);gx.fillStyle='#7a5a3a';
for(let y=0;y<gh;y++){const px=path(y*4)/4;gx.fillRect(px-5,y,10,1);}
for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const n=fbm(x/22,y/22,5),dp=Math.abs(x-path(y*4)/4);if(n>.62&&dp>10)WATER[y*gw+x]=1;}
const pal={g1:[34,60,34],g2:[48,78,40],g3:[26,46,30],d1:[84,66,44],d2:[98,78,52],d3:[70,54,38],st:[110,110,100],sm:[60,60,56],shore:[58,56,38],w1:[70,100,72],w2:[28,50,42]};
const g=P.ground({W,H,WATER,WCW:gw,GROUND:gc},pal,21);
const gt=new T.CanvasTexture(g.canvas);gt.encoding=T.sRGBEncoding;gt.anisotropy=8;
const gm=new T.Mesh(new T.PlaneGeometry(W*U,H*U),new T.MeshStandardMaterial({map:gt,roughness:.95}));gm.rotation.x=-Math.PI/2;gm.position.set(W*U/2,0,H*U/2);gm.receiveShadow=true;S.add(gm);
S.add(P.waterMesh(g,W*U,H*U,[.45,.62,.4]));
// luz de lua + ambiente
const hemi=new T.HemisphereLight(0x6a86a8,0x1c2a20,.8),sun=new T.DirectionalLight(0xa8c4ff,.9);S.add(hemi,sun,sun.target);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-18;sc.right=18;sc.top=18;sc.bottom=-18;sc.far=60;sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;
// props instanciados
const free=(x,y)=>{const gx_=Math.floor(x/4),gy_=Math.floor(y/4);if(WATER[gy_*gw+gx_])return false;return Math.abs(x-path(y))>46;};
function scatter(kind,n,seed,col,sz,opt={}){const geo=P.MODELS[kind](col),mat=opt.mat||new T.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.9});
  const pts=[];for(let i=0;i<n*6&&pts.length<n;i++){const x=hash(i,seed,1)*W,y=hash(i,seed,2)*H;if(opt.near?Math.abs(x-path(y))>opt.near:free(x,y))pts.push([x,y]);}
  const im=new T.InstancedMesh(geo,mat,pts.length),m=new T.Matrix4(),q=new T.Quaternion(),e=new T.Euler();
  pts.forEach(([x,y],i)=>{const r=hash(i,seed,3),s=sz[0]+r*(sz[1]-sz[0]);e.set(0,r*6.28,0);q.setFromEuler(e);m.compose(new T.Vector3(x*U,0,y*U),q,new T.Vector3(s*(opt.w||1),s*(opt.h||1),s*(opt.w||1)));im.setMatrixAt(i,m);im.setColorAt(i,new T.Color().setScalar(.85+hash(i,seed,4)*.3));});
  im.castShadow=!opt.noShadow;im.receiveShadow=true;im.frustumCulled=false;S.add(im);return pts;}
scatter('dead',60,1,new T.Color('#4a3a30'),[4.2,6.4],{w:.8});
scatter('broad',45,2,new T.Color('#2f4a2a'),[3.6,5.4],{w:1.1});
scatter('thorn',60,3,new T.Color('#4a3424'),[1.1,1.9]);
scatter('rock',55,4,new T.Color('#5a5e58'),[.9,1.8],{w:1.6});
scatter('tuft',700,5,new T.Color('#46783a'),[.9,1.6],{noShadow:1,mat:new T.MeshStandardMaterial({vertexColors:true,flatShading:true})});
scatter('bones',22,6,new T.Color('#d6ccb0'),[.8,1.3],{noShadow:1,near:30});
scatter('totem',9,7,new T.Color('#4a3220'),[3,3.8],{near:70});
scatter('tent',3,8,new T.Color('#6a4a30'),[3.2,3.6],{near:90,w:1.3});
// cogumelos luminosos
const glowMat=new T.MeshStandardMaterial({vertexColors:true,flatShading:true,emissive:0x22ccaa,emissiveIntensity:.9,roughness:.5});
const mp=scatter('mush',90,9,new T.Color('#5ff0d0'),[.8,1.5],{noShadow:1,mat:glowMat});
const lights=[];for(let i=0;i<5;i++){const L=new T.PointLight(0x40ffd0,1.2,7,2);S.add(L);lights.push(L);}
// fogueira e lanternas
P.fire((o)=>S.add(o),(W/2-60)*U,420*U,1.2,'fire');const fl=new T.PointLight(0xffa040,2.4,14,2);fl.position.set((W/2-60)*U,1.2,420*U+.3);S.add(fl);
for(const y of [200,560,820,1100]){const x=path(y)+60;P.fire(o=>S.add(o),x*U,y*U,1,'torch');const l=new T.PointLight(0xffa040,1.3,9,2);l.position.set(x*U,1.7,y*U+.4);S.add(l);}
// vaga-lumes
const fliesGeo=new T.BufferGeometry(),NF=120,fp=new Float32Array(NF*3);for(let i=0;i<NF;i++){fp[i*3]=path(i*10)*U+(hash(i,1,1)-.5)*14;fp[i*3+1]=.6+hash(i,2,2)*2.4;fp[i*3+2]=(i*10%H)*U;}
fliesGeo.setAttribute('position',new T.BufferAttribute(fp,3));const fcv=document.createElement('canvas');fcv.width=fcv.height=32;const fcx=fcv.getContext('2d'),fg=fcx.createRadialGradient(16,16,0,16,16,16);fg.addColorStop(0,'rgba(220,255,160,1)');fg.addColorStop(1,'rgba(220,255,160,0)');fcx.fillStyle=fg;fcx.fillRect(0,0,32,32);
const flies=new T.Points(fliesGeo,new T.PointsMaterial({map:new T.CanvasTexture(fcv),size:.5,transparent:true,blending:T.AdditiveBlending,depthWrite:false}));S.add(flies);
// herói: o MESMO sprite do jogo (folha de caminhada do pack LPC, gerada pelo próprio jogo), em pé no mundo 3D
const ht=new T.TextureLoader().load('hero_walk.png');ht.encoding=T.sRGBEncoding;ht.magFilter=T.NearestFilter;ht.minFilter=T.NearestFilter;ht.repeat.set(1/9,1/4);
const hg=new T.PlaneGeometry(64*U,64*U);hg.translate((32-28)*U,(60-32)*U,0);
const hero=new T.Mesh(hg,new T.MeshBasicMaterial({map:ht,transparent:true,alphaTest:.3,side:T.DoubleSide}));hero.scale.y=1/CT;S.add(hero);
const hsh=new T.Mesh(new T.PlaneGeometry(1.2,.7),new T.MeshBasicMaterial({map:(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,30);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(c);})(),transparent:true,depthWrite:false}));hsh.rotation.x=-Math.PI/2;S.add(hsh);
const hl=new T.PointLight(0xffb870,1.4,9,2);S.add(hl);
window.step=function(t){ // t em segundos
  P.time.value=t;const y=1380-t*95,x=path(y);hero.position.set(x*U,0,y*U);hsh.position.set(x*U,.05,y*U);{const c=Math.floor(t*8)%6;ht.offset.set(c/9,1-1/4);}hl.position.set(x*U,1.8,y*U+.3);
  cam.position.set(x*U,.9+Math.sin(47*Math.PI/180)*12.5,y*U-1+Math.cos(47*Math.PI/180)*12.5);cam.lookAt(x*U,.9,y*U-1);
  sun.position.set(x*U-9,15,y*U+7);sun.target.position.set(x*U,0,y*U);sun.target.updateMatrixWorld();
  lights.forEach((L,i)=>{const q=mp[(Math.floor(y/30)*5+i*7)%mp.length];L.position.set(q[0]*U,.6,q[1]*U);L.intensity=1+.3*Math.sin(t*3+i);});
  const p=fliesGeo.attributes.position;for(let i=0;i<NF;i++){p.setY(i,.8+hash(i,2,2)*2+Math.sin(t*1.5+i)*.3);p.setX(i,fp[i*3]+Math.sin(t*.8+i)*.4);}p.needsUpdate=true;
  fl.intensity=2.2+.5*Math.sin(t*11);R.render(S,cam);};
step(0);
</script>
