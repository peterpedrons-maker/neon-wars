<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}#w{position:relative;width:400px;height:712px}canvas{width:400px;height:712px;image-rendering:pixelated;display:block}

</style><div id="w"><div class="bar" style="left:10px;width:150px"><i id="hp1" style="width:100%;background:#58d864"></i></div><div class="lb" style="left:10px">HEROI</div><div class="bar" style="right:10px;width:150px"><i id="hp2" style="width:100%;background:#e8483c;float:right"></i></div><div class="lb" style="right:10px">CHEFE ORC</div></div>
<script src="three.min.js"></script><script>
const T=THREE,TILT=47*Math.PI/180,CT=Math.cos(TILT),PX=.03,IW=200,IH=356;
const R=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});R.setPixelRatio(1);R.setSize(IW,IH,false);document.getElementById('w').insertBefore(R.domElement,document.getElementById('w').firstChild);
const S=new T.Scene();S.background=new T.Color(0x9ad8f0);const cam=new T.PerspectiveCamera(32,IW/IH,.5,200);
let META,TEX={};const load=n=>new Promise(r=>{const i=new Image();i.onload=()=>{const t=new T.Texture(i);t.magFilter=t.minFilter=T.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;t.encoding=T.sRGBEncoding;r(t)};i.src=n+'.png'});
function rnd(s){let a=s;return()=>{a=(a*16807)%2147483647;return (a-1)/2147483646}}
const GW=18,GD=34,GPX=Math.round(GW/PX),GPZ=Math.round(GD/PX);
function groundCanvases(){
  const base=document.createElement('canvas');base.width=GPX;base.height=GPZ;const x=base.getContext('2d');const id=x.createImageData(GPX,GPZ),d=id.data,r=rnd(11);
  const u2p=(ux,uz)=>[(ux+GW/2)/PX,(uz+GD/2)/PX];
  const arena={x0:-3.7,x1:3.7,z0:-1.3,z1:2.5},pond={cx:-2.4,cz:-6.4,rx:2.5,rz:1.8};
  const water=new Uint8Array(GPX*GPZ);
  for(let py=0;py<GPZ;py++)for(let px=0;px<GPX;px++){
    const ux=px*PX-GW/2,uz=py*PX-GD/2;let c=[98,172,68],v=r();
    if((Math.floor(px/12)+Math.floor(py/12))%2==0)c=[112,190,78];
    if(v<.06)c=[80,150,60];else if(v>.97)c=[164,224,118];
    // trilha de terra
    const tr=Math.abs(ux-.4*Math.sin(uz*.35))<.9&&uz>2.4;
    const inA=ux>arena.x0&&ux<arena.x1&&uz>arena.z0&&uz<arena.z1;
    if(inA||tr){const e=inA?Math.min(ux-arena.x0,arena.x1-ux,uz-arena.z0,arena.z1-uz):1;
      c=((Math.floor(px/9)+Math.floor(py/9))%2)?[212,156,88]:[222,166,96];if(v<.08)c=[176,120,66];else if(v>.96)c=[246,204,136];
      if(inA&&e<.14)c=[132,88,48];else if(inA&&e<.30)c=[158,108,60];
    }
    const dx=(ux-pond.cx)/pond.rx,dz=(uz-pond.cz)/pond.rz,dd=dx*dx+dz*dz+(r()-.5)*.08;
    if(dd<1.18){c=[236,214,150];}               // margem
    if(dd<1.0){water[py*GPX+px]=1+(dd<.7?1:0);c=[58,170,236]}
    const k=(py*GPX+px)*4;d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;
  }
  x.putImageData(id,0,0);
  const frames=[];
  for(let f=0;f<4;f++){const cv=document.createElement('canvas');cv.width=GPX;cv.height=GPZ;const g=cv.getContext('2d');g.drawImage(base,0,0);const im=g.getImageData(0,0,GPX,GPZ),dd=im.data;
    for(let py=0;py<GPZ;py++)for(let px=0;px<GPX;px++){const w=water[py*GPX+px];if(!w)continue;const k=(py*GPX+px)*4;
      const wave=Math.sin((px*.35+py*.55)+f*1.57)+Math.sin(px*.2-py*.4-f*1.57*1.3);
      let c=w==2?[34,126,214]:[58,170,236];if(wave>1.55)c=[240,250,255];else if(wave>1.1)c=[130,214,255];
      dd[k]=c[0];dd[k+1]=c[1];dd[k+2]=c[2];}
    g.putImageData(im,0,0);const t=new T.CanvasTexture(cv);t.magFilter=t.minFilter=T.NearestFilter;t.generateMipmaps=false;t.encoding=T.sRGBEncoding;frames.push(t)}
  return frames;
}
let GROUND=null,groundMat=null;
function sprite(tex,w,h,ax,ay,sc=1){ // âncora no pé
  const g=new T.PlaneGeometry(w*PX*sc,h*PX*sc);g.translate((w/2-ax)*PX*sc,(ay-h/2)*PX*sc,0);
  const m=new T.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.5,side:T.DoubleSide});const me=new T.Mesh(g,m);me.scale.y=1/CT;return me}
function blob(rx,rz,op=.35){const m=new T.Mesh(new T.CircleGeometry(1,20),new T.MeshBasicMaterial({color:0x1c3a22,transparent:true,opacity:op,depthWrite:false}));m.rotation.x=-Math.PI/2;m.scale.set(rx,rz,1);m.position.y=.02;return m}
const actors={};
function mkActor(name,x,flip){
  const M=META[name],grp=new T.Group(),meshes={};
  for(const a in M.anims){const n=M.anims[a].n,t=TEX[name+'_'+a].clone();t.needsUpdate=true;t.repeat.set(1/n,1);t.offset.set(0,0);const me=sprite(t,M.W,M.H,M.ax,M.ay);me.visible=false;if(flip)me.scale.x=-1;grp.add(me);meshes[a]={me,t,n}}
  const sh=blob(name=='boss'?1.25:.75,name=='boss'?.55:.34);grp.add(sh);grp.position.set(x,0,0);S.add(grp);actors[name]={grp,meshes,flip,cur:null,x0:x};return actors[name]}
function setPose(A,anim,i,flash=0){for(const k in A.meshes){A.meshes[k].me.visible=k==anim}const m=A.meshes[anim];m.t.offset.x=i/m.n;m.me.material.color.setScalar(1+flash*2.2)}
const FX={},popups=[];
function mkFx(name,x,y,z,sc,flip=false){const M=META['fx_'+name],t=TEX['fx_'+name].clone();t.needsUpdate=true;t.repeat.set(1/M.n,1);const me=sprite(t,M.size,M.size,M.size/2,M.size/2,sc);me.material.depthTest=false;me.renderOrder=20;if(flip)me.scale.x=-1;me.position.set(x,y,z);me.userData={n:M.n,t};me.visible=false;S.add(me);return me}
function mkText(name,x,y){const sz=META['t_'+name],t=TEX['t_'+name];const me=sprite(t,sz[0],sz[1],sz[0]/2,sz[1],1.1);me.material.depthTest=false;me.renderOrder=30;me.position.set(x,y,0);me.visible=false;S.add(me);return me}
let tl=[],fxList=[],TX=[],built=false;
const ev=(t,who,anim,o={})=>tl.push(Object.assign({t,who,anim},o));
function frameOf(a,el,loop){const ms=a.ms;let tot=ms.reduce((p,c)=>p+c,0);if(loop)el%=tot;el=Math.min(el,tot-1);let c=0;for(let i=0;i<ms.length;i++){c+=ms[i];if(el<c)return i}return ms.length-1}
const HX0=-2.1,HXF=-.5,BX=1.75;
async function init(){
  META=await (await fetch('meta.json')).json();
  const names=[];for(const c of['hero','boss'])for(const a in META[c].anims)names.push(c+'_'+a);for(const f of['slash','shock'])names.push('fx_'+f);for(const k in META)if(k.startsWith('t_'))names.push(k);['sc_tree1','sc_tree2','sc_tree3','sc_rock1','sc_rock2','sc_bush','sc_flw'].forEach(n=>names.push(n));
  await Promise.all(names.map(async n=>{TEX[n]=await load(n)}));
  GROUND=groundCanvases();const gm=new T.MeshBasicMaterial({map:GROUND[0]});groundMat=gm;const gp=new T.Mesh(new T.PlaneGeometry(GW,GD),gm);gp.rotation.x=-Math.PI/2;S.add(gp);
  // cenário: sprites de pixel art
  const r=rnd(5);
  const place=(n,x,z,sc=1,sh=1)=>{const t=TEX[n],im=t.image;const me=sprite(t,im.width,im.height,im.width/2,im.height-1,sc);me.position.set(x,0,z);S.add(me);if(sh){const b=blob(im.width*PX*sc*.38,im.width*PX*sc*.16,.3);b.position.set(x+.15,.02,z+.1);S.add(b)}};
  [[-3.7,-4.6,'sc_tree1'],[3.3,-4.9,'sc_tree3'],[0.6,-7.2,'sc_tree2'],[-4.4,-1.6,'sc_tree2'],[4.3,-1.2,'sc_tree1'],[-4.2,3.6,'sc_tree3'],[4.2,4.2,'sc_tree2'],[2.2,-9.5,'sc_tree3'],[-1.8,-10,'sc_tree1'],[-4.6,-8.6,'sc_tree3']].forEach(([x,z,n])=>place(n,x,z));
  [[-3.0,-2.0,'sc_rock1'],[3.2,-2.1,'sc_rock2'],[-3.1,3.0,'sc_rock2'],[3.4,3.1,'sc_rock1'],[1.3,-5.3,'sc_rock2']].forEach(([x,z,n])=>place(n,x,z,1,1));
  [[-1.9,-2.5],[2.0,-3.1],[-3.4,5.6],[3.6,6.0],[-2.6,-4.0],[0.2,-5.6],[3.0,-6.2]].forEach(([x,z])=>place('sc_bush',x,z));
  for(let i=0;i<64;i++){const x=(r()-.5)*9,z=-8+r()*18;if(Math.abs(x)<3.6&&z>-1.3&&z<2.5)continue;if(Math.hypot((x+2.4)/2.8,(z+6.4)/2.1)<1.2)continue;place('sc_flw',x,z,1,0)}
  mkActor('hero',HX0,false);mkActor('boss',BX,true);
  FX.slash=mkFx('slash',0,0,0,1.5);FX.shock=mkFx('shock',0,0,0,2.2);
  TX={d1:mkText('d1',0,0),blk:mkText('blk',0,0),d2:mkText('d2',0,0),dod:mkText('dod',0,0),d3:mkText('d3',0,0),win:mkText('win',0,0)};
  ev(0,'h','idle');ev(0,'b','idle');ev(900,'h','walk',{x0:HX0,x1:HXF,dur:1100});ev(2000,'h','idle');
  ev(2250,'h','attack',{lunge:.5});ev(3150,'b','hurt',{tx:'d1',fx:'slash'});ev(3550,'h','idle');
  ev(3700,'b','skill');ev(4950,'h','block',{back:.25,tx:'blk'});ev(5550,'b','idle');
  ev(5650,'h','skill',{lunge:.7});ev(6950,'b','hurt',{big:1,tx:'d2',fx:'shock',crit:1});
  ev(7700,'b','attack');ev(8450,'h','dodge',{back:-1.1,tx:'dod'});ev(9200,'h','idle');ev(9200,'b','idle');
  ev(9500,'h','attack',{lunge:.5});ev(10400,'b','death',{tx:'d3',fx:'slash'});
  built=true;window.READY=true;
}
const BHP=[[0,100],[3150,86],[6950,48],[10400,0]];
function stateAt(who,t){let c=null;for(const e of tl)if(e.who==who&&e.t<=t)c=e;return c}
window.step=function(t){
  const sh=stateAt('h',t),sb=stateAt('b',t),H=actors.hero,B=actors.boss;let shake=0;
  // herói
  let hx=HXF,hy=0;{const a=sh.anim,A=META.hero.anims[a],el=t-sh.t;
    if(a=='walk'){hx=sh.x0+(sh.x1-sh.x0)*Math.min(1,el/sh.dur)}else{const tot=A.ms.reduce((p,c)=>p+c,0),u=Math.min(1,el/tot);
      if(a=='attack'||a=='skill')hx+=sh.lunge*Math.sin(Math.min(1,u*1.6)*Math.PI)*(u<.7?1:.4);
      if(a=='block')hx-=sh.back*Math.min(1,el/300);
      if(a=='dodge'){hx+=sh.back*Math.sin(u*Math.PI*.9);hy=.35*Math.sin(u*Math.PI)}}
    if(a=='walk'&&el<sh.dur){/* passos saltitantes leves */hy=Math.abs(Math.sin(el/115))*.05}
    H.grp.position.set(hx,hy,0.0);setPose(H,a,frameOf(A,el,A.loop),0)}
  // chefe
  {const a=sb.anim,A=META.boss.anims[a],el=t-sb.t;let bx=BX,fl=0;const tot=A.ms.reduce((p,c)=>p+c,0),u=Math.min(1,el/tot);
    if(a=='skill')bx-=.9*Math.sin(Math.min(1,u*1.3)*Math.PI);if(a=='attack')bx-=.5*Math.sin(Math.min(1,u*1.5)*Math.PI);
    if(a=='hurt'&&el<170){fl=sb.big?.85:.7;bx+=.12}
    B.grp.position.set(bx,0,0);setPose(B,a,frameOf(A,el,A.loop),fl)}
  // efeitos e textos
  for(const k in FX)FX[k].visible=false;for(const k in TX)TX[k].visible=false;
  for(const e of tl){if(!e.fx&&!e.tx)continue;const el=t-e.t;if(el<0||el>1000)continue;const onB=e.who=='b'&&e.tx!='blk'&&e.tx!='dod';const px=onB?B.grp.position.x:H.grp.position.x;
    if(e.fx&&el<560){const f=FX[e.fx],n=f.userData.n,i=Math.min(n-1,Math.floor(el/70));f.userData.t.offset.x=i/n;f.position.set(px-(e.fx=='slash'?.2:0),e.fx=='shock'?2.1:1.5,.5);f.visible=true;if(el<150)shake=Math.max(shake,e.crit?.09:.045)}
    if(e.tx){const tx=TX[e.tx];tx.position.set(px,(onB?4.6:3.1)+Math.min(.9,el/900*1.2),.6);tx.visible=true}}
  if(t>11800){TX.win.position.set(0,5,.6);TX.win.visible=true}
  // câmera: leve aproximação e tremor
  const zoom=1+Math.min(.1,t/60000),cx=(H.grp.position.x+B.grp.position.x)/2*.5,d=15.2/zoom;
  const tgt=new T.Vector3(cx,1.6,-.9);cam.position.set(tgt.x+(Math.random()-.5)*shake*2,tgt.y+Math.sin(TILT)*d+(Math.random()-.5)*shake*2,tgt.z+Math.cos(TILT)*d);cam.lookAt(tgt);
  groundMat.map=GROUND[Math.floor(t/260)%4];
  let hp=100;for(const [tt,v] of BHP)if(t>=tt)hp=v;document.getElementById('hp2').style.width=hp+'%';
  R.render(S,cam)};
init();
</script>
