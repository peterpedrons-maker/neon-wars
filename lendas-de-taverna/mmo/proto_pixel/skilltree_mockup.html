const T='../assets/talents/';

// 6 setores a cada 60 graus (polos): Furia, Postura, Bastiao, Ritmo, Comando, Finalizador

 {nm:'Fúria',col:'#ff7a4a',tag:'atk',sm:[['Ataque','+3% de ataque'],['Crítico','+2% de chance de crítico'],['Dano crítico','+5% de dano crítico'],['Vel. de ataque','+3% de velocidade de ataque']],attr:['Força','+6 Força'],

 {nm:'Comando',col:'#ffd070',tag:'util',sm:[['Experiência','+3% de experiência'],['Ouro','+4% de ouro'],['Empurrão','+4% de chance de empurrão'],['Queda','+12% de duração da queda']],attr:['Sorte','+6 Sorte'],

  keys:[['Tirano','gck',['+15% de empurrão','+40% de duração da queda','Reflete 15% do dano']]]},
 {nm:'Finalizador',col:'#6fe0d0',tag:'combo',sm:[['Finalizador','+4% de dano do finalizador'],['Raio','+5% de raio do finalizador'],['Ataque','+3% de ataque'],['Crítico do final','+3% de crítico no finalizador']],attr:['Força','+6 Força'],
  nots:[['Golpe Final em Área','gf6',['COMBO','O combo passa a ter 4 golpes','O 4º golpe causa dano em área']],['Onda Dupla','gc1',['COMBO','O finalizador solta uma segunda onda']],['Fim Dilacerante','gf4',['COMBO','O finalizador aplica sangramento']],['Raio Ampliado','gf5',['COMBO','+15% de raio do finalizador']],['Impacto Sísmico','gc2',['COMBO','O finalizador atordoa por 0,6 s']],['Cadeia de Finais','gf3',['COMBO','O finalizador reduz em 1,5 s a recarga das habilidades']],['Último Suspiro','gf1',['COMBO','Finalizador em inimigos abaixo de 25% de vida: +40% de dano']],['Golpe de Misericórdia','gf2',['COMBO','Finalizador que mata concede +1 carga de Postura']]],

];
const NEWSM=[
 [['Ataque','+3% de ataque','atk','+3%'],['Crítico','+2% de chance de crítico','crit','+2%'],['Dano crítico','+5% de dano crítico','crit2','+5%'],['Vel. de ataque','+3% de velocidade de ataque','spd','+3%']],
 [['Defesa','+4% de defesa','def','+4%'],['Defesa por carga','+2% de defesa por carga de Postura','def','+2%/c'],['Vida','+3% de vida','hp','+3%'],['Duração da Postura','+0,5 s de duração da Postura','clock','+.5s']],
 [['Vida','+4% de vida','hp','+4%'],['Defesa','+4% de defesa','def','+4%'],['Regeneração','+0,4% de vida por segundo','regen','+.4%'],['Cura de poções','+6% de cura das poções','pot','+6%']],
 [['Janela','+0,02 s na janela do Golpe Preciso','win','+.02s'],['Vel. de ataque','+3% de velocidade de ataque','spd','+3%'],['Dano preciso','+2% de dano do Golpe Preciso','atk','+2%'],['Crítico','+2% de chance de crítico','crit','+2%']],
 [['Experiência','+3% de experiência','xp','+3%'],['Ouro','+4% de ouro','gold','+4%'],['Empurrão','+4% de chance de empurrão','push','+4%'],['Queda','+12% de duração da queda','down','+12%']],
 [['Finalizador','+4% de dano do finalizador','fin','+4%'],['Raio','+5% de raio do finalizador','area','+5%'],['Ataque','+3% de ataque','atk','+3%'],['Crítico do final','+3% de crítico no finalizador','crit','+3%']]];
const NEWAT=[['Força','+6 Força','F','+6'],['Vitalidade','+6 Vitalidade','V','+6'],['Vitalidade','+6 Vitalidade','V','+6'],['Destreza','+6 Destreza','D','+6'],['Sorte','+6 Sorte','S','+6'],['Força','+6 Força','F','+6']];
SEC.forEach((s,j)=>{s.sm=NEWSM[j];s.attr=NEWAT[j];});

const HYB=[
 [['Fúria Blindada','gf5',['+1% de defesa por 3% de crítico','(híbrido Fúria + Postura)']],['Golpe Escudado','gb2',['Críticos concedem escudo de 3% da vida','(híbrido Fúria + Postura)']]],
 [['Postura de Ferro','gb1',['Cada carga de Postura: +2% de vida','(híbrido Postura + Bastião)']],['Bastião Móvel','gb4',['Com Postura: sem perda de velocidade ao atacar','(híbrido Postura + Bastião)']]],
 [['Passo Firme','gb3',['Golpe Preciso: +6% de velocidade de movimento por 2 s','(híbrido Bastião + Ritmo)']],['Ritmo Defensivo','gb2',['Combo Perfeito: −10% de dano recebido por 4 s','(híbrido Bastião + Ritmo)']]],
 [['Combo Lucrativo','gc3',['Combo Perfeito: +10% de ouro por 10 s','(híbrido Ritmo + Comando)']],['Cadência Veterana','gc4',['+6% de experiência com combos longos','(híbrido Ritmo + Comando)']]],
 [['Caçador de Finais','gc5',['Finalizador em elites: +12% de dano','(híbrido Comando + Finalizador)']],['Onda Cobiçosa','gc3',['Finalizador que mata: +ouro e +experiência','(híbrido Comando + Finalizador)']]],

];

const R0=30,DR=62;
const rr=k=>R0+DR*k;
const ang=(k,i)=>-90+i*360/(6*k);

function colAt(a){a=((a+90)%360+360)%360;const j=Math.floor(a/60)%6,t=(a%60)/60;const c0=SEC[j].col,c1=SEC[(j+1)%6].col;return mix(c0,c1,t<.5?t*.7:.35+(t-.5)*1.3);}

  const isAttr=rnd()<.13;const sm=sec.sm[Math.floor(rnd()*sec.sm.length)];
  const gl=isAttr?sec.attr:sm;const n={id:id(k,i),x,y,k,i,type:isAttr?'a':'s',nm:gl[0],desc:[gl[1]],gl:gl[2],val:gl[3],col,tag:isAttr?'attr':sec.tag,ic:null,links:[],sec:j};N.push(n);M[n.id]=n;}}

SUB.forEach(([j,d,nm,ds],q)=>{const i=j*7+d,a=ang(7,i)*Math.PI/180,r=rr(8);const n={id:'x'+q,x:500+r*Math.cos(a),y:500+r*Math.sin(a),type:'x',nm,desc:['Subclasse · Nível 10',ds],col:'#7fe0a0',tag:'sub',ic:null,links:[id(7,i)],k:8,i};N.push(n);M[n.id]=n;E.push([id(7,i),n.id]);});

const link=(a,b)=>{E.push([a,b]);};
for(let i=0;i<6;i++)link('H',id(1,i));
for(let k=1;k<=7;k++)for(let i=0;i<6*k;i++){
 if(k>=2&&rnd()>.17)link(id(k,i),id(k,i+1));else if(k<2)link(id(k,i),id(k,i+1));
 if(k>=2){const p=i*(k-1)/k;if(Number.isInteger(p))link(id(k,i),id(k-1,p));else{const f=Math.floor(p),c=f+1;link(id(k,i),id(k-1,f));if(rnd()<.55)link(id(k,i),id(k-1,c));}}
}
// garante dedupe e preenche links
const seen=new Set();const E2=[];E.forEach(([a,b])=>{const key=a<b?a+'|'+b:b+'|'+a;if(seen.has(key)||a===b)return;seen.add(key);E2.push([a,b]);});E.length=0;E2.forEach(e=>E.push(e));
E.forEach(([a,b])=>{M[a].links.push(b);M[b].links.push(a);});
// alocados iniciais
const ALLOC=new Set(['H',id(1,0),id(2,0),id(3,0),id(1,1),id(2,2),id(1,5),id(2,10),id(3,17),id(2,11)]);
let PTS=96-ALLOC.size+1;
const FILT={todos:()=>true,atk:n=>n.tag==='atk',def:n=>n.tag==='def',combo:n=>n.tag==='combo',util:n=>n.tag==='util',attr:n=>n.tag==='attr',mix:n=>n.tag==='mix'};
const FNAME={todos:'Todos',atk:'Ataque',def:'Defesa',combo:'Combo',util:'Utilidade',attr:'Atributos',mix:'Híbridos'};
let filt='todos',sel=null,PATH=null;
function bfs(target){const prev={};const q=[...ALLOC];const seen=new Set(q);while(q.length){const c=q.shift();if(c===target)break;const n=M[c];for(const l of n.links){if(seen.has(l)||M[l].type==='x')continue;seen.add(l);prev[l]=c;q.push(l);}}if(!seen.has(target))return null;const p=[];let c=target;while(!ALLOC.has(c)){p.push(c);c=prev[c];}p.push(c);return p;}
const svg=document.getElementById('svg'),vp=document.getElementById('vp');
const NS='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
(function(){const bg=document.getElementById('bg');
 // cunhas coloridas suaves (se misturam nas bordas)
 const defs=svg.querySelector('defs');const bl=el('filter',{id:'soft',x:'-30%',y:'-30%',width:'160%',height:'160%'},defs);el('feGaussianBlur',{stdDeviation:34},bl);
 const g=el('g',{filter:'url(#soft)',opacity:.5},bg);
 SEC.forEach((s,j)=>{const a0=(-90+60*j-30)*Math.PI/180,a1=(-90+60*j+30)*Math.PI/180,R=640;const p=`M500 500 L${500+R*Math.cos(a0)} ${500+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${500+R*Math.cos(a1)} ${500+R*Math.sin(a1)} Z`;el('path',{d:p,fill:s.col,opacity:.22},g);});
 [rr(3),rr(6),rr(8)+20].forEach(r=>el('circle',{cx:500,cy:500,r,fill:'none',stroke:'#241c30','stroke-width':2,'stroke-dasharray':'2 10'},bg));
 for(let i=0;i<220;i++){const a=Math.random()*6.283,r=40+Math.random()*680;el('circle',{cx:500+r*Math.cos(a),cy:500+r*Math.sin(a),r:Math.random()*1.4+.3,fill:'#8a7aa8',opacity:Math.random()*.5+.1},bg);}
 SEC.forEach((s,j)=>{const a=-90+60*j,r=rr(8)+64;const x=500+r*Math.cos(a*Math.PI/180),y=500+r*Math.sin(a*Math.PI/180);const e=el('text',{x,y,fill:s.col,'font-family':'PX','font-weight':700,'font-size':15,'letter-spacing':4,'text-anchor':'middle',opacity:.5},bg);e.textContent=s.nm.toUpperCase();});
})();
const gE=document.getElementById('edges'),gN=document.getElementById('nodes');
function avail(n){if(ALLOC.has(n.id)||n.type==='x')return false;if(n.excl){const ex=N.find(m=>m.excl&&m!==n&&m.nm.startsWith('Finalizador')&&ALLOC.has(m.id));if(ex&&n.nm.startsWith('Finalizador'))return false;}return n.links.some(l=>ALLOC.has(l));}
function draw(){gE.innerHTML='';gN.innerHTML='';
 const avs=new Set(N.filter(avail).map(n=>n.id));
 E.forEach(([a,b])=>{const A=M[a],B=M[b];const on=ALLOC.has(a)&&ALLOC.has(b);const av=!on&&((ALLOC.has(a)&&avs.has(b))||(ALLOC.has(b)&&avs.has(a)));
  el('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:'eo'},gE);const ip=PATH&&PATH.includes(a)&&PATH.includes(b);el('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:'edge'+(on?' on':av?' av':'')+(ip?' pth':''),style:on?'stroke:'+mix(A.col,B.col,.5):''},gE);});
 N.forEach(n=>{const on=ALLOC.has(n.id),av=avs.has(n.id),lock=!on&&!av;const g=el('g',{class:'nd '+(on?'on ':'')+(av?'av ':'')+(lock?'lock ':'')+(filt!=='todos'&&!FILT[filt](n)&&n.type!=='h'?'dim ':'')+(sel===n.id?'hl ':'')+(PATH&&PATH.includes(n.id)&&!on?'pth':''),style:'--c:'+n.col,'data-id':n.id},gN);
  const R={h:24,s:12,a:12,n:17,c:17,k:24,x:16}[n.type];
  const fillc=on?mix('#1d1627',n.col,.28):null;
  if(n.type==='k'){el('rect',{x:n.x-R*1.12,y:n.y-R*1.12,width:R*2.24,height:R*2.24,transform:`rotate(45 ${n.x} ${n.y})`,fill:'none',stroke:on?n.col:'#3a3248','stroke-width':1.5},g);el('rect',{class:'base',x:n.x-R*.9,y:n.y-R*.9,width:R*1.8,height:R*1.8,transform:`rotate(45 ${n.x} ${n.y})`},g);el('rect',{class:'ring',x:n.x-R-5,y:n.y-R-5,width:R*2+10,height:R*2+10,transform:`rotate(45 ${n.x} ${n.y})`},g);}
  else if(n.type==='c'){el('circle',{cx:n.x,cy:n.y,r:R+4,fill:'none',stroke:on?n.col:'#3a3248','stroke-width':1.5,'stroke-dasharray':'3 3'},g);const pts=[...Array(6)].map((_,i)=>{const a=Math.PI/3*i+Math.PI/6;return (n.x+R*1.08*Math.cos(a))+','+(n.y+R*1.08*Math.sin(a));}).join(' ');el('polygon',{class:'base',points:pts},g);el('circle',{class:'ring',cx:n.x,cy:n.y,r:R+6},g);}
  else if(n.type==='a'){el('rect',{class:'base',x:n.x-R*.8,y:n.y-R*.8,width:R*1.6,height:R*1.6,rx:2},g);el('circle',{class:'ring',cx:n.x,cy:n.y,r:R+5},g);}
  else{if(n.type==='n')el('circle',{cx:n.x,cy:n.y,r:R+4,fill:'none',stroke:on?n.col:'#4a3f56','stroke-width':1.5},g);el('circle',{class:'base',cx:n.x,cy:n.y,r:R},g);el('circle',{class:'ring',cx:n.x,cy:n.y,r:R+5},g);}
  if(fillc)g.querySelectorAll('.base').forEach(b=>b.setAttribute('fill',fillc));
  if(n.type==='n'||n.type==='c'||n.type==='k'||n.type==='x'||n.type==='h'){
    const s=R*(n.type==='k'?1.25:1.5);
    if(n.ic){const cid='cp'+n.id;const cp=el('clipPath',{id:cid},g);el('circle',{cx:n.x,cy:n.y,r:R*(n.type==='k'?.8:.88)},cp);el('image',{href:n.ic,x:n.x-s/2,y:n.y-s/2,width:s,height:s,'clip-path':`url(#${cid})`,style:'image-rendering:pixelated;pointer-events:none'+(lock?';filter:grayscale(1) brightness(.6)':'')},g);}
    else if(n.type==='x'){const t=el('text',{x:n.x,y:n.y+5,'text-anchor':'middle','font-size':13,fill:'#7fe0a0',style:'pointer-events:none'},g);t.textContent='🔒';}
    else if(n.type==='h'){const t=el('text',{x:n.x,y:n.y+6,'text-anchor':'middle','font-family':'PX','font-weight':700,'font-size':20,fill:'#f3d98e',style:'pointer-events:none'},g);t.textContent='⚔';}
    const dx=n.x-500,dy=n.y-500,dd=Math.hypot(dx,dy)||1,side=Math.abs(dx/dd)>.55;const L=el('text',{x:side?n.x+(dx>0?1:-1)*(R+9):n.x,y:side?n.y+4:n.y+R+(n.type==='k'?17:13),style:'text-anchor:'+(side?(dx>0?'start':'end'):'middle'),class:'lbl'+(n.type==='k'?' k':n.type==='c'?' c':'')},g);L.textContent=n.nm.length>20?n.nm.slice(0,20):n.nm;
  }
  if(n.type==='s'||n.type==='a'){glyph(n.gl,n.x,n.y,lock?'#8a7f99':n.col,g);const V=el('text',{x:n.x,y:n.y+R+10,class:'val'},g);V.textContent=n.val;}
  el('circle',{cx:n.x,cy:n.y,r:Math.max(R+7,18),fill:'transparent'},g);
 });
}

function glyph(g,x,y,c,p){const st={fill:'none',stroke:c,'stroke-width':1.7,'stroke-linecap':'round','stroke-linejoin':'round',style:'pointer-events:none'};
 const L=(a,b,c2,d)=>el('line',{x1:x+a,y1:y+b,x2:x+c2,y2:y+d,...st},p);const PL=(pts,f)=>el('polyline',{points:pts.map(q=>(x+q[0])+','+(y+q[1])).join(' '),...st,...(f?{fill:c}:{})},p);
 const C=(r,f)=>el('circle',{cx:x,cy:y,r,...st,...(f?{fill:c}:{})},p);
 if(g==='atk'){L(-4,4,4,-4);L(-1,1,-4,-2);L(1,-1,4,2);}
 else if(g==='crit'){PL([[0,-5],[1.4,-1.4],[5,0],[1.4,1.4],[0,5],[-1.4,1.4],[-5,0],[-1.4,-1.4],[0,-5]]);}
 else if(g==='crit2'){PL([[0,-5],[1.4,-1.4],[5,0],[1.4,1.4],[0,5],[-1.4,1.4],[-5,0],[-1.4,-1.4],[0,-5]],1);}
 else if(g==='spd'){PL([[2,-5],[-2,0],[1,0],[-2,5]]);}
 else if(g==='def'){PL([[-4,-4],[0,-5],[4,-4],[4,0],[0,5],[-4,0],[-4,-4]]);}
 else if(g==='hp'){PL([[0,4.5],[-4.5,-0.5],[-3,-4],[0,-2.5],[3,-4],[4.5,-0.5],[0,4.5]],1);}
 else if(g==='regen'){L(-4,0,4,0);L(0,-4,0,4);}
 else if(g==='pot'){PL([[-1.5,-5],[-1.5,-2],[-4,3],[-3,5],[3,5],[4,3],[1.5,-2],[1.5,-5]]);}
 else if(g==='clock'){C(4.5);L(0,0,0,-3);L(0,0,2.5,1);}
 else if(g==='win'){C(4.5);C(1.3,1);}
 else if(g==='xp'){PL([[0,-5],[1.5,-1.5],[5,-1],[2,1.5],[3,5],[0,3],[-3,5],[-2,1.5],[-5,-1],[-1.5,-1.5],[0,-5]],1);}
 else if(g==='gold'){C(4.5);L(0,-2.5,0,2.5);}
 else if(g==='push'){L(-4,0,3,0);PL([[0,-3],[4,0],[0,3]]);}
 else if(g==='down'){L(0,-4,0,3);PL([[-3,0],[0,4],[3,0]]);}
 else if(g==='fin'){L(-4,-4,4,4);L(-4,4,4,-4);}
 else if(g==='area'){C(2);C(5);}
 else{const t=el('text',{x,y:y+4,'text-anchor':'middle','font-family':'PX','font-weight':700,'font-size':11,fill:c,style:'pointer-events:none'},p);t.textContent=g;}}
(function(){const c=document.getElementById('chips');Object.keys(FILT).forEach(k=>{const b=document.createElement('button');b.textContent=FNAME[k];b.dataset.k=k;if(k==='todos')b.classList.add('on');b.style.setProperty('--c',{combo:'#c98bff',atk:'#ff7a4a',def:'#7ab8ff',util:'#ffd070',attr:'#9be39b',mix:'#fff',todos:'#ffd070'}[k]);b.onclick=()=>{filt=k;c.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===k));draw();};c.appendChild(b);});})();
function sumUI(){const c=document.getElementById('sum');const cnt=SEC.map(()=>0),tot=SEC.map(()=>0);N.forEach(n=>{if(n.sec==null)return;tot[n.sec]++;if(ALLOC.has(n.id))cnt[n.sec]++;});
 c.innerHTML=SEC.map((s,j)=>`<div style="--c:${s.col}">${s.nm}<i><b style="width:${Math.min(100,cnt[j]/tot[j]*400)}%"></b></i></div>`).join('');}
const sheet=document.getElementById('sheet');
const TYPE={s:'Passiva',a:'Atributo',n:'Destaque',c:'Destaque de combo',k:'Pedra angular',x:'Subclasse (bloqueada)',h:'Início'};
function showSheet(i){sel=i;const n=M[i];const on=ALLOC.has(i),av=avail(n);PATH=(!on&&!av&&n.type!=='x')?bfs(i):null;const cost=PATH?PATH.length-1:0;
 sheet.style.setProperty('--c',n.col);sheet.className='show';
 const lis=n.desc.map(d=>Array.isArray(d)?`<li class="${d[1]}">${d[0]}</li>`:`<li class="${/^COMBO|^\(híbrido/.test(d)?'n':'g'}">${d}</li>`).join('');
 const why=n.type==='x'?'Requer nível 10 e subclasse':on?'Alocada':av?'Custa 1 ponto':PATH?`Caminho: ${cost} pontos (${PATH.length-1} nós)`:'Sem caminho';
 sheet.innerHTML=`<div class="t"><div class="ic">${n.ic?`<img src="${n.ic}">`:`<span style="font:700 22px PX;color:${n.col}">${n.type==='a'?'◆':n.type==='x'?'🔒':n.type==='h'?'⚔':'●'}</span>`}</div><div><div class="bd">${TYPE[n.type]}${n.tag==='mix'?' · híbrido':''}</div><h2>${n.nm}</h2></div></div><ul>${lis}</ul><div class="acts"><div class="req">${why}</div>${on&&n.id!=='H'?'<button class="ref" id="bt">REMOVER</button>':'<button id="bt" '+(((av&&PTS>0)||(PATH&&PTS>=cost))?'':'disabled')+'>'+(PATH?'ALOCAR CAMINHO':'ALOCAR')+'</button>'}</div>`;
 document.getElementById('bt').onclick=()=>{if(on){if(n.id==='H')return;ALLOC.delete(i);PTS++;}else if(av&&PTS>0){ALLOC.add(i);PTS--;}else if(PATH&&PTS>=cost){PATH.forEach(p=>{if(!ALLOC.has(p)){ALLOC.add(p);PTS--;}});}document.getElementById('pl').textContent=PTS;sumUI();draw();showSheet(i);};
 draw();}
let S=.9,tx=0,ty=0;const pointers=new Map();let lastD=0,moved=0;
function apply(){vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${S})`);svg.classList.toggle('lowz',S<.62);const k=Math.max(svg.clientWidth/390,svg.clientHeight/700)||1;svg.style.setProperty('--ls',Math.min(22,11/(S*k)));svg.style.setProperty('--vs',Math.min(16,9/(S*k)));}
function fit(z,cx,cy){S=z;tx=195-(cx==null?500:cx)*S;ty=350-(cy==null?500:cy)*S;apply();}
const K=()=>Math.max(svg.clientWidth/390,svg.clientHeight/700);
svg.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);moved=0;lastD=0;});
svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;const k=K();
 if(pointers.size===1){tx+=dx/k;ty+=dy/k;moved+=Math.abs(dx)+Math.abs(dy);apply();}
 else if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD){const f=d/lastD;const r=svg.getBoundingClientRect();const mx=((a.x+b.x)/2-r.left)/k,my=((a.y+b.y)/2-r.top)/k;const ns=Math.max(.28,Math.min(2.6,S*f));tx=mx-(mx-tx)*ns/S;ty=my-(my-ty)*ns/S;S=ns;apply();}lastD=d;moved+=10;}});
const up=e=>{const wasTap=moved<6&&pointers.size===1;pointers.delete(e.pointerId);if(wasTap){const t=document.elementFromPoint(e.clientX,e.clientY);const g=t&&t.closest&&t.closest('.nd');if(g)showSheet(g.dataset.id);else{sel=null;sheet.className='';draw();}}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
svg.addEventListener('wheel',e=>{e.preventDefault();const k=K();const r=svg.getBoundingClientRect();const mx=(e.clientX-r.left)/k,my=(e.clientY-r.top)/k;const ns=Math.max(.28,Math.min(2.6,S*(e.deltaY<0?1.15:.87)));tx=mx-(mx-tx)*ns/S;ty=my-(my-ty)*ns/S;S=ns;apply();},{passive:false});
document.getElementById('zi').onclick=()=>fit(Math.min(2.6,S*1.25),500,500);
document.getElementById('zo').onclick=()=>fit(Math.max(.28,S/1.25),500,500);
document.getElementById('zf').onclick=()=>fit(.33,500,500);
document.getElementById('pl').textContent=PTS;
draw();sumUI();
document.getElementById('lgb').onclick=()=>document.querySelector('.leg').classList.toggle('show');
const q=new URLSearchParams(location.search);
fit(+(q.get('z')||.33),q.get('cx')?+q.get('cx'):500,q.get('cy')?+q.get('cy'):500);
if(q.get('f')){filt=q.get('f');document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x.dataset.k===filt));draw();}
if(q.get('sel'))showSheet(q.get('sel'));
window.__N=N;
</script></body></html>
