<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Árvore de Passivas · Mockup</title>
<style>
@font-face{font-family:PX;src:url(../assets/fonts/PixelifySans-400.ttf);font-weight:400}
@font-face{font-family:PX;src:url(../assets/fonts/PixelifySans-700.ttf);font-weight:700}
:root{--ouro:#d9b45f;--ouroC:#f3d98e;--bg:#0c0a12;--panel:#17131f;--lin:#3a3040}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#e9e2d0;font-family:PX,system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:none;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;background:linear-gradient(#241c2e,#120e19);border-bottom:2px solid var(--ouro);z-index:5}
.row{display:flex;align-items:center;gap:8px}
h1{margin:0;font:700 14px PX;letter-spacing:.14em;text-transform:uppercase;color:var(--ouroC);flex:1}
.pts{font:700 13px PX;color:#fff;background:#0d0a12;border:2px solid var(--ouro);padding:3px 9px}
.pts b{color:#ffd070}
.x{width:28px;height:28px;border:2px solid var(--ouro);background:#1c1822;color:var(--ouroC);font:700 16px PX;line-height:22px;text-align:center}
.chips{display:flex;gap:5px;margin-top:7px;overflow:auto;scrollbar-width:none}
.chips button{flex:none;font:700 10px PX;letter-spacing:.06em;padding:5px 9px;border:2px solid #4a3f56;background:#14101b;color:#b8aec4}
.chips button.on{border-color:var(--c,#ffd070);color:#fff;background:#241c2e;box-shadow:0 0 8px var(--c,#ffd070)}
#stage{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#221a30 0,#120d1b 55%,#09070e 100%)}
svg{width:100%;height:100%;display:block}
.edge{stroke:#2e2838;stroke-width:4;stroke-linecap:round;fill:none}
.edge.on{stroke:#ffcf6a;filter:url(#glow)}
.edge.av{stroke:#5a4a2a}
.nd{cursor:pointer}
.nd .base{fill:#171220;stroke:#4a3f56;stroke-width:3}
.nd.lock{opacity:.7}
.nd.av .ring{opacity:1;animation:pulse 1.4s ease-in-out infinite}
.ring{fill:none;stroke:#ffe08a;stroke-width:2.5;opacity:0}
@keyframes pulse{50%{opacity:.35}}
.nd.on .base{stroke:var(--c);filter:url(#glow)}
.nd.dim{opacity:.18}
.nd.hl .base{stroke:#fff;stroke-width:4}
.lbl{font:700 11px PX;fill:#e9e2d0;text-anchor:middle;paint-order:stroke;stroke:#0a0710;stroke-width:3.5px;pointer-events:none}
.lbl.k{fill:#ffd9a0;font-size:12px}
.lbl.c{fill:#e2c8ff}
.tag{font:700 8px PX;fill:#9a8fa8;text-anchor:middle;paint-order:stroke;stroke:#0a0710;stroke-width:3px;pointer-events:none}
#sheet{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#211a2b,#130f1b);border:2px solid var(--c,var(--ouro));box-shadow:0 0 0 2px #000,0 8px 24px #000b;padding:10px 12px 12px;display:none;z-index:6}
#sheet.show{display:block}
#sheet .t{display:flex;gap:10px;align-items:center}
#sheet .ic{width:46px;height:46px;border:2px solid var(--c);background:#0d0a12;flex:none;display:grid;place-items:center;overflow:hidden}
#sheet .ic img{width:100%;height:100%;image-rendering:pixelated}
#sheet h2{margin:0;font:700 15px PX;color:#fff;letter-spacing:.04em}
#sheet .bd{font:700 9px PX;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
#sheet ul{list-style:none;margin:8px 0 0;padding:0;font:400 12px/1.5 PX;color:#d8d0c0}
#sheet li.g{color:#9be39b}#sheet li.r{color:#ff9a8a}#sheet li.n{color:#bdb3cc;font-style:italic}
#sheet .acts{display:flex;gap:8px;margin-top:10px;align-items:center}
#sheet .req{flex:1;font:400 11px PX;color:#9a8fa8}
#sheet button{font:700 12px PX;letter-spacing:.08em;padding:9px 16px;border:2px solid #8ef08a;background:#2f5a2a;color:#fff}
#sheet button[disabled]{border-color:#555;background:#26222b;color:#777}
#sheet button.ref{border-color:#ff9a8a;background:#4a2424}
.leg{position:absolute;left:8px;bottom:8px;background:#120e19cc;border:1px solid var(--lin);padding:6px 8px;font:400 10px/1.7 PX;color:#b8aec4;z-index:3}
.leg i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;border:2px solid #aaa;background:#171220}
.zoomb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoomb button{width:34px;height:34px;border:2px solid var(--ouro);background:#1c1822;color:var(--ouroC);font:700 18px PX}
</style></head><body>

  <div id="sheet"></div>

(function(){const bg=document.getElementById('bg');
 [120,260,400,520].forEach(r=>el('circle',{cx:500,cy:500,r,fill:'none',stroke:'#241c30','stroke-width':2,'stroke-dasharray':'2 10'},bg));

 N.forEach(n=>{const on=ALLOC.has(n.id),av=avail(n),lock=!on&&!av;const g=el('g',{class:'nd '+(on?'on ':'')+(av?'av ':'')+(lock?'lock ':'')+(filt!=='todos'&&!FILT[filt](n)&&n.type!=='h'?'dim ':'')+(sel===n.id?'hl':''),style:'--c:'+n.col,'data-id':n.id},gN);

}
// chips
(function(){const c=document.getElementById('chips');Object.keys(FILT).forEach(k=>{const b=document.createElement('button');b.textContent=FNAME[k];b.dataset.k=k;if(k==='todos')b.classList.add('on');b.style.setProperty('--c',k==='combo'?'#c98bff':k==='atk'?'#ff7a4a':k==='def'?'#7ab8ff':k==='util'?'#ffd070':k==='attr'?'#9be39b':'#ffd070');b.onclick=()=>{filt=k;c.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===k));draw();};c.appendChild(b);});})();
// folha de informação
const sheet=document.getElementById('sheet');
const TYPE={s:'Passiva',a:'Atributo',n:'Destaque',c:'Destaque de combo',k:'Pedra angular',x:'Subclasse (bloqueada)',h:'Início'};
function showSheet(id){sel=id;const n=M[id];const on=ALLOC.has(id),av=avail(n);
 sheet.style.setProperty('--c',n.col);sheet.className='show';
 const lis=n.desc.map(d=>Array.isArray(d)?`<li class="${d[1]}">${d[0]}</li>`:`<li class="${d==='COMBO'||/^COMBO/.test(d)?'n':'g'}">${d}</li>`).join('');
 const why=n.type==='x'?'Requer nível 10 e subclasse':on?'Alocada':av?'Custa 1 ponto':'Conecte a um nó alocado';
 sheet.innerHTML=`<div class="t"><div class="ic">${n.ic?`<img src="${n.ic}">`:`<span style="font:700 22px PX;color:${n.col}">${n.type==='a'?'◆':n.type==='x'?'🔒':n.type==='h'?'⚔':'●'}</span>`}</div><div><div class="bd">${TYPE[n.type]}</div><h2>${n.nm}</h2></div></div><ul>${lis}</ul><div class="acts"><div class="req">${why}</div>${on&&n.id!=='H'?'<button class="ref" id="bt">REMOVER</button>':'<button id="bt" '+((av&&PTS>0)?'':'disabled')+'>ALOCAR</button>'}</div>`;
 document.getElementById('bt').onclick=()=>{if(on){if(n.id==='H')return;ALLOC.delete(id);PTS++;}else if(av&&PTS>0){ALLOC.add(id);PTS--;}document.getElementById('pl').textContent=PTS;draw();showSheet(id);};
 draw();}
// pan/zoom
let S=.9,tx=0,ty=0;const pointers=new Map();let lastD=0,moved=0;
function apply(){const W=svg.clientWidth,H=svg.clientHeight,k=Math.max(W/390,H/700);vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${S})`);}
function fit(z,cx,cy){const W=svg.clientWidth,H=svg.clientHeight,k=Math.max(W/390,H/700),vw=390,vh=700;
 // converte coordenadas da arvore para viewBox
 S=z;const sx=cx==null?500:cx,sy=cy==null?500:cy;tx=vw/2-sx*S;ty=vh/2-sy*S;apply();}
svg.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);moved=0;lastD=0;});
svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 const W=svg.clientWidth,H=svg.clientHeight,k=Math.max(W/390,H/700);
 if(pointers.size===1){tx+=dx/k;ty+=dy/k;moved+=Math.abs(dx)+Math.abs(dy);apply();}
 else if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD){const f=d/lastD;const mx=((a.x+b.x)/2-svg.getBoundingClientRect().left)/k,my=((a.y+b.y)/2-svg.getBoundingClientRect().top)/k;const ns=Math.max(.35,Math.min(2.6,S*f));tx=mx-(mx-tx)*ns/S;ty=my-(my-ty)*ns/S;S=ns;apply();}lastD=d;moved+=10;}});
const up=e=>{const wasTap=moved<6&&pointers.size===1;pointers.delete(e.pointerId);if(wasTap){const t=document.elementFromPoint(e.clientX,e.clientY);const g=t&&t.closest&&t.closest('.nd');if(g)showSheet(g.dataset.id);else{sel=null;sheet.className='';draw();}}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
svg.addEventListener('wheel',e=>{e.preventDefault();const k=Math.max(svg.clientWidth/390,svg.clientHeight/700);const r=svg.getBoundingClientRect();const mx=(e.clientX-r.left)/k,my=(e.clientY-r.top)/k;const ns=Math.max(.35,Math.min(2.6,S*(e.deltaY<0?1.15:.87)));tx=mx-(mx-tx)*ns/S;ty=my-(my-ty)*ns/S;S=ns;apply();},{passive:false});
document.getElementById('zi').onclick=()=>{S=Math.min(2.6,S*1.25);fit(S,null,null);};
document.getElementById('zo').onclick=()=>{S=Math.max(.35,S/1.25);fit(S,null,null);};
document.getElementById('zf').onclick=()=>fit(.55,500,500);
draw();
const q=new URLSearchParams(location.search);
fit(+(q.get('z')||.6),q.get('cx')?+q.get('cx'):500,q.get('cy')?+q.get('cy'):500);
if(q.get('f')){filt=q.get('f');document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x.dataset.k===filt));draw();}
if(q.get('sel'))showSheet(q.get('sel'));
</script></body></html>
